# Colour palettes for vertical shorts. The generator computes WCAG contrast for every
# text/background pair (worst case over unknown video for semi-transparent panels) and only
# emits pairs that reach 4.5:1, or 3:1 for text that is both >= 24 px and bold.
# Roles: background (deepest base), surface (cards), panel_tint (frosted panel colour),
# text (captions), title (hook), keyword (emphasis), accent, accent_2, stroke (outlines),
# light (light leaks / glows), particle (dust, bokeh). ramp: five stops dark -> light used to
# recolour procedural backgrounds. mood decides which backgrounds and looks it suits.

house_yellow_night:
  name: House yellow on night glass
  mode: dark
  mood: [house, calm, science, history, space, nature]
  panel_opacity: 0.62
  colors: {background: "#0B1220", surface: "#162033", panel_tint: "#0B1220", text: "#FFFFFF", title: "#FFD21F",
           keyword: "#FFD21F", accent: "#2EC4B6", accent_2: "#FF7A59", stroke: "#000000", light: "#FFB347", particle: "#FFE8A3"}
  gradient: ["#0B1220", "#1F4E79"]
  ramp: ["#060B14", "#0B1220", "#1F4E79", "#2EC4B6", "#E8F7FF"]
  notes: The house default. Bold yellow hook (#FFD21F) and keyword pops over a dark navy frosted panel.

