  sizes: {title_px: 56, caption_px: 56, min_caption_px: 44, label_px: 40, number_px: 72}
  mood: [retro, energetic]
  why: Press Start 2P is very wide (about 1 em per character) so keep hooks to 2-3 short words; Pixelify Sans is easier to read in captions.
marker_patrickhand:
  name: Permanent Marker + Patrick Hand
  display: {family: Permanent Marker, weight: 400, case: as-written}
  text: {family: Patrick Hand, weight: 400}
  sizes: {title_px: 84, caption_px: 64, min_caption_px: 52, label_px: 56, number_px: 110}
  mood: [comic, education, relationships]
