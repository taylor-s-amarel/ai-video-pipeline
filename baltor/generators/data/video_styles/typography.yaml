  text: {family: IBM Plex Sans, weight: 700}
  sizes: {title_px: 76, caption_px: 56, min_caption_px: 44, label_px: 44, number_px: 96}
  mood: [science, tech, education]
  why: Technical drawing feel for blueprint and engineering looks.
atkinson_hyperlegible:
  name: Atkinson Hyperlegible (bold + regular)
  display: {family: Atkinson Hyperlegible, weight: 700, case: as-written}
  text: {family: Atkinson Hyperlegible, weight: 700}
  sizes: {title_px: 80, caption_px: 56, min_caption_px: 46, label_px: 50, number_px: 104}
  mood: [education, news, house]
  why: Designed for readers with low vision; letters that are easy to confuse (I/l/1, O/0) are distinct.
typewriter_archive:
