      - [4, photo, photo, "asset:photo", 0.98, normal, ken-burns, {camera: camera_ken_burns_slow_in_center, feather_px: 40, corner_radius_px: 20, rect: photo}]
      - [5, title_panel, panel, "panel:title", 0.62, normal, static, {backing: frosted-glass}]
      - [6, title_text, title, "title:house_yellow_hook", 0.98, normal, keyframed, {animation: text_anim_settle_in, visible_from_s: 0.0}]
      - [7, caption_panel, panel, "panel:caption", 0.62, normal, static, {backing: frosted-glass}]
      - [8, caption_text, caption, "caption:frosted_keyword_pop", 0.98, normal, keyframed, {animation: text_anim_fade_up_soft}]

