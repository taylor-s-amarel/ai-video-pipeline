# Layer stacks, bottom (z=1) to top. Row: [z, id, role, source, opacity, blend, motion, extras]
# source prefixes: bg:<background id>, grid:<grid id>, asset:<slot> (your photo or clip),
# title:<title id>, caption:<caption id>, anim:<text animation id>, panel:<what it backs>,
# solid:<palette role>, grade:<palette>, fx:<named effect described in the stack notes>.
# {slot} values come from the stack's theme. Every opacity is <= 0.98 (house rule).

themes:
  ocean: {label: Ocean, primary: ocean_waves, secondary: sunlit_water, rays: underwater_rays, cells: nature, palette: ocean_deep}
  meadow: {label: Meadow, primary: meadow_wind, secondary: cloud_timelapse, rays: forest_sunbeams, cells: nature, palette: house_yellow_night}
  sunlit_water: {label: Sunlit water, primary: sunlit_water, secondary: ocean_waves, rays: underwater_rays, cells: calm, palette: ocean_deep}
  coastal: {label: Coastal, primary: coastal_aerial, secondary: ocean_waves, rays: forest_sunbeams, cells: nature, palette: house_yellow_night}
  night_city: {label: Night city, primary: city_night_bokeh, secondary: rain_on_glass, rays: light_leaks, cells: night, palette: house_yellow_night}
  forest: {label: Forest, primary: forest_sunbeams, secondary: meadow_wind, rays: forest_sunbeams, cells: nature, palette: house_yellow_night}
  space: {label: Space, primary: starfield_drift, secondary: aurora_ribbons, rays: light_leaks, cells: night, palette: space_violet}
  aurora: {label: Aurora, primary: aurora_ribbons, secondary: starfield_drift, rays: light_leaks, cells: night, palette: space_violet}
  underwater: {label: Underwater, primary: underwater_rays, secondary: sunlit_water, rays: underwater_rays, cells: calm, palette: ocean_deep}
  clouds: {label: Clouds, primary: cloud_timelapse, secondary: atmospheric_haze, rays: light_leaks, cells: calm, palette: house_yellow_night}

stacks:
  house_30_reference:
    name: House 30-layer reference stack
    theme: ocean
    house: true
    summary: The full 30-layer reference for house-style shorts; every layer under 98% opacity, a moving background throughout, the photo at 90% width with a feathered edge.
    layers:
      - [1, base_gradient, base, "bg:gradient_drift", 0.98, normal, drift]
      - [2, footage_primary, background-video, "bg:{primary}", 0.92, normal, loop]
      - [3, footage_secondary, background-video, "bg:{secondary}", 0.35, soft-light, loop]
      - [4, motion_grid, grid-2x2, "grid:even_feathered", 0.35, screen, loop, {cells: "{cells}"}]
      - [5, haze, haze, "bg:atmospheric_haze", 0.22, screen, drift]
      - [6, light_leaks, light, "bg:light_leaks", 0.28, screen, drift]
      - [7, bokeh_far, particles, "bg:bokeh_drift", 0.22, screen, rise]
      - [8, dust, particles, "bg:dust_particles", 0.3, screen, rise]
      - [9, light_rays, light, "bg:{rays}", 0.18, screen, sway]
      - [10, colour_wash, overlay, "solid:accent", 0.12, soft-light, pulse, {opacity_keyframes: [[0, 0.08], [4, 0.14], [8, 0.08]]}]
      - [11, vignette, vignette, "bg:vignette_breathe", 0.5, multiply, pulse]
      - [12, photo_shadow, shadow, "fx:photo_shadow", 0.45, multiply, follow, {follows: photo, blur_px: 40, offset_px: [0, 18]}]
      - [13, photo, photo, "asset:photo", 0.98, normal, ken-burns, {camera: camera_ken_burns_in_upper_third, feather_px: 48, corner_radius_px: 24, rect: photo}]
      - [14, photo_rim_light, light, "fx:rim_light", 0.2, screen, follow, {follows: photo}]
      - [15, photo_grain, grain, "bg:film_grain", 0.08, overlay, loop, {rect: photo}]
      - [16, bokeh_near, particles, "bg:bokeh_drift", 0.16, screen, parallax, {speed: 1.4, scale: 1.6}]
      - [17, title_shadow, shadow, "fx:panel_shadow", 0.3, multiply, static, {follows: title_panel}]
      - [18, title_panel, panel, "panel:title", 0.62, normal, static, {backing: frosted-glass}]
      - [19, title_text, title, "title:house_yellow_hook", 0.98, normal, keyframed, {animation: text_anim_settle_in, visible_from_s: 0.0}]
      - [20, title_light_sweep, light, "fx:light_sweep", 0.25, add, keyframed, {window_s: [0.3, 0.9]}]
      - [21, label_panel, panel, "panel:label", 0.62, normal, keyframed, {animation: text_anim_springy_pop_overshoot}]
      - [22, label_text, label, "title:fact_number_label", 0.98, normal, keyframed, {animation: text_anim_springy_pop_overshoot}]
      - [23, key_number, number, "anim:count_up_number", 0.98, normal, keyframed]
      - [24, caption_panel, panel, "panel:caption", 0.62, normal, static, {backing: frosted-glass}]
      - [25, caption_text, caption, "caption:frosted_keyword_pop", 0.98, normal, keyframed, {animation: text_anim_fade_up_soft}]
      - [26, caption_keyword, caption, "anim:keyword_pop_house", 0.98, normal, keyframed]
      - [27, global_grain, grain, "bg:film_grain", 0.08, overlay, loop]
      - [28, edge_feather, vignette, "fx:edge_feather", 0.3, multiply, static]
      - [29, transition_flash, transition, "bg:light_leaks", 0.6, screen, keyframed, {opacity_keyframes: [[0, 0.0], [0.16, 0.6], [0.32, 0.0]], at: each cut}]
      - [30, colour_grade, grade, "grade:{palette}", 0.4, soft-light, static]

  lean_12_layer:
    name: Lean 12-layer stack
    theme: ocean
    house: true
    summary: Twelve layers that keep every house rule but render about three times faster than the 30-layer reference.
    layers:
      - [1, base_gradient, base, "bg:gradient_drift", 0.98, normal, drift]
      - [2, footage_primary, background-video, "bg:{primary}", 0.92, normal, loop]
      - [3, motion_grid, grid-2x2, "grid:even_feathered", 0.3, screen, loop, {cells: "{cells}"}]
      - [4, light_leaks, light, "bg:light_leaks", 0.28, screen, drift]
      - [5, dust, particles, "bg:dust_particles", 0.3, screen, rise]
      - [6, vignette, vignette, "bg:vignette_breathe", 0.5, multiply, pulse]
      - [7, photo, photo, "asset:photo", 0.98, normal, ken-burns, {camera: camera_ken_burns_slow_in_center, feather_px: 48, corner_radius_px: 24, rect: photo}]
      - [8, title_panel, panel, "panel:title", 0.62, normal, static, {backing: frosted-glass}]
      - [9, title_text, title, "title:house_yellow_hook", 0.98, normal, keyframed, {animation: text_anim_settle_in, visible_from_s: 0.0}]
      - [10, caption_panel, panel, "panel:caption", 0.62, normal, static, {backing: frosted-glass}]
      - [11, caption_text, caption, "caption:frosted_keyword_pop", 0.98, normal, keyframed, {animation: text_anim_fade_up_soft}]
      - [12, global_grain, grain, "bg:film_grain", 0.08, overlay, loop]

