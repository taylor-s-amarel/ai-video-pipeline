# Whole looks: a named combination of the other presets plus pacing. Every look keeps the
# standing rules: 60 s or longer, no layer above 98% opacity, a moving background throughout.
# Values are identities of components produced by the same generator.

house_facts_frosted:
  name: House facts (frosted, FACT N)
  use_for: [Women-in-history and science facts, Numbered fact lists, Biographies with real numbers]
  avoid: [Topics without sourced numbers]
  palette: house_yellow_night
  typography: type_pair_montserrat_inter
  caption: caption_frosted_keyword_pop
  title: title_house_yellow_hook
  label: title_fact_number_label
  stack: layer_stack_house_30_reference
  text_in: text_anim_fade_up_soft
  keyword: text_anim_keyword_pop_house
  camera: [camera_ken_burns_in_upper_third, camera_alternating_zoom_pair, camera_impact_punch_in]
  transitions: [transition_hard_cut_on_beat, transition_whip_pan_up, transition_impact_flash_white]
  thumbnail: thumb_house_yellow_hook_thumb
  pacing: {shot_s: [2.0, 4.0], words_per_minute: [140, 160], cut_on: sentence breaks and beats}
  house: true
