# The 36 background layers. Every one has a procedural ffmpeg recipe (in video_styles.py, keyed by
# id) so it renders with no downloads; footage-first layers also say how to find real footage with a
# licence that allows reuse. stops: gray value -> colour for the recipe's gradient map.
# recolor: ramp (map through a palette's five-stop ramp), overlay (black -> palette light colour),
# two_tone (palette background -> accent), none (colours are part of the look).
# role: where the layer usually sits in a stack (base, background-video, texture, light, particles,
# haze, grain, vignette, overlay, grid-2x2).

ocean_waves:
  name: Ocean waves
  category: footage
  role: background-video
  default_opacity: 0.92
  default_blend: normal
  recolor: ramp
  mood: [nature, calm, house]
  stops: [[0, "#04223F"], [110, "#0B5E8A"], [170, "#2FA4C8"], [230, "#C8F1FF"], [255, "#FFFFFF"]]
  footage: {search_terms: [ocean waves aerial, sea surface waves loop, waves top down], prefer: slow rolling swell, no people or logos}
  look: Rolling blue swell with bright foam crests drifting across the frame.
  use_when: [House-style facts, sea and travel topics, calm narration]

