# Caption styles. Colours are palette roles; the generator resolves them against
# default_palette (base item) or another palette (variants) and computes contrast.
# Sizes are pixels at a 1080 px wide reference frame; the generator rescales for other formats.

frosted_keyword_pop:
  name: Frosted glass captions with keyword pop (house)
  house: true
  default_palette: house_yellow_night
  font: {family: Inter, weight: 800, size_px: 60, min_size_px: 48, case: as-written}
  fill_role: text
  stroke: {role: stroke, width_px: 0}
  backing: {type: frosted-glass, tint_role: panel_tint, blur_px: 28, radius_px: 28, padding_px: [22, 36], feather_px: 16}
  layout: {max_width_fraction: 0.88, max_lines: 1, max_words: 7, align: center}
  emphasis: {mode: keyword-pop, color_role: keyword, scale_peak: 1.12, duration_ms: 180, easing: ease-out-back}
  timing: {sync_tolerance_ms: 150, min_on_screen_ms: 700, max_on_screen_ms: 3200}
  animation_in: text_anim_fade_up_soft
  keyword_animation: text_anim_keyword_pop_house
  use_when: [Any house-style short, Facts and explainers with narration, Footage or photos with busy detail behind the text]
  avoid_when: [Silent videos where viewers read long sentences, Comic looks that want outlined lettering]
  notes: >-
    One synced line at a time. The key word (a number, name or outcome) turns keyword colour and pops
    1.0 -> 1.12 -> 1.0 over 180 ms. No progress bars, stacked label panels or repeated section labels.

outline_bold_center:
  name: Bold outlined captions, centred
  default_palette: house_yellow_night
  font: {family: Montserrat, weight: 800, size_px: 70, min_size_px: 56, case: upper}
  fill_role: text
  stroke: {role: stroke, width_px: 7}
  backing: {type: none}
  layout: {center_y_fraction: 0.62, max_width_fraction: 0.86, max_lines: 2, max_words: 4, align: center}
  emphasis: {mode: color, color_role: keyword, scale_peak: 1.0, duration_ms: 0, easing: linear}
  timing: {sync_tolerance_ms: 120, min_on_screen_ms: 500, max_on_screen_ms: 2000}
  animation_in: text_anim_springy_pop_overshoot
  use_when: [Fast talking-head or gameplay clips, Bright footage where a panel would hide too much]
  avoid_when: [Thin or detailed fonts (the outline needs a heavy weight), Long sentences]
  notes: >-
    The 7 px outline carries the contrast, so the fill/outline pair is what the contrast check
    measures. Keep the outline at least 10% of the font size.

karaoke_word_highlight:
  name: Karaoke word highlight
  default_palette: house_yellow_night
  font: {family: Inter, weight: 800, size_px: 58, min_size_px: 46, case: as-written}
  fill_role: text
  stroke: {role: stroke, width_px: 0}
  backing: {type: frosted-glass, tint_role: panel_tint, blur_px: 24, radius_px: 24, padding_px: [20, 32], feather_px: 14}
  layout: {max_width_fraction: 0.88, max_lines: 1, max_words: 6, align: center}
  emphasis: {mode: box-current-word, color_role: keyword, text_role: background, box_opacity: 0.95, scale_peak: 1.04, duration_ms: 120, easing: ease-out}
  timing: {sync_tolerance_ms: 100, min_on_screen_ms: 700, max_on_screen_ms: 3000}
  animation_in: text_anim_fade_up_soft
  use_when: [Narration with word timestamps from TTS or alignment, Language learning and read-along content]
  avoid_when: [No word-level timestamps (the box would drift from the voice)]
  notes: The word being spoken sits in a rounded keyword-colour box with dark text; the box moves word to word.

solid_band_lower:
  name: Solid lower band (two lines)
  default_palette: news_contrast
  font: {family: Roboto, weight: 700, size_px: 50, min_size_px: 42, case: as-written}
  fill_role: text
  stroke: {role: stroke, width_px: 0}
  backing: {type: solid, tint_role: panel_tint, blur_px: 0, radius_px: 0, padding_px: [18, 30], feather_px: 0, full_width: true}
  layout: {max_width_fraction: 1.0, max_lines: 2, max_words: 14, align: center}
  emphasis: {mode: none, color_role: keyword, scale_peak: 1.0, duration_ms: 0, easing: linear}
  timing: {sync_tolerance_ms: 150, min_on_screen_ms: 1200, max_on_screen_ms: 6000}
  animation_in: text_anim_fade_up_soft
  use_when: [Landscape (16:9) explainers, Interviews and quotes where full sentences matter]
  avoid_when: [House-style shorts (one line rule)]

pill_per_line:
  name: Rounded pill captions
  default_palette: sunset_coral
  font: {family: Fredoka, weight: 600, size_px: 58, min_size_px: 46, case: as-written}
  fill_role: text
  stroke: {role: stroke, width_px: 0}
  backing: {type: pill, tint_role: panel_tint, blur_px: 12, radius_px: 999, padding_px: [18, 40], feather_px: 6}
  layout: {max_width_fraction: 0.86, max_lines: 1, max_words: 6, align: center}
  emphasis: {mode: color, color_role: keyword, scale_peak: 1.06, duration_ms: 160, easing: ease-out}
  timing: {sync_tolerance_ms: 150, min_on_screen_ms: 700, max_on_screen_ms: 3000}
  animation_in: text_anim_springy_pop_overshoot
  use_when: [Friendly topics (relationships, pets, lifestyle), Rounded typefaces]
  avoid_when: [Serious news and history]

boxed_keyword:
  name: Outlined captions with boxed keyword
  default_palette: house_yellow_night
  font: {family: Archivo Black, weight: 900, size_px: 60, min_size_px: 48, case: upper}
  fill_role: text
  stroke: {role: stroke, width_px: 6}
  backing: {type: none}
  layout: {max_width_fraction: 0.86, max_lines: 2, max_words: 5, align: center}
  emphasis: {mode: box-keyword, color_role: keyword, text_role: background, box_opacity: 0.95, scale_peak: 1.08, duration_ms: 160, easing: ease-out-back}
  timing: {sync_tolerance_ms: 120, min_on_screen_ms: 600, max_on_screen_ms: 2400}
  animation_in: text_anim_springy_pop_overshoot
  use_when: [Top-N lists and numbers, Punchy hooks where one word carries the point]
  avoid_when: [Light palettes with white outlines on white footage]

two_tone_emphasis:
  name: Two-tone emphasis on frosted glass
  default_palette: ocean_deep
  font: {family: Inter, weight: 700, size_px: 58, min_size_px: 46, case: as-written}
  fill_role: text
  stroke: {role: stroke, width_px: 0}
  backing: {type: frosted-glass, tint_role: panel_tint, blur_px: 26, radius_px: 26, padding_px: [20, 34], feather_px: 14}
  layout: {max_width_fraction: 0.88, max_lines: 1, max_words: 7, align: center}
  emphasis: {mode: color, color_role: keyword, scale_peak: 1.0, duration_ms: 0, easing: linear}
  timing: {sync_tolerance_ms: 150, min_on_screen_ms: 700, max_on_screen_ms: 3200}
  animation_in: text_anim_fade_up_soft
  use_when: [Calm explainers where motion on every keyword would distract]
  avoid_when: [Hype edits that need energy]

uppercase_impact:
  name: Uppercase impact (condensed)
  default_palette: news_contrast
  font: {family: Anton, weight: 400, size_px: 84, min_size_px: 64, case: upper}
  fill_role: text
  stroke: {role: stroke, width_px: 8}
  shadow: {opacity: 0.55, blur_px: 14, offset_px: [0, 6]}
  backing: {type: none}
  layout: {max_width_fraction: 0.84, max_lines: 1, max_words: 3, align: center}
  emphasis: {mode: color, color_role: keyword, scale_peak: 1.0, duration_ms: 0, easing: linear}
  timing: {sync_tolerance_ms: 100, min_on_screen_ms: 400, max_on_screen_ms: 1600}
  animation_in: text_anim_kinetic_slam
  use_when: [Quick-cut edits, Sports, countdowns and reveals]
  avoid_when: [Calm narration (three words at a time feels frantic)]
  notes: Anton has a single (regular) weight that is already heavy; the outline is 8 px.

subtitle_accessible:
  name: Accessible subtitles (two lines)
  default_palette: mono_high_contrast
  font: {family: Atkinson Hyperlegible, weight: 700, size_px: 52, min_size_px: 44, case: as-written}
  fill_role: text
  stroke: {role: stroke, width_px: 0}
  backing: {type: solid, tint_role: panel_tint, blur_px: 0, radius_px: 12, padding_px: [16, 26], feather_px: 0}
  layout: {max_width_fraction: 0.9, max_lines: 2, max_words: 14, align: center}
  emphasis: {mode: none, color_role: keyword, scale_peak: 1.0, duration_ms: 0, easing: linear}
  timing: {sync_tolerance_ms: 150, min_on_screen_ms: 1200, max_on_screen_ms: 6000}
  animation_in: text_anim_fade_up_soft
  use_when: [Accessibility-first edits, Translated or bilingual subtitles, Viewers watching without sound]
  avoid_when: [Hook-driven house shorts that need one punchy line]
  notes: Atkinson Hyperlegible was designed for low-vision readers; keep line breaks at phrase boundaries.

typewriter_mono:
  name: Typewriter captions on paper
  default_palette: warm_paper_sepia
  font: {family: Courier Prime, weight: 700, size_px: 50, min_size_px: 42, case: as-written}
  fill_role: text
  stroke: {role: stroke, width_px: 0}
  backing: {type: solid, tint_role: panel_tint, blur_px: 0, radius_px: 6, padding_px: [16, 28], feather_px: 4}
  layout: {max_width_fraction: 0.88, max_lines: 2, max_words: 10, align: left}
  emphasis: {mode: underline, color_role: keyword, scale_peak: 1.0, duration_ms: 0, easing: linear}
  timing: {sync_tolerance_ms: 200, min_on_screen_ms: 1200, max_on_screen_ms: 5000}
  animation_in: text_anim_typewriter
  use_when: [Today-in-history, Letters and diaries, Archive documents]
  avoid_when: [Fast narration (characters appear at 18 per second)]

handwritten_note:
  name: Handwritten note captions
  default_palette: meadow_morning
  font: {family: Patrick Hand, weight: 400, size_px: 64, min_size_px: 52, case: as-written}
  fill_role: text
  stroke: {role: stroke, width_px: 0}
  backing: {type: scrim, tint_role: panel_tint, blur_px: 0, radius_px: 18, padding_px: [14, 28], feather_px: 22}
  layout: {max_width_fraction: 0.86, max_lines: 1, max_words: 7, align: center}
  emphasis: {mode: underline, color_role: keyword, scale_peak: 1.0, duration_ms: 0, easing: linear}
  timing: {sync_tolerance_ms: 150, min_on_screen_ms: 800, max_on_screen_ms: 3200}
  animation_in: text_anim_mask_reveal_up
  use_when: [Stick-figure and doodle stories, Personal tips]
  avoid_when: [Serious or formal topics]
  notes: Patrick Hand has one weight; its contrast check uses the regular-weight threshold (4.5:1).

neon_glow:
  name: Neon glow captions
  default_palette: neon_night
  font: {family: Righteous, weight: 400, size_px: 60, min_size_px: 48, case: as-written}
  fill_role: text
  stroke: {role: stroke, width_px: 0}
  shadow: {role: accent, opacity: 0.85, blur_px: 18, offset_px: [0, 0]}
  backing: {type: frosted-glass, tint_role: panel_tint, blur_px: 30, radius_px: 22, padding_px: [20, 34], feather_px: 18}
  layout: {max_width_fraction: 0.88, max_lines: 1, max_words: 6, align: center}
  emphasis: {mode: glow, color_role: keyword, scale_peak: 1.08, duration_ms: 200, easing: ease-out}
  timing: {sync_tolerance_ms: 150, min_on_screen_ms: 700, max_on_screen_ms: 3000}
  animation_in: text_anim_blur_in_focus
  use_when: [AI and tech explainers, Synthwave and night looks]
  avoid_when: [Light palettes (a glow needs darkness around it)]

sticker_label:
  name: Sticker label captions
  default_palette: comic_primary
  font: {family: Lilita One, weight: 400, size_px: 62, min_size_px: 50, case: as-written}
  fill_role: text
  stroke: {role: stroke, width_px: 0}
  backing: {type: sticker, tint_role: accent_2, opacity: 0.95, blur_px: 0, radius_px: 16, padding_px: [16, 30], feather_px: 0, rotation_deg: -2}
  layout: {max_width_fraction: 0.84, max_lines: 1, max_words: 5, align: center}
  emphasis: {mode: color, color_role: accent, scale_peak: 1.0, duration_ms: 0, easing: linear}
  timing: {sync_tolerance_ms: 150, min_on_screen_ms: 700, max_on_screen_ms: 2600}
  animation_in: text_anim_bounce_in_from_below
  use_when: [Comic and cartoon stories, Kids and pets topics]
  avoid_when: [Documentary tone]
  notes: The sticker is a 95% opaque keyword-colour card tilted 2 degrees; text contrast is measured against it.

gradient_scrim_minimal:
  name: Minimal captions on a soft gradient scrim
  default_palette: forest_canopy
  font: {family: Inter, weight: 700, size_px: 56, min_size_px: 46, case: as-written}
  fill_role: text
  stroke: {role: stroke, width_px: 0}
  backing: {type: scrim, tint_role: background, blur_px: 0, radius_px: 0, padding_px: [40, 40], feather_px: 120, full_width: true}
  layout: {max_width_fraction: 0.88, max_lines: 1, max_words: 7, align: center}
  emphasis: {mode: color, color_role: keyword, scale_peak: 1.0, duration_ms: 0, easing: linear}
  timing: {sync_tolerance_ms: 150, min_on_screen_ms: 700, max_on_screen_ms: 3200}
  animation_in: text_anim_fade_up_soft
  use_when: [Cinematic nature footage you do not want to box in]
  avoid_when: [Bright skies or snow at the caption position unless the scrim is dense enough]
  notes: >-
    A full-width gradient (transparent at its edge, palette opacity at the text line) sits behind the
    caption region. The contrast check uses the scrim opacity at the text line.

word_by_word_pop:
  name: One big word at a time
  default_palette: house_yellow_night
  font: {family: Anton, weight: 400, size_px: 120, min_size_px: 96, case: upper}
  fill_role: text
  stroke: {role: stroke, width_px: 10}
  backing: {type: none}
  layout: {center_y_fraction: 0.55, max_width_fraction: 0.86, max_lines: 1, max_words: 1, align: center}
  emphasis: {mode: color, color_role: keyword, scale_peak: 1.0, duration_ms: 0, easing: linear}
  timing: {sync_tolerance_ms: 80, min_on_screen_ms: 180, max_on_screen_ms: 900}
  animation_in: text_anim_springy_pop_overshoot
  use_when: [Hype intros and hooks, Short emphatic sentences]
  avoid_when: [Narration faster than about 3 words per second (words flash too briefly)]
