- id: narration_voice-001
  question: "Is there narration, and what share of the runtime is covered by speech?"
  why: "Fills narration coverage; drives how much script is needed."
  how: "Sum of evidence.audio.speech_segments durations / source.duration_s (video_re_speech_segments)."
  evidence: ["evidence.audio.speech_segments", "evidence.source.duration_s"]
  ir_path: "/audio/narration/coverage_ratio"
  type: ratio
  challenge: "Voice activity detectors flag sung vocals and dense music; check two segments on an A1 spectrogram."

- id: narration_voice-002
  question: "Does the voice sound synthetic (text-to-speech) or recorded human speech?"
  choices: [synthetic, human, mixed, not-determinable]
  why: "Tells the pipeline whether a TTS engine can match the delivery."
  how: "Inspect A1 spectrograms of 3 sentences: very regular pitch contours, identical prosody on repeated phrases and absent breaths suggest TTS. Method is always inferred."
  evidence: ["A1 on 3 sentences"]
  ir_path: "/audio/narration/source_kind"
  type: enum
  challenge: "Modern TTS can be indistinguishable; confidence above 0.6 needs at least two independent cues."

- id: narration_voice-003
  question: "What is the pitch register of the voice (low, mid, high) and the approximate fundamental frequency range?"
  why: "Guides voice selection without identifying anyone."
  how: "Read the lowest harmonic band on A1 spectrograms (or use librosa.pyin if installed, marked measured). Report Hz range."
  evidence: ["A1 spectrograms"]
  ir_path: "/audio/narration/pitch_register"
  type: object
  challenge: "Answers that infer gender, age or ethnicity are rejected; only pitch and delivery are allowed."

- id: narration_voice-004
  question: "What is the speaking rate in words per minute of speech time?"
  why: "Fills audio.words_per_minute."
  how: "Read evidence.audio.speech_wpm (video_re_speech_rate); state whether it divides by speech time or by runtime."
  evidence: ["evidence.audio.speech_wpm"]
  ir_path: "/audio/words_per_minute"
  type: number
  challenge: "Recompute from caption word count / total speech segment minutes; a mismatch above 10% needs an explanation."

- id: narration_voice-005
  question: "How much does speaking rate vary across beats (wpm per beat role)?"
  why: "Becomes per-beat rate targets."
  how: "Words per beat (captions) / speech time per beat."
  evidence: ["evidence.captions[]", "evidence.audio.speech_segments", "timeline beats"]
  ir_path: "/audio/narration/wpm_by_beat"
  type: object
  challenge: "Beats with under 10 words give unstable rates; mark them."

- id: narration_voice-006
  question: "How long are pauses between sentences and between items (median ms each)?"
  why: "Sets pause lengths for the TTS plan."
  how: "Gaps between speech segments, split into within-item and at item boundaries."
  evidence: ["evidence.audio.speech_segments", "timeline beats"]
  ir_path: "/audio/narration/pause_ms"
  type: object
  challenge: "Confirm two gaps with A4 silencedetect."

- id: narration_voice-007
  question: "What is the dynamic range of the voice (momentary loudness spread during speech)?"
  why: "Sets compression targets for the narration chain."
  how: "A3 momentary loudness restricted to speech segments; report p10 and p90."
  evidence: ["A3", "evidence.audio.speech_segments"]
  ir_path: "/audio/narration/loudness_spread_db"
  type: object
  challenge: "Music under voice raises the floor; note the music level estimate."

- id: narration_voice-008
  question: "How are key words emphasised (louder, slower, higher pitch, pause before)?"
  why: "Becomes emphasis markup rules for TTS (SSML-like or engine-specific)."
  how: "Around 4 key numbers or words, compare A6 RMS, local rate and pitch (A1) with neighbouring words."
  evidence: ["A6", "A1"]
  ir_path: "/audio/narration/emphasis"
  type: list
  challenge: "Report the measurement per instance."

- id: narration_voice-009
  question: "What is the delivery style (conversational, announcer, documentary, energetic hype, calm explainer, whisper)?"
  choices: [conversational, announcer, documentary, hype, calm-explainer, whisper, other]
  why: "Fills delivery for voice selection."
  how: "Combine rate (004), pitch variation (A1), loudness spread (007) and pause pattern (006); method inferred."
  evidence: ["narration measurements"]
  ir_path: "/audio/narration/delivery"
  type: enum
  challenge: "Each style claim must cite at least two measurements."

- id: narration_voice-010
  question: "Are breaths audible between phrases or edited out?"
  choices: [audible, removed, mixed]
  why: "Becomes an editing rule for the narration track."
  how: "A1 spectrograms of pauses: broadband soft noise bursts before phrases are breaths."
  evidence: ["A1 on pauses"]
  ir_path: "/audio/narration/breaths"
  type: enum
  challenge: "Check 4 pauses."

- id: narration_voice-011
  question: "How is the voice processed (dry or with room reverb; heavy or light compression; de-essing)?"
  why: "Fills the voice processing chain."
  how: "A1: reverb tails extend energy after words end; compression shows narrow loudness spread (007); sibilance bands near 5-9 kHz."
  evidence: ["A1", "loudness spread"]
  ir_path: "/audio/narration/processing"
  type: object
  challenge: "Each processing claim needs its cue."

- id: narration_voice-012
  question: "Is the voice bright or warm (where is most energy, above or below about 1 kHz)?"
  choices: [bright, neutral, warm]
  why: "Fills EQ guidance."
  how: "A1 spectrogram energy distribution during speech; compare with A6 RMS after highpass=f=2000 versus lowpass=f=500."
  evidence: ["A1", "A6 filtered"]
  ir_path: "/audio/narration/tone"
  type: enum
  challenge: "Report the two filtered RMS values."

- id: narration_voice-013
  question: "Is the voice clearly dominant over music during speech (approximate level difference in dB)?"
  why: "Sets voice-to-music balance."
  how: "A5 mid versus side loudness during speech (stereo only), or A6 RMS during speech versus in speech gaps with music only."
  evidence: ["A5", "A6"]
  ir_path: "/audio/music_under_voice_db"
  type: number
  challenge: "Side-channel estimates fail when music is near mono; check A7 channels and say which method was used."

- id: narration_voice-014
  question: "How soon after a cut does speech start, when a sentence starts at a cut?"
  why: "Sets cut-to-voice latency."
  how: "For cuts followed by a speech segment start within 1 s, compute the delay; median."
  evidence: ["evidence.shots[]", "evidence.audio.speech_segments"]
  ir_path: "/audio/narration/cut_to_voice_ms"
  type: ms
  challenge: "Report n."

- id: narration_voice-015
  question: "How many distinct voices speak (narrator, characters, quoted speakers)?"
  why: "Decides how many voice slots the format needs."
  how: "A1 spectrograms: distinct pitch ranges and timbres; F1 frames for on-screen speakers."
  evidence: ["A1", "frames: F1"]
  ir_path: "/audio/narration/voice_count"
  type: integer
  challenge: "One narrator changing tone is one voice."

- id: narration_voice-016
  question: "Are pitch or character effects applied to voices (sped-up, robotic, telephone filter)?"
  why: "Adds voice effects."
  how: "A1 for formant shifts and band-limiting."
  evidence: ["A1"]
  ir_path: "/audio/narration/effects"
  type: list
  challenge: "Timestamp each effect."

- id: narration_voice-017
  question: "What is the noise floor in speech gaps without music (dBFS)?"
  why: "Sets the cleanliness target for narration."
  how: "A6 RMS in gaps where A1 shows no music."
  evidence: ["A6", "A1"]
  ir_path: "/audio/narration/noise_floor_db"
  type: number
  challenge: "If music fills every gap, answer not determinable."

- id: narration_voice-018
  question: "Do sentences end with falling intonation, rising intonation (upspeak), or flat?"
  choices: [falling, rising, flat, mixed]
  why: "Guides prosody settings."
  how: "A1: track the lowest harmonic in the last word of 6 sentences."
  evidence: ["A1"]
  ir_path: "/audio/narration/sentence_end_contour"
  type: enum
  challenge: "Questions naturally rise; exclude them."

- id: narration_voice-019
  question: "Is there evidence that speech was time-stretched to fit picture (unnatural rate shifts, smeared consonants, pitch artefacts)?"
  why: "A quality rule: this project forbids time-stretching speech to fit."
  how: "Compare local wpm across sentences and inspect A1 for phase smearing on fast passages."
  evidence: ["local wpm", "A1"]
  ir_path: "/generation_rules/-"
  type: boolean
  challenge: "Natural rate changes are common; require an artefact, not just a rate change."

- id: narration_voice-020
  question: "Is each item's narration contained within its beat, or does speech spill over beat boundaries?"
  why: "Becomes a narration-to-beat alignment rule."
  how: "Check whether speech segments cross item boundaries by more than 300 ms."
  evidence: ["evidence.audio.speech_segments", "timeline beats"]
  ir_path: "/generation_rules/-"
  type: ratio
  challenge: "Report the share and the crossings."

- id: narration_voice-021
  question: "What language is the narration in, and is it consistent?"
  why: "Fills narration language for TTS and caption tools."
  how: "From captions or transcription output language tag (evidence.tools or adapter output); confirm by reading two caption cards (analysis only)."
  evidence: ["evidence.captions[] (analysis only)", "evidence.tools"]
  ir_path: "/audio/narration/language"
  type: text
  challenge: "Do not infer nationality or accent origin of the speaker."

- id: narration_voice-022
  question: "Which narration parameters should a new video set (voice engine, voice id, wpm range, pause lengths, delivery)?"
  why: "Feeds the parameteriser."
  how: "Collect 004, 006, 009 and 012 into parameters; engine and voice are open slots (licensed or local TTS)."
  evidence: ["narration answers"]
  ir_path: "/parameters/-"
  type: list
  challenge: "No parameter may reference cloning the source voice."

- id: narration_voice-023
  question: "Write the narration budget rule (words per beat = beat_s x wpm / 60 x speech share)."
  why: "Lets the script writer hit beat lengths without stretching speech."
  how: "Use 001, 004 and per-beat coverage; test on 3 beats."
  evidence: ["narration answers", "timeline beats"]
  ir_path: "/generation_rules/-"
  type: rule
  challenge: "Predict words for 3 observed beats; errors over 20% reject the rule."

- id: narration_voice-024
  question: "Are numbers spoken digit by digit, as full words, or abbreviated (for example 'three point two million')?"
  choices: [full-words, digit-by-digit, abbreviated, mixed]
  why: "Becomes a text normalisation rule before TTS."
  how: "Compare spoken numbers (A1 timing and captions) with on-screen digits."
  evidence: ["evidence.captions[] (analysis only)", "frames: F3 numbers"]
  ir_path: "/generation_rules/-"
  type: enum
  challenge: "Check 3 numbers."

- id: narration_voice-025
  question: "Is the voice centred in the stereo image (mono-compatible)?"
  why: "Fills voice panning."
  how: "Compare A5 side loudness during speech with mid loudness: near-silent side during speech-only passages means centred."
  evidence: ["A5"]
  ir_path: "/audio/narration/panning"
  type: boolean
  challenge: "Mono files make this trivially true; check A7 channels first."

- id: narration_voice-026
  question: "Is the narrator seen on screen (lip-synced presenter) or off-screen (voiceover)?"
  choices: [on-screen, off-screen, both]
  why: "Decides whether a presenter shot is part of the format."
  how: "F2 bursts during speech: visible mouth movement matching speech."
  evidence: ["frames: F2", "evidence.audio.speech_segments"]
  ir_path: "/audio/narration/presence"
  type: enum
  challenge: "Do not identify the presenter."

- id: narration_voice-027
  question: "Does music with sung vocals overlap the narration?"
  why: "Becomes a mix rule (instrumental under narration)."
  how: "A1 during speech: a second harmonic series with sustained notes."
  evidence: ["A1"]
  ir_path: "/audio/music/vocals_under_narration"
  type: boolean
  challenge: "Give a timestamp."

- id: narration_voice-028
  question: "How many seconds before the end does narration stop?"
  why: "Sets the narration end offset."
  how: "source.duration_s - last speech_segments end_s."
  evidence: ["evidence.audio.speech_segments", "evidence.source.duration_s"]
  ir_path: "/audio/narration/end_offset_s"
  type: seconds
  challenge: "Recompute."

- id: narration_voice-029
  question: "Does narration deliberately stop for music or sound moments (planned silences), and how many?"
  why: "Adds planned narration gaps."
  how: "Speech gaps over 1 s where music or sfx rises (A3)."
  evidence: ["evidence.audio.speech_segments", "A3"]
  ir_path: "/audio/narration/planned_gaps"
  type: timestamps
  challenge: "List each gap."

- id: narration_voice-030
  question: "Is the recording tone consistent throughout (same mic, room and level), or patched from sessions?"
  choices: [consistent, patched, not-determinable]
  why: "A quality rule for TTS or recorded narration (render in one pass or match levels)."
  how: "Compare A1 spectral shape and noise floor across the beginning, middle and end."
  evidence: ["A1", "A6"]
  ir_path: "/audio/narration/consistency"
  type: enum
  challenge: "Name the segments compared."

- id: narration_voice-031
  question: "Which open-source TTS engines could approximate this delivery (for example Kokoro, Piper, Pocket TTS), and which settings matter (rate, voice, pauses)?"
  why: "Gives the render binding a TTS hint; always inferred."
  how: "Match measured rate, register and delivery to engines available locally; never propose cloning the source voice."
  evidence: ["narration answers"]
  ir_path: "/render_binding/mapping/tts_hint"
  type: list
  challenge: "Reject any hint that involves voice cloning of the source speaker."
