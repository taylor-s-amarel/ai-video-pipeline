- id: camera_motion-001
  question: "What share of shots have camera or virtual-camera motion (zoom, pan, tilt, rotation)?"
  why: "Sets how often the renderer applies a move."
  how: "From evidence.shots[].camera (video_re_camera_motion: zoom is the natural-log scale change per second, pan_x/pan_y are frame widths/heights per second), count shots with |zoom| > 0.01 or |pan_x| or |pan_y| > 0.01; confirm on F1 at shot start and end for 5 shots."
  evidence: ["evidence.shots[].camera", "frames: F1 at shot start and end"]
  ir_path: "/motion/camera_moves/-"
  type: ratio
  challenge: "Check the camera estimator on a shot where the subject moves but the frame does not; subject motion must not count."

- id: camera_motion-002
  question: "Which move types occur and how often (push-in, pull-out, pan left, pan right, tilt up, tilt down, rotate, parallax, shake, static)?"
  why: "Lists moves for the motion vocabulary with weights."
  how: "Classify each shot from camera.zoom sign and pan direction; verify ambiguous ones with F1 first/last frame."
  evidence: ["evidence.shots[].camera"]
  ir_path: "/motion/camera_moves/-"
  type: object
  challenge: "A combined zoom and pan must be classified once with both components, not counted twice."

- id: camera_motion-003
  question: "How fast are zooms (scale change per second, median and range)?"
  why: "Becomes the zoom_per_s parameter."
  how: "For zoom shots, scale change per second = exp(camera.zoom) - 1 (camera.zoom is already a log rate per second); cross-check by measuring a feature width on F1 at shot start and end: (w_end / w_start)^(1 / duration_s) - 1."
  evidence: ["evidence.shots[].camera.zoom", "evidence.shots[].duration_s", "frames: F1 start/end"]
  ir_path: "/motion/camera_moves/-"
  type: range
  challenge: "Recompute one shot manually from pixel widths; disagreement above 30% questions the estimator."

- id: camera_motion-004
  question: "Do zoom directions alternate between consecutive shots (in, out, in, out)?"
  why: "Becomes the zoom_alternate rule."
  how: "Write the sign sequence of evidence.shots[].camera.zoom (positive = zoom in); count sign alternations / consecutive pairs."
  evidence: ["evidence.shots[].camera.zoom"]
  ir_path: "/generation_rules/-"
  type: ratio
  challenge: "Static shots break the sequence; say how they were treated."

- id: camera_motion-005
  question: "What easing do moves use (linear, ease-in-out, ease-out, ease-in)?"
  choices: [linear, ease-in-out, ease-out, ease-in, mixed]
  why: "Fills motion.easing."
  how: "For 3 moving shots, measure a feature position or width on F8-style frames at 0%, 25%, 50%, 75%, 100% of the shot; compare increments (equal = linear)."
  evidence: ["frames: 5 samples per shot in 3 shots"]
  ir_path: "/motion/easing"
  type: enum
  challenge: "Short shots (under 1 s) cannot show easing reliably; exclude them."

- id: camera_motion-006
  question: "Are there punch-ins (instant scale jumps within a shot or on a cut to the same framing) and when do they occur?"
  why: "Adds punch-in emphasis to the motion list with timing."
  how: "F10 SSIM across cuts with similar content, or frame steps (F8) showing a one-frame scale change; list timestamps and scale factor."
  evidence: ["frames: F8", "frames: F10"]
  ir_path: "/motion/camera_moves/-"
  type: object
  challenge: "Check that a punch-in is not a cut to a different crop of a new asset."

- id: camera_motion-007
  question: "Is there camera shake, and what are its amplitude (px) and rough frequency?"
  why: "Adds a shake effect with parameters."
  how: "Track a fixed point across F8 frames (0.5 s); record max displacement and oscillations per second."
  evidence: ["frames: F8 over 0.5 s"]
  ir_path: "/motion/camera_moves/-"
  type: object
  challenge: "Handheld footage shake belongs to the footage; say whether it was added in edit (it appears on stills or graphics)."

- id: camera_motion-008
  question: "How fast are pans as a fraction of frame width per second?"
  why: "Becomes the pan speed parameter."
  how: "Read evidence.shots[].camera.pan_x (already frame widths per second); cross-check one shot by tracking a feature on F1 at start and end: displacement_px / width / duration_s."
  evidence: ["evidence.shots[].camera.pan_x", "evidence.source.width"]
  ir_path: "/motion/camera_moves/-"
  type: range
  challenge: "Check the sign convention (positive pan_x = camera moves right, content travels left) and that the feature track agrees within 30%."

- id: camera_motion-009
  question: "Does the move start right at the cut or after a delay?"
  why: "Sets a move start offset."
  how: "F8 over the first 0.5 s of 4 moving shots; find the first frame where the feature moves."
  evidence: ["frames: F8 at shot starts"]
  ir_path: "/generation_rules/-"
  type: ms
  challenge: "Convert frames to ms with the true fps from A7."

- id: camera_motion-010
  question: "Does motion continue across cuts (the next shot keeps the same direction and speed)?"
  why: "Becomes a motion-matching rule."
  how: "Compare direction and speed of moves in adjacent shots."
  evidence: ["evidence.shots[].camera"]
  ir_path: "/generation_rules/-"
  type: ratio
  challenge: "Alternating zooms (004) and matched motion are opposite rules; the answers must be consistent."

- id: camera_motion-011
  question: "Is motion filmed (real camera) or virtual (Ken Burns on stills), or both?"
  choices: [filmed, virtual, both]
  why: "Decides whether the renderer needs footage or can animate stills."
  how: "On moving shots, check for parallax between near and far objects (filmed) versus a uniform scale of a flat image (virtual), using F1 start and end."
  evidence: ["frames: F1 start/end"]
  ir_path: "/motion/camera_moves/-"
  type: enum
  challenge: "2.5D parallax on stills mimics filmed motion; look for cut-out edges."

- id: camera_motion-012
  question: "Do different layers move at different speeds (parallax), and what is the speed ratio between foreground and background?"
  why: "Fills parallax_ratio for 2.5D renders."
  how: "Track a background feature and a foreground feature across the same shot; ratio of displacements."
  evidence: ["frames: F1 start/end of parallax shots"]
  ir_path: "/visual/layers/*/motion"
  type: number
  challenge: "Make sure the foreground is not moving on its own (animation) rather than with the camera."

- id: camera_motion-013
  question: "Are rotations used, and how many degrees over how long?"
  why: "Adds a rotation range to the move vocabulary."
  how: "Measure the angle of a straight edge on F1 at shot start and end."
  evidence: ["frames: F1 start/end"]
  ir_path: "/motion/camera_moves/-"
  type: object
  challenge: "Report measured degrees; 'slight rotation' alone is rejected."

- id: camera_motion-014
  question: "Are move starts or speed changes aligned with music onsets?"
  why: "Becomes a sync rule for motion keyframes."
  how: "Compare move start times (009) or punch-in times (006) with evidence.audio.onsets_s; share within 80 ms."
  evidence: ["move times", "evidence.audio.onsets_s"]
  ir_path: "/generation_rules/-"
  type: ratio
  challenge: "Compare with the chance rate given onset density."

- id: camera_motion-015
  question: "What is the maximum zoom factor reached on any shot?"
  why: "Bounds zoom so assets are not over-enlarged."
  how: "Max over shots of exp(|camera.zoom| x duration_s), the total scale change across the shot."
  evidence: ["evidence.shots[].camera.zoom"]
  ir_path: "/parameters/-"
  type: number
  challenge: "Check the extreme shot by eye; estimators overshoot on blurry frames."

- id: camera_motion-016
  question: "Where are zooms centred (subject face, frame centre, text, a detail being explained)?"
  choices: [subject, frame-centre, text, detail, varies]
  why: "Becomes the zoom focus rule."
  how: "Find the fixed point of the zoom by comparing feature positions between start and end frames."
  evidence: ["frames: F1 start/end"]
  ir_path: "/generation_rules/-"
  type: enum
  challenge: "Check at least 4 shots before naming a rule."

- id: camera_motion-017
  question: "Is motion blur visible during fast moves?"
  why: "Tells the renderer to add motion blur on fast virtual moves."
  how: "F8 frames during the fastest move; look for directional smearing compared with a static frame."
  evidence: ["frames: F8 during fast moves"]
  ir_path: "/motion/camera_moves/-"
  type: boolean
  challenge: "Compression blocks on fast motion are not motion blur; check edge direction."

- id: camera_motion-018
  question: "Are there speed ramps or slow-motion segments?"
  why: "Adds time remapping to the motion vocabulary."
  how: "Compare motion speed of the same subject across frames; look for sudden slow-down (F5 difference drops while motion continues)."
  evidence: ["F5", "frames: F8"]
  ir_path: "/motion/camera_moves/-"
  type: timestamps
  challenge: "A slow virtual zoom is not slow motion; ramps change the speed of filmed action."

- id: camera_motion-019
  question: "Does camera motion pause or slow while dense text is on screen?"
  why: "Becomes a readability rule for moves."
  how: "Compare camera speed in shots with text area_ratio above 0.1 against shots with less text."
  evidence: ["evidence.shots[].camera", "evidence.text_regions[]"]
  ir_path: "/generation_rules/-"
  type: boolean
  challenge: "Report the two group medians and their sizes."

- id: camera_motion-020
  question: "Is the hook shot's move stronger (faster or larger) than body moves?"
  why: "Becomes a hook-intensity multiplier."
  how: "Ratio of hook zoom_per_s to body median zoom_per_s."
  evidence: ["evidence.shots[].camera", "hook beat"]
  ir_path: "/generation_rules/-"
  type: number
  challenge: "One hook shot is a single sample; confidence must reflect that."

- id: camera_motion-021
  question: "Are there 3D camera moves through layered 2.5D scenes (dolly through cut-out planes)?"
  why: "Adds a 2.5D dolly option."
  how: "Look for layers scaling at different rates during one move (F1 start/end)."
  evidence: ["frames: F1 start/end"]
  ir_path: "/motion/camera_moves/-"
  type: boolean
  challenge: "Different-rate scaling can also be separate animations; require consistent depth ordering."

- id: camera_motion-022
  question: "Are whip pans used as transitions, and how long are they?"
  why: "Adds whip transitions with a duration."
  how: "F8 across cuts with heavy directional blur; count frames of blur."
  evidence: ["frames: F8 across cuts"]
  ir_path: "/motion/transitions/-"
  type: object
  challenge: "Must show directional blur on at least 2 frames."

- id: camera_motion-023
  question: "Is there a simulated handheld drift (slow low-amplitude wander) on stills or graphics?"
  why: "Adds a subtle drift effect."
  how: "Track a feature on F1 frames every 0.5 s across a graphic shot; non-linear wander of a few px suggests drift."
  evidence: ["frames: F1 every 0.5 s"]
  ir_path: "/motion/camera_moves/-"
  type: boolean
  challenge: "Linear motion is a pan, not drift."

- id: camera_motion-024
  question: "Is there a dominant pan direction (left to right versus right to left) and does it carry meaning (timeline, progress)?"
  why: "Becomes a direction rule."
  how: "Count pan directions from camera.pan_x signs."
  evidence: ["evidence.shots[].camera.pan_x"]
  ir_path: "/generation_rules/-"
  type: object
  challenge: "Report counts; meaning is inferred and must say so."

- id: camera_motion-025
  question: "Does the background layer move independently of the foreground (separate virtual cameras)?"
  why: "Fills per-layer motion fields."
  how: "Compare border-region motion (evidence.shots[].motion_energy.border, F5 on edges) with foreground scale change."
  evidence: ["evidence.shots[].motion_energy", "F5"]
  ir_path: "/visual/layers/*/motion"
  type: boolean
  challenge: "A moving background video naturally moves independently; say whether it is a camera move or footage motion."

- id: camera_motion-026
  question: "What share of runtime is static (no camera or virtual camera motion), and where do static shots fall?"
  why: "Sets where the generator may hold still."
  how: "Sum durations of shots classified static in 002 / duration; list their beat roles."
  evidence: ["evidence.shots[]", "move classification"]
  ir_path: "/generation_rules/-"
  type: object
  challenge: "Check one static shot with F5 to confirm no slow zoom was missed."

- id: camera_motion-027
  question: "Write the Ken Burns rule per shot (start scale, end scale, direction policy, focus point) in terms of parameters."
  why: "Gives the compiler a procedural move plan."
  how: "Combine 003, 004, 016 and 015, for example 'scale 1.00 to 1.00 + zoom_per_s x shot_s, alternate in/out, centred on subject, max zoom_max'."
  evidence: ["camera lens answers"]
  ir_path: "/generation_rules/-"
  type: rule
  challenge: "Apply the rule to 3 observed shots; the predicted end scale must be within 0.03 of the measured one."

- id: camera_motion-028
  question: "What range should zoom_per_s take, justified by the observed spread?"
  why: "Turns observed speeds into a parameter with an evidence-based range."
  how: "Default = observed median; min/max = observed p25/p75; derived_from camera_motion-003."
  evidence: ["zoom speeds"]
  ir_path: "/parameters/-"
  type: parameter
  challenge: "A range wider than observed must be marked assumed."

- id: camera_motion-029
  question: "What is the median absolute zoom change per second across all shots from the camera estimator?"
  why: "A single motion-intensity number for fidelity scoring."
  how: "Median of |evidence.shots[].camera.zoom| over shots with a non-null estimate (log scale change per second)."
  evidence: ["evidence.shots[].camera.zoom", "evidence.shots[].duration_s"]
  ir_path: "/motion/camera_moves/-"
  type: number
  challenge: "Recompute from evidence."

- id: camera_motion-030
  question: "Does any move push the subject or text out of the safe area?"
  why: "Becomes a constraint on move size near frame edges."
  how: "Check end frames of moving shots against the safe box used by the platform lens."
  evidence: ["frames: F1 at shot ends", "evidence.safe_area.violations"]
  ir_path: "/generation_rules/-"
  type: boolean
  challenge: "Cross-check with safe_area.violations timestamps."

- id: camera_motion-031
  question: "Do moves follow a subject (tracking) or a fixed path regardless of content?"
  choices: [tracking, fixed-path, mixed]
  why: "Decides whether the renderer needs subject detection for moves."
  how: "Check whether the subject stays at the same frame position during moves in filmed shots."
  evidence: ["frames: F1 start/middle/end"]
  ir_path: "/motion/camera_moves/-"
  type: enum
  challenge: "Virtual moves on stills are fixed-path by definition unless the focus point changes."

- id: camera_motion-032
  question: "Is there a final pull-back or reveal move in the last shots?"
  why: "Adds an ending move to the outro."
  how: "Inspect camera.zoom on the last 2 shots and F1 start/end frames."
  evidence: ["evidence.shots[-2:].camera", "frames: F1"]
  ir_path: "/motion/camera_moves/-"
  type: boolean
  challenge: "Make sure the move is not the same alternating pattern as all other shots."

- id: camera_motion-033
  question: "Are moves applied to the whole frame or only to inset media inside a fixed layout?"
  choices: [whole-frame, inset-only, both]
  why: "Tells the renderer which layer receives the move."
  how: "Check whether text, borders and backgrounds stay fixed while the photo moves (F1 start/end)."
  evidence: ["frames: F1 start/end"]
  ir_path: "/visual/layers/*/motion"
  type: enum
  challenge: "Look at the frame edges and text positions in both frames."
