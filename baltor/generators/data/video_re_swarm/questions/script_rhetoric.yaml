- id: script_rhetoric-001
  question: "What is the approximate reading grade of the narration (Flesch-Kincaid grade computed on the caption text)?"
  why: "Fills script.reading_level so new scripts can be written at the same level."
  how: "Concatenate evidence.captions[].text in a scratch file (never into answers); compute FK grade = 0.39 x words/sentences + 11.8 x syllables/words - 15.59 with a simple vowel-group syllable count; delete the scratch file. Report word count in the note."
  evidence: ["evidence.captions[] (analysis only)"]
  ir_path: "/script/reading_level"
  type: number
  challenge: "Auto captions often lack punctuation, which inflates words per sentence; check sentence counting and lower confidence when punctuation is missing."

- id: script_rhetoric-002
  question: "What is the median number of words per sentence (or per caption-delimited phrase when punctuation is missing)?"
  why: "Sets a sentence length budget for the script writer."
  how: "Split the caption text on sentence punctuation (or on caption card boundaries); report median and p90."
  evidence: ["evidence.captions[] (analysis only)"]
  ir_path: "/audio/narration/words_per_sentence"
  type: distribution
  challenge: "State which split was used; card-based splits measure caption chunking, not sentences."

- id: script_rhetoric-003
  question: "Which point of view dominates the narration: first person, second person ('you'), third person, or mixed?"
  choices: [first-person, second-person, third-person, mixed]
  why: "Becomes the point_of_view parameter."
  how: "Count pronoun families (I/we, you/your, he/she/they/it) per 100 words in the caption text; report the dominant family and its share."
  evidence: ["evidence.captions[] (analysis only)"]
  ir_path: "/audio/narration/point_of_view"
  type: enum
  challenge: "'You' in a quoted phrase or generic 'you' in third-person facts can mislead; check its use in context in two places."

- id: script_rhetoric-004
  question: "Which tense dominates: present, past, or mixed by section (for example past for history, present for explanation)?"
  choices: [present, past, future, mixed-by-section, mixed]
  why: "Becomes a tense rule for generated scripts."
  how: "Classify the main verb of each sentence; report shares per beat role."
  evidence: ["evidence.captions[] (analysis only)"]
  ir_path: "/script/beat_patterns/-"
  type: enum
  challenge: "Sample five sentences and check the classification by hand."

- id: script_rhetoric-005
  question: "Which rhetorical devices appear, and how often (rhetorical question, rule of three, contrast 'not X but Y', superlative, imperative, analogy, cliffhanger, callback)?"
  why: "Lists the devices the writer should reuse, with frequency."
  how: "Scan sentences for each device; record counts and the timestamps of each instance; never copy the sentence."
  evidence: ["evidence.captions[] (analysis only)"]
  ir_path: "/script/beat_patterns/-"
  type: object
  challenge: "Each device count needs at least one timestamp; spot-check two instances against the audio."

- id: script_rhetoric-006
  question: "What is the sentence template used inside an item (slots for subject, number, unit, consequence)?"
  why: "Gives the per-item script pattern the generator fills."
  how: "Compare the first sentence of three items; keep the shared structure and replace content with typed slots, for example '{subject} {verb} {number} {unit}, {consequence}'."
  evidence: ["evidence.captions[] per item (analysis only)"]
  ir_path: "/script/beat_patterns/-"
  type: pattern
  challenge: "Test the template against a fourth item; if it does not fit, list the variants instead of forcing one."

- id: script_rhetoric-007
  question: "How many specific numbers (counts, dates, measurements, percentages) are stated per item, median?"
  why: "Becomes numbers_per_item and a constraint for content research."
  how: "Count digit groups and number words per item in captions; also check key-number overlays (F3 crops)."
  evidence: ["evidence.captions[] (analysis only)", "frames: F3 key-number crops"]
  ir_path: "/parameters/-"
  type: integer
  challenge: "Exclude label ordinals (FACT 2) and OCR noise; recount one item manually."

- id: script_rhetoric-008
  question: "Are claims attributed to sources in the narration or on screen ('according to', source captions, citations)?"
  why: "Sets claims_need_sources and whether the format shows sources."
  how: "Search caption text for attribution phrases and scan F1 frames at item starts for small source text."
  evidence: ["evidence.captions[] (analysis only)", "frames: F1 at item starts"]
  ir_path: "/script/claims_need_sources"
  type: boolean
  challenge: "Absence of attribution in the source does not mean variants may skip sources; note it, but the IR default stays true for factual formats."

- id: script_rhetoric-009
  question: "What share of sentences contain a concrete specific (number, named place, date, named object) rather than a general statement?"
  why: "Captures specificity, which this project treats as a quality constraint."
  how: "Classify each sentence as specific or general; report the share. Do not copy sentences."
  evidence: ["evidence.captions[] (analysis only)"]
  ir_path: "/audio/narration/specificity_ratio"
  type: ratio
  challenge: "Re-classify a random 20% sample; disagreement above 20% means low confidence."

- id: script_rhetoric-010
  question: "Does each item end with a consequence or 'so what' line that says why the fact matters?"
  why: "Becomes a per-item closing slot."
  how: "Inspect the last sentence of each item; mark whether it states an implication, outcome or comparison."
  evidence: ["evidence.captions[] per item (analysis only)"]
  ir_path: "/script/beat_patterns/-"
  type: boolean
  challenge: "Require the share of items with such a line; 'true' needs at least two thirds."

- id: script_rhetoric-011
  question: "What connective pattern links items (number callout, 'but', 'next', a question, no connective)?"
  why: "Becomes the transition phrase slot between items."
  how: "Look at the first two words of each item's first sentence and abstract them to a type, for example '{ordinal} callout' or 'contrast word'."
  evidence: ["evidence.captions[] item starts (analysis only)"]
  ir_path: "/script/beat_patterns/-"
  type: pattern
  challenge: "If items start differently each time, answer 'no fixed connective' rather than inventing a pattern."

- id: script_rhetoric-012
  question: "Where does the script call back to the hook or an earlier item (timestamps)?"
  why: "Adds a callback rule (for example payoff references the hook)."
  how: "Find later sentences that repeat a key noun or number from the hook; list timestamps."
  evidence: ["evidence.captions[] (analysis only)"]
  ir_path: "/script/beat_patterns/-"
  type: timestamps
  challenge: "A repeated topic word is not a callback unless it explicitly refers back."

- id: script_rhetoric-013
  question: "What register is the language in: casual or slang, neutral conversational, formal, or technical?"
  choices: [casual, conversational, formal, technical]
  why: "Becomes the tone/register parameter."
  how: "Look at contractions, slang, jargon density and sentence complexity across the whole script."
  evidence: ["evidence.captions[] (analysis only)"]
  ir_path: "/audio/narration/register"
  type: enum
  challenge: "Register judged from the hook alone is over-generalised; check the middle and end."

- id: script_rhetoric-014
  question: "How many intensifiers or emphasis words (very, insane, literally, actually, huge) occur per minute of speech?"
  why: "Sets an intensity budget; high values read as hype."
  how: "Count words from a fixed intensifier list in captions; divide by total speech minutes from audio.speech_segments."
  evidence: ["evidence.captions[] (analysis only)", "evidence.audio.speech_segments"]
  ir_path: "/audio/narration/intensifiers_per_min"
  type: number
  challenge: "Report the word list used; counts depend on it."

- id: script_rhetoric-015
  question: "How many words does the whole narration contain, and how many words per second of runtime?"
  why: "Gives the script length budget for a target duration."
  how: "Word count of captions; divide by source.duration_s."
  evidence: ["evidence.captions[] (analysis only)", "evidence.source.duration_s"]
  ir_path: "/audio/narration/word_count"
  type: object
  challenge: "Check that captions cover the whole speech (compare caption span with speech_segments span)."

- id: script_rhetoric-016
  question: "Is there a reversal or twist sentence, and at what fraction of the runtime?"
  why: "Places a reversal beat in the format."
  how: "Find a sentence that contradicts an expectation set earlier (contrast word plus new information); give its start ratio."
  evidence: ["evidence.captions[] (analysis only)"]
  ir_path: "/timeline/beats"
  type: ratio
  challenge: "A contrast word alone is not a twist; the claim must invert something earlier."

- id: script_rhetoric-017
  question: "Does the script ask the viewer to predict or guess before a reveal?"
  why: "Adds a predict-then-reveal pattern (a known learning technique) to the format."
  how: "Look for a question followed by a pause (speech_segments gap) and then an answer; list timestamps."
  evidence: ["evidence.captions[] (analysis only)", "evidence.audio.speech_segments"]
  ir_path: "/script/beat_patterns/-"
  type: timestamps
  challenge: "Rhetorical questions answered immediately are not prediction prompts; require a gap of at least 0.5 s or an explicit prompt."

- id: script_rhetoric-018
  question: "How is jargon handled: defined inline, replaced by plain words, used without definition, or absent?"
  choices: [defined-inline, plain-words, undefined-jargon, no-jargon]
  why: "Becomes a writing rule for technical topics."
  how: "Find technical terms in captions; check whether a definition clause follows within the same or next sentence."
  evidence: ["evidence.captions[] (analysis only)"]
  ir_path: "/script/beat_patterns/-"
  type: enum
  challenge: "List how many terms were checked; one term is not enough for a rule."

- id: script_rhetoric-019
  question: "Do sentences put the key information first (number or claim up front) or build to it at the end?"
  choices: [front-loaded, end-loaded, mixed]
  why: "Becomes a sentence construction rule."
  how: "For sentences containing a number, note whether the number appears in the first or last third of the sentence."
  evidence: ["evidence.captions[] (analysis only)"]
  ir_path: "/script/beat_patterns/-"
  type: enum
  challenge: "Report the counts behind the choice; a 55/45 split is 'mixed'."

- id: script_rhetoric-020
  question: "How many direct questions to the viewer does the script contain, and where?"
  why: "Sets the question count and placement rule."
  how: "Count sentences ending in a question mark (or interrogative structure when punctuation is missing); list timestamps."
  evidence: ["evidence.captions[] (analysis only)"]
  ir_path: "/script/beat_patterns/-"
  type: timestamps
  challenge: "Auto captions may drop question marks; check intonation on an A1 spectrogram for two instances."

- id: script_rhetoric-021
  question: "What does the closing line do: summarise, provoke a thought, ask a question, instruct (call to action), or tease another video?"
  choices: [summarise, provoke, question, call-to-action, tease-next, none]
  why: "Fills the outro line slot."
  how: "Classify the last sentence of the narration."
  evidence: ["evidence.captions[] last sentence (analysis only)"]
  ir_path: "/script/beat_patterns/-"
  type: enum
  challenge: "Check that the 'last sentence' is not end-card boilerplate added after the content."

- id: script_rhetoric-022
  question: "Is there a recurring refrain or catchphrase structure (same phrase shape repeated across items)?"
  why: "Adds a refrain slot that a new series fills with its own wording."
  how: "Look for repeated n-grams of 3+ words across items; describe only the shape (for example '{ordinal} reason: {claim}'), never the words."
  evidence: ["evidence.captions[] (analysis only)"]
  ir_path: "/script/beat_patterns/-"
  type: pattern
  challenge: "A repeated distinctive phrase belongs to the source; the pattern must not let it through."

- id: script_rhetoric-023
  question: "Does the on-screen text duplicate the narration word for word, summarise it, or add information the voice does not say?"
  choices: [verbatim, summary, adds-information, no-on-screen-text]
  why: "Decides how caption and label text are generated from the script."
  how: "Compare F3 crops of on-screen text in three items with the caption text at the same time."
  evidence: ["frames: F3 text crops", "evidence.captions[] (analysis only)"]
  ir_path: "/typography/captions/relation_to_voice"
  type: enum
  challenge: "If captions came from OCR, verbatim is circular; use the transcription adapter output or say not determinable."

- id: script_rhetoric-024
  question: "What emotional arc does the script follow (for example curiosity to surprise to satisfaction, fear to relief, problem to solution)?"
  why: "Gives the writer an arc to follow; recorded as an observed pattern, not a judgement of quality."
  how: "Classify the dominant function of each beat (question, tension, reveal, resolution) and write the sequence."
  evidence: ["timeline beats", "evidence.captions[] (analysis only)"]
  ir_path: "/script/beat_patterns/-"
  type: text
  challenge: "Emotional labels are interpretive; method must be 'inferred' and each step must cite a beat."

- id: script_rhetoric-025
  question: "Is the script a story (character, goal, obstacle, outcome) or a list of independent points?"
  choices: [story, list, hybrid]
  why: "Determines whether items can be reordered."
  how: "Check whether later items depend on earlier ones (references, continuity of a subject)."
  evidence: ["evidence.captions[] (analysis only)", "timeline beats"]
  ir_path: "/script/beat_patterns/-"
  type: enum
  challenge: "Try mentally swapping items 2 and 3; if nothing breaks it is a list."

- id: script_rhetoric-026
  question: "How often are numbers made tangible with comparisons or analogies (for example 'as tall as {landmark}')?"
  why: "Sets a comparison-per-item rule."
  how: "Count analogy or comparison constructions per item; report median."
  evidence: ["evidence.captions[] (analysis only)"]
  ir_path: "/script/beat_patterns/-"
  type: number
  challenge: "List the timestamps of counted instances."

- id: script_rhetoric-027
  question: "How much hedging language is used (may, might, some say, reportedly) per minute?"
  why: "Indicates claim confidence style; informs fact-check strictness for variants."
  how: "Count hedge words per speech minute."
  evidence: ["evidence.captions[] (analysis only)", "evidence.audio.speech_segments"]
  ir_path: "/audio/narration/hedges_per_min"
  type: number
  challenge: "Report the hedge list used."

- id: script_rhetoric-028
  question: "Are numbers spoken rounded ('about 3 million') or precise ('3,124,000')?"
  choices: [rounded, precise, mixed]
  why: "Becomes a number formatting rule for scripts and overlays."
  how: "Classify each spoken number by significant figures; also check on-screen numbers."
  evidence: ["evidence.captions[] (analysis only)", "frames: F3 key-number crops"]
  ir_path: "/generation_rules/-"
  type: enum
  challenge: "Years and ordinals are neither; exclude them from the count."

- id: script_rhetoric-029
  question: "What kinds of claims would a variant need to fact-check (statistics, dates, health, money, quotes, rankings)?"
  why: "Tells the render pipeline which claim types require a cited source."
  how: "Classify each factual sentence by claim type; list the types present with counts."
  evidence: ["evidence.captions[] (analysis only)"]
  ir_path: "/generation_rules/-"
  type: list
  challenge: "Health, money and safety claims must be listed if present at all, even once."

- id: script_rhetoric-030
  question: "What is the word budget for one item beat (median words per item and the words-per-second rate it implies)?"
  why: "Becomes the generation rule words_per_item = item_beat_s x words_per_s."
  how: "Count caption words per item beat; divide by item beat duration."
  evidence: ["evidence.captions[] (analysis only)", "item beat boundaries"]
  ir_path: "/generation_rules/-"
  type: rule
  challenge: "Recompute for two items; the rule must predict both within 20%."

- id: script_rhetoric-031
  question: "Which script properties should be parameters for a new topic (tone, point of view, words per item, numbers per item, sources shown)?"
  why: "Feeds the parameteriser with typed script parameters."
  how: "Collect answers 003, 007, 013, 030 and propose parameters with defaults from the observed values and ranges from observed spread."
  evidence: ["script lens answers"]
  ir_path: "/parameters/-"
  type: list
  challenge: "Every proposed parameter must cite the question it comes from."

- id: script_rhetoric-032
  question: "Is there a sign-off or recurring closing formula?"
  why: "Adds a closing slot that a new series fills with its own line."
  how: "Check the final 5 s of captions and the last text crop; describe the form only (for example '{series name} sign-off with handle')."
  evidence: ["evidence.captions[] (analysis only)", "frames: F1 last 5 s"]
  ir_path: "/script/beat_patterns/-"
  type: pattern
  challenge: "A sign-off containing the source's name or handle must not enter the format."

- id: script_rhetoric-033
  question: "How complex is the vocabulary for non-native listeners (share of words outside a common 3,000-word list, idiom count)?"
  why: "Sets a plain-language constraint for localisable variants."
  how: "If a frequency list is available locally, compute the out-of-list share; otherwise count idioms and multi-syllable words per 100 words and mark the method inferred."
  evidence: ["evidence.captions[] (analysis only)"]
  ir_path: "/audio/narration/vocabulary_complexity"
  type: object
  challenge: "If no word list was used, the answer must say so and confidence must be under 0.4."

- id: script_rhetoric-034
  question: "Does the narration address a specific audience group or situation ('if you are a {group}', 'when your {situation}')?"
  why: "Adds an audience-address slot."
  how: "Search caption text for conditional address patterns; describe the shape only."
  evidence: ["evidence.captions[] (analysis only)"]
  ir_path: "/audio/narration/audience_address"
  type: pattern
  challenge: "Generic 'you' is not audience targeting; require an explicit group or situation."

- id: script_rhetoric-035
  question: "How many distinct claims or ideas does each sentence carry on average (one idea per sentence or packed sentences)?"
  why: "Sets the density rule for script writing."
  how: "For 10 sentences, count independent clauses carrying new information; report the mean."
  evidence: ["evidence.captions[] (analysis only)"]
  ir_path: "/script/beat_patterns/-"
  type: number
  challenge: "Recount three of the sentences; disagreement means lower confidence."
