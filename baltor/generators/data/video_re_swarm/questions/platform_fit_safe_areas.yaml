- id: platform_fit_safe_areas-001
  question: "What are the resolution and display aspect ratio?"
  why: "Fills source.resolution and visual.aspect."
  how: "evidence.source.width and height (video_re_probe_metadata); check A7 for sample_aspect_ratio and rotation side data."
  evidence: ["evidence.source.width", "evidence.source.height", "A7"]
  ir_path: "/source/resolution"
  type: object
  challenge: "A rotation tag can swap width and height; confirm on an F1 frame."

- id: platform_fit_safe_areas-002
  question: "What is the frame rate, and is it constant?"
  why: "Fills source.fps and the render frame rate."
  how: "evidence.source.fps; compare r_frame_rate and avg_frame_rate in A7."
  evidence: ["evidence.source.fps", "A7"]
  ir_path: "/source/fps"
  type: object
  challenge: "Different r_frame_rate and avg_frame_rate indicate variable frame rate; say so."

- id: platform_fit_safe_areas-003
  question: "Which duration band does the video fit, and which platform limits should be checked against current platform documentation?"
  why: "Records duration constraints without stating platform limits from memory."
  how: "Report source.duration_s; list platforms the user targets and mark each limit 'check current docs' unless a citation is supplied in the run."
  evidence: ["evidence.source.duration_s"]
  ir_path: "/render_binding/mapping/duration_constraints"
  type: object
  challenge: "Any platform limit stated without a dated source is rejected."

- id: platform_fit_safe_areas-004
  question: "Which safe-area violations did the probe report, and are they real?"
  why: "Fills visual.safe_area_respected."
  how: "Read evidence.safe_area.violations (video_re_safe_area_probe); inspect F1 frames at 3 violation times with a drawbox overlay of the template."
  evidence: ["evidence.safe_area.violations", "frames: F1 with drawbox"]
  ir_path: "/visual/safe_area_respected"
  type: boolean
  challenge: "Name the template the probe used; violations from watermark regions are not format violations."

- id: platform_fit_safe_areas-005
  question: "Is any text placed in the bottom 20% of the frame?"
  why: "Becomes a placement constraint (many vertical apps draw captions and controls there)."
  how: "evidence.text_regions[] with bbox bottom beyond 0.8 x height."
  evidence: ["evidence.text_regions[].bbox"]
  ir_path: "/generation_rules/-"
  type: ratio
  challenge: "Treat the 20% figure as a working template, not a platform specification."

- id: platform_fit_safe_areas-006
  question: "Is any text placed in the right-hand 15% of the frame?"
  why: "Becomes a placement constraint for side action buttons."
  how: "evidence.text_regions[] with bbox right edge beyond 0.85 x width."
  evidence: ["evidence.text_regions[].bbox"]
  ir_path: "/generation_rules/-"
  type: ratio
  challenge: "Same caveat as 005."

- id: platform_fit_safe_areas-007
  question: "Is the top 10% kept free of important content?"
  why: "Becomes a top margin constraint."
  how: "text_regions and subject positions in the top band."
  evidence: ["evidence.text_regions[]", "frames: F1"]
  ir_path: "/generation_rules/-"
  type: boolean
  challenge: "Report what occupies the band if anything."

- id: platform_fit_safe_areas-008
  question: "Would the important content survive a centre crop to 4:5 and to 1:1?"
  why: "Decides whether variants can be re-framed for other placements."
  how: "Overlay 4:5 and 1:1 centre boxes on 5 F1 frames (drawbox); check title, captions and subject."
  evidence: ["frames: F1 with drawbox"]
  ir_path: "/render_binding/mapping/reframe_ok"
  type: object
  challenge: "Report per frame."

- id: platform_fit_safe_areas-009
  question: "Are there letterbox or pillarbox bars?"
  why: "Flags a framing error to avoid."
  how: "ffmpeg cropdetect over 10 s: ffmpeg -i SRC -vf cropdetect -t 10 -f null - 2>&1 | tail -3."
  evidence: ["cropdetect output"]
  ir_path: "/generation_rules/-"
  type: boolean
  challenge: "Dark content can trigger cropdetect; check on F1."

- id: platform_fit_safe_areas-010
  question: "What are the video codec, profile, pixel format and bitrate?"
  why: "Fills render video settings."
  how: "A7 stream and format fields."
  evidence: ["A7"]
  ir_path: "/render_binding/mapping/video_format"
  type: object
  challenge: "Copy exactly from ffprobe."

- id: platform_fit_safe_areas-011
  question: "How does integrated loudness compare with common streaming normalisation targets (difference in LU from a target the run specifies)?"
  why: "Sets the loudness target for the render."
  how: "evidence.audio.integrated_lufs minus the target given in the run parameters; if none, report the value only."
  evidence: ["evidence.audio.integrated_lufs"]
  ir_path: "/audio/integrated_lufs"
  type: number
  challenge: "Do not assert a platform's target from memory; cite or omit."

- id: platform_fit_safe_areas-012
  question: "Are platform UI elements, usernames or watermarks burned into the frames?"
  why: "Flags re-uploads and fills source.platform as an observation; such marks never enter variants."
  how: "F3 crops of corners and edges at 3 times."
  evidence: ["frames: F3 corners"]
  ir_path: "/source/platform"
  type: object
  challenge: "Do not name individuals; record the kind of mark and its position."

- id: platform_fit_safe_areas-013
  question: "Are captions burned in so the video can be followed with sound off?"
  why: "Fills burned_in for sound-off viewing."
  how: "F1 frames during speech."
  evidence: ["frames: F1", "evidence.audio.speech_segments"]
  ir_path: "/typography/captions/burned_in"
  type: boolean
  challenge: "Check 5 speech moments."

- id: platform_fit_safe_areas-014
  question: "What share of speech time has matching on-screen text (sound-off coverage)?"
  why: "Measures sound-off readability."
  how: "Speech segments overlapped by caption-area text regions / speech time."
  evidence: ["evidence.audio.speech_segments", "evidence.text_regions[]"]
  ir_path: "/typography/captions/sound_off_coverage"
  type: ratio
  challenge: "Text regions are sampled; state the sampling interval."

- id: platform_fit_safe_areas-015
  question: "Are there interlacing or combing artefacts?"
  why: "Flags a source quality issue."
  how: "ffmpeg idet filter over 500 frames: ffmpeg -i SRC -vf idet -frames:v 500 -an -f null - 2>&1 | grep 'Multi frame'."
  evidence: ["idet output"]
  ir_path: "/generation_rules/-"
  type: boolean
  challenge: "Report the counts."

- id: platform_fit_safe_areas-016
  question: "What colour primaries, transfer and range are tagged?"
  why: "Fills render colour tags."
  how: "A7: color_space, color_transfer, color_primaries, color_range."
  evidence: ["A7"]
  ir_path: "/render_binding/mapping/color_tags"
  type: object
  challenge: "Untagged streams must be reported as untagged, not as bt709."

- id: platform_fit_safe_areas-017
  question: "What are the audio channel layout and sample rate?"
  why: "Fills render audio settings."
  how: "A7 audio stream."
  evidence: ["A7"]
  ir_path: "/render_binding/mapping/audio_layout"
  type: object
  challenge: "Copy exactly."

- id: platform_fit_safe_areas-018
  question: "Is the frame rate variable?"
  why: "Variable frame rate affects frame-accurate measurements and renders."
  how: "Compare A7 r_frame_rate and avg_frame_rate; inspect pts deltas with ffprobe -show_frames on 100 frames."
  evidence: ["A7", "ffprobe frames"]
  ir_path: "/source/fps"
  type: boolean
  challenge: "Report min and max frame durations."

- id: platform_fit_safe_areas-019
  question: "What are the minimum text margins in px at the source resolution?"
  why: "Fills a safe box for the render template."
  how: "Min distance from text bboxes to each edge."
  evidence: ["evidence.text_regions[].bbox"]
  ir_path: "/render_binding/mapping/text_margins_px"
  type: object
  challenge: "Exclude watermarks."

- id: platform_fit_safe_areas-020
  question: "What changes would a 16:9 version need (re-layout, pillarbox, side panels)?"
  why: "Adds a reframing plan for other aspects."
  how: "Inspect layout on F1 frames; propose a layout that keeps title, captions and subject; method inferred."
  evidence: ["frames: F1"]
  ir_path: "/render_binding/mapping/reframe_16x9"
  type: text
  challenge: "Must not require source footage."

- id: platform_fit_safe_areas-021
  question: "Are handles, hashtags or account names overlaid as part of the design?"
  why: "Adds a handle slot (filled with the new channel's own handle) or rules it out."
  how: "F3 crops; describe placement and style only."
  evidence: ["frames: F3"]
  ir_path: "/typography/labels/handle_slot"
  type: boolean
  challenge: "Never copy the handle."

- id: platform_fit_safe_areas-022
  question: "Are there black frames at the start, the end, or anywhere else?"
  why: "Flags autoplay and thumbnail problems."
  how: "F12 blackdetect."
  evidence: ["F12"]
  ir_path: "/generation_rules/-"
  type: segments
  challenge: "Report all segments."

- id: platform_fit_safe_areas-023
  question: "How many large luminance flashes per second occur at most (three per second is the WCAG 2.3.1 general flash threshold)?"
  why: "An accessibility check; renders should stay under the threshold."
  how: "F6 YAVG per frame; count opposing changes above about 10% of full range within any 1 s window. This is a screening estimate, not a certified photosensitivity test."
  evidence: ["F6 series"]
  ir_path: "/generation_rules/-"
  type: number
  challenge: "Small-area flashes count differently under WCAG; mark the result as a screening estimate."

- id: platform_fit_safe_areas-024
  question: "How tall is caption text in pixels at 1080 px width (scaled from the source)?"
  why: "Gives a concrete size for phone legibility."
  how: "Cap height (typography lens) scaled to a 1080-wide frame."
  evidence: ["cap height", "evidence.source.width"]
  ir_path: "/typography/captions/cap_height_px_at_1080w"
  type: number
  challenge: "Recompute the scaling."

- id: platform_fit_safe_areas-025
  question: "Which platform parameters should a new video set (target platforms, aspect, fps, safe box, target loudness)?"
  why: "Feeds the parameteriser."
  how: "Collect 001, 002, 004, 011 and 019."
  evidence: ["platform answers"]
  ir_path: "/parameters/-"
  type: list
  challenge: "Each parameter needs derived_from."

- id: platform_fit_safe_areas-026
  question: "Write the safe-box rule for text and key subjects as fractions of width and height."
  why: "Gives the compiler a placement constraint."
  how: "From 005-007 and 019, for example 'text inside x 0.06-0.85, y 0.10-0.80'."
  evidence: ["platform answers"]
  ir_path: "/generation_rules/-"
  type: rule
  challenge: "Check the source's own text against the rule and report violations."

- id: platform_fit_safe_areas-027
  question: "Is the file a re-encode of an earlier upload (double compression signs, burned UI, odd bitrate)?"
  choices: [likely-original-export, likely-re-encode, not-determinable]
  why: "Calibrates trust in colour, sharpness and audio measurements."
  how: "A7 encoder tags, F3 crops for blocking, burned-in UI from 012; method inferred."
  evidence: ["A7", "frames: F3"]
  ir_path: "/source/platform"
  type: enum
  challenge: "Encoder tags can be stripped; low confidence unless two cues agree."

- id: platform_fit_safe_areas-028
  question: "What keyframe (GOP) interval does the file use?"
  why: "Informs render settings and seek accuracy of measurements."
  how: "ffprobe -select_streams v -skip_frame nokey -show_entries frame=pts_time -of csv SRC | head -20; median interval."
  evidence: ["ffprobe keyframes"]
  ir_path: "/render_binding/mapping/gop_s"
  type: seconds
  challenge: "Report the first 10 keyframe times."

- id: platform_fit_safe_areas-029
  question: "Is the audio present for the whole duration, or shorter or longer than the video?"
  why: "Flags sync and duration problems."
  how: "Compare audio and video stream durations in A7."
  evidence: ["A7"]
  ir_path: "/render_binding/mapping/av_duration_delta_s"
  type: seconds
  challenge: "Report both durations."

- id: platform_fit_safe_areas-030
  question: "Does the first frame contain the title and subject so a paused autoplay frame still communicates the topic?"
  why: "Becomes a first-frame content rule."
  how: "F1 at 0.0 s."
  evidence: ["frames: F1 at 0.0 s"]
  ir_path: "/generation_rules/-"
  type: boolean
  challenge: "Cross-check with hook_first_seconds-001 and -019."
