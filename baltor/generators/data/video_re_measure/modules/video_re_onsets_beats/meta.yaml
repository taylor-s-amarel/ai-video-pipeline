title: 'Video RE: onsets, tempo and beats with numpy'
summary: Spectral-flux onsets (within 30 ms on test clicks), autocorrelation tempo with a 120 BPM prior and a dynamic-programming
  beat tracker, without librosa.
subkind: audio-analysis
tags:
- audio
- reverse-engineering
- onsets
- tempo
- beats
- evidence
step_kinds:
- measure
- research
deps:
- ffmpeg
- ffprobe
- numpy
examples:
- python video_re_onsets_beats.py clip.mp4 --out beats.json
refs:
- D. P. W. Ellis, Beat tracking by dynamic programming, Journal of New Music Research 36(1), 2007
- S. Boeck, F. Krebs, M. Schedl, Evaluating the online capabilities of onset detection methods, ISMIR 2012
- https://github.com/librosa/librosa (same ideas, heavier dependency)
