  - collection: community-creator-marketing-security-voices
    id: youtube-monetization-policies
    title: "YouTube channel monetization policies (inauthentic and reused content)"
    url: "https://support.google.com/youtube/answer/1311392"
    kind: guidance
    summary: "Official YouTube Partner Program policy. On 15 July 2025 'repetitious content' was renamed 'inauthentic content' and clarified to cover mass-produced or repetitive uploads; it applies channel-wide and regardless of whether AI was used. Reused-content rules (clips, compilations, reactions) were unchanged."
    verification: search-result
    licence: "YouTube Help content"
    licence_url: "https://support.google.com/youtube/answer/1311392"
    notes: "Official page returned in search results; summary combines the page and coverage quoting it. Re-read before each new series format."
    cautions: ["A faceless series must differ visibly from video to video (topic, script, visuals); near-identical narrated slideshows can cost monetisation for the whole channel."]
    tags: [youtube, policy, monetization, faceless]
  - collection: community-creator-marketing-security-voices
    id: youtube-altered-synthetic-disclosure
    title: "YouTube: disclosing use of altered or synthetic content"
    url: "https://support.google.com/youtube/answer/14328491"
    kind: guidance
    summary: "Official help page: creators must disclose realistic altered or synthetic content (a real person saying something they did not, altered real events, realistic invented scenes). Clearly unrealistic, animated or effects content and production assistance are exempt."
