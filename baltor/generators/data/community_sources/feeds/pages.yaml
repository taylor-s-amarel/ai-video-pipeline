# Individually researched sources (official feeds, policy pages, aggregators, topic feeds, PA programmes).
# Each item records how it was confirmed on 2026-10-10 in `notes`. Most hosts here could not be
# fetched from the research network, so verification is 'search-result' (URL seen in web search
# results or in an official/source document found that way) unless stated otherwise.
# Fields: collection, id, title, url, kind, summary, verification, licence, licence_url, notes, cautions, tags.

verified_on: "2026-10-10"

collection_meta:
  community-ai-oss-voices:
    title: "AI engineering, agent practitioners and open-source maintainers"
    description: "Blogs, newsletters and official news feeds from people and labs whose public work shapes coding agents and LLM practice, plus open-source maintainers whose posts affect the tools agents depend on. Feed URLs are given where confirmed; otherwise the publication page is listed with a note."
    tags: [ai, coding-agents, open-source, voices]
  community-gamedev-3d-educators:
    title: "Game dev, Godot, Blender, graphics and animation educators and news"
    description: "Official engine news, game-industry news and educators' channels and blogs for Godot, Blender, graphics, pixel art and animation. YouTube items use the channel Atom feed with a channel ID confirmed in search results."
    tags: [gamedev, godot, blender, graphics, animation, education]
  community-creator-marketing-security-voices:
    title: "Creator platform policy, creator economy, marketing and security sources"
    description: "Official YouTube, Meta and TikTok policy sources that decide whether faceless and AI-assisted channels can monetise, creator-economy publications, search-marketing news and defensive security feeds."
    tags: [creators, policy, marketing, seo, security]
  community-aggregators-forums:
    title: "Aggregators, research listings and official forums"
    description: "Hacker News, arXiv category listings, Discourse forums for Godot, Blender, Hugging Face and others, and the Kagi Small Web feed. Patterns (arXiv, Discourse, hnrss) come from each platform's documentation found in search results."
    tags: [aggregators, forums, research, arxiv, hacker-news]
  community-topic-mining-feeds:
    title: "Topic mining feeds for facts, history, science and trends"
    description: "Feeds that surface dated, citable topics for fact-led shorts: Wikipedia featured feeds and on-this-day data, NASA and APOD, ScienceDaily, Smithsonian and Google Trends. Use them to pick topics, then cite the primary source in the video description."
    tags: [topics, facts, history, science, trends]

