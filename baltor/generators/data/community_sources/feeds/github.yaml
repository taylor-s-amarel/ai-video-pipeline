# GitHub Atom feeds for official changelogs and releases.
# Every feed URL below was fetched on 2026-10-10 (WebFetch) and returned a valid Atom feed;
# `seen` records the newest entry at that time. Licence files were fetched from
# raw.githubusercontent.com/<repo>/HEAD/<file> on the same day.
# feed: releases -> https://github.com/<repo>/releases.atom
#       tags     -> https://github.com/<repo>/tags.atom            (repos that tag but do not publish releases)
#       commits:<branch> -> https://github.com/<repo>/commits/<branch>.atom
# Fields: repo, feed, title, summary, seen, licence, licence_file, tags, optional notes/cautions.

verified_on: "2026-10-10"
verification: fetched
common_cautions:
  - "GitHub serves these feeds without authentication but rate-limits by IP; poll at most hourly and send If-None-Match / If-Modified-Since."
common_tags: [github, atom, release-feed]

