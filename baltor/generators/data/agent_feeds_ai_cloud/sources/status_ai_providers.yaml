    notes: "Confirmed through third-party status aggregators that read this page."
  - id: together-status
    title: "Together AI status"
    url: "https://status.together.ai"
    summary: "Together AI's status page for serverless inference, dedicated endpoints and fine-tuning."
    vendor: Together AI
    products: [Together API]
    verification: search-result
    notes: "Confirmed through a third-party status aggregator."
  - id: openrouter-status
    title: "OpenRouter status"
    url: "https://status.openrouter.ai"
    summary: "OpenRouter's status page; OpenRouter routes around individual provider outages, so this page covers its own API and routing layer."
    vendor: OpenRouter
    products: [OpenRouter API]
    verification: search-result
  - id: replicate-status
    title: "Replicate status"
    url: "https://replicatestatus.com"
    summary: "Replicate's status page for predictions, training and the web app."
    vendor: Replicate
