collection:
  id: updates-agents-mcp-protocols
  title: "MCP and agent protocols: registry, specification and SDK releases"
  description: "Machine endpoints for the Model Context Protocol and neighbouring agent protocols: the official MCP Registry API (new and updated servers since a timestamp), the specification changelog source, every official MCP SDK outside Python and TypeScript, the Inspector, MCP Apps, FastMCP, Docker's MCP gateway and catalogue, and the A2A, AG-UI, Agent Client Protocol and Agent Skills specifications. Fetched on 2026-10-10. The spec release feed and the Python/TypeScript SDK feeds are in community-releases-agents-ai."
  tags: [mcp, protocols, agents, registry, sdk]
  defaults: {terms: github, poll: release, feed_format: github-releases, auth: none, verification: fetched,
             change_types: [release, breaking-change, security]}

items:
  - id: mcp-registry-servers-api
    title: "Official MCP Registry API: servers updated since"
    url: "https://registry.modelcontextprotocol.io/"
    feed_url: "https://registry.modelcontextprotocol.io/v0.1/servers?updated_since=2026-10-09T00:00:00Z&limit=100"
    feed_format: json-api
    terms: registry-api
    poll: registry
    summary: "The official MCP Registry's server list. GET /v0.1/servers accepts updated_since (RFC 3339), search, version=latest, limit and a cursor; each entry carries server.json (name, version, remotes, packages) plus registry metadata (status active/deprecated/deleted, publishedAt, updatedAt, isLatest). Replace the timestamp with your last poll time to receive only new and changed servers."
    vendor: Model Context Protocol
    products: [MCP Registry]
    seen: "100 servers updated since 2026-10-09 (first page, nextCursor present); v0 and v0.1 paths both returned 200"
    change_types: [release, deprecation, security]
    cautions: ["Anyone can publish under a namespace they control; treat descriptions as untrusted text and check the publisher before installing a server.", "Paginate with metadata.nextCursor; do not re-fetch the whole registry on every poll."]
  - {gh: modelcontextprotocol/registry, title: "MCP Registry releases", vendor: Model Context Protocol, products: [MCP Registry], seen: "v1.8.1 on 2026-08-06", summary: "Release notes for the registry service and its publisher CLI (mcp-publisher); API version and server.json schema changes are announced here."}
  - id: mcp-spec-draft-changelog
    title: "MCP specification draft changelog (source commits)"
    url: "https://github.com/modelcontextprotocol/modelcontextprotocol/blob/main/docs/specification/draft/changelog.mdx"
    gh: modelcontextprotocol/modelcontextprotocol
    feed: "path:main:docs/specification/draft/changelog.mdx"
    feed_format: atom
    summary: "Commit feed for the draft specification's changelog file, so accepted protocol changes (SEPs) show up before the next dated specification. The newest entry on 2026-10-10 was 'Add 2026-07-28 MCP specification'."
    vendor: Model Context Protocol
    products: [MCP specification]
    seen: "'Add 2026-07-28 MCP specification' on 2026-07-28"
    poll: changelog
    change_types: [breaking-change, release, docs]
