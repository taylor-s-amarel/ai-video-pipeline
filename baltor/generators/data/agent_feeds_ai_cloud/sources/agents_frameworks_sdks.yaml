collection:
  id: updates-agents-frameworks-sdks
  title: "Release feeds: provider SDKs, agent frameworks, gateways and evaluation tools"
  description: "GitHub release Atom feeds for the libraries agents' code imports: official provider SDKs (OpenAI, Anthropic, Google GenAI, Mistral, Cohere, Groq, Ollama), agent SDKs and frameworks (OpenAI Agents SDK, Claude Agent SDK for TypeScript, Google ADK, Microsoft Agent Framework, LangChain, LlamaIndex, DSPy, CrewAI, Mastra, Agno, Strands), the LiteLLM gateway, structured-output libraries and observability/eval tools. Each feed was fetched on 2026-10-10. Release feeds already in community-releases-agents-ai (Anthropic Python SDK, Claude Agent SDK for Python, LangGraph, Pydantic AI, smolagents) are not repeated."
  tags: [ai, agents, sdk, frameworks, github]
  defaults: {terms: github, poll: release, feed_format: github-releases, auth: none, verification: fetched,
             change_types: [release, breaking-change, deprecation, security]}

items:
