collection:
  id: updates-ai-model-catalogs
  title: "Model catalogues, prices and new open-weight models"
  description: "Machine-readable catalogues that tell an agent which models exist, what they cost and what context they support: the models.dev and LiteLLM price tables (cross-provider), the OpenRouter models API, and Hugging Face Hub listings of the newest repositories from major open-weight model publishers. Use them to pick a current model id, to notice price or context changes, and to spot new open-weight releases."
  tags: [ai, models, pricing, catalog, open-weights]
  defaults: {terms: vendor-docs, poll: catalog, auth: none, change_types: [model-release, pricing]}

items:
  - id: models-dev-catalog-commits
    title: "models.dev catalogue commits"
    gh: sst/models.dev
    feed: "commits:dev"
    feed_format: atom
    terms: github
    poll: changelog
    summary: "Commit feed of models.dev, the open catalogue of model ids, prices, context limits and capabilities across providers that OpenCode and other harnesses read. Provider syncs (for example 'update OpenRouter model catalog') appear here several times a day."
    vendor: SST
    products: [models.dev]
    seen: "'chore(sync): update OpenRouter model catalog (#9311)' on 2026-10-10"
    verification: fetched
    notes: "Default branch is dev. The published JSON is served from the models.dev site (api.json, from prior research); that host was not reachable from the research network, so the commit feed is the verified signal."
  - id: litellm-model-prices-json
    title: "LiteLLM model prices and context window table (raw JSON)"
    url: "https://github.com/BerriAI/litellm/blob/main/model_prices_and_context_window.json"
    feed_url: "https://raw.githubusercontent.com/BerriAI/litellm/main/model_prices_and_context_window.json"
    feed_format: json-api
    terms: github-raw
    summary: "LiteLLM's community-maintained JSON of per-token prices, context windows and capability flags for thousands of model ids across OpenAI, Anthropic, Bedrock, Vertex, Azure and others. Diff it to detect price changes and new model ids; the file is large, so use conditional requests."
    vendor: BerriAI
    products: [LiteLLM]
    verification: fetched
    seen: "HTTP 200 text/plain JSON on 2026-10-10"
    cautions: ["Community-maintained: confirm a price on the provider's pricing page before quoting it."]
  - id: litellm-model-prices-commits
    title: "LiteLLM model price table commits"
    gh: BerriAI/litellm
    feed: "path:main:model_prices_and_context_window.json"
    feed_format: atom
    terms: github
    poll: changelog
    summary: "Commit feed limited to LiteLLM's price and context table, so each new model id or price change arrives as one entry (for example new Azure AI Cohere embed models on 2026-10-10)."
    vendor: BerriAI
    products: [LiteLLM]
    seen: "'feat(azure): add azure_ai/Cohere-Embed-V5-Fast ...' on 2026-10-10"
    verification: fetched
  - id: openrouter-models-api
    title: "OpenRouter models API"
    url: "https://openrouter.ai/api/v1/models"
    feed_url: "https://openrouter.ai/api/v1/models"
    feed_format: json-api
    terms: api-key
    summary: "OpenRouter's GET /api/v1/models returns every routed model with context length, pricing per token and supported parameters; GET /api/v1/models/{author}/{slug}/endpoints gives per-provider endpoints. Diff daily for new models and price changes across hundreds of providers."
    vendor: OpenRouter
    products: [OpenRouter API]
    verification: search-result
    auth: api-key
    cautions: ["Third-party summaries of the OpenAPI document say requests are authenticated by default; send a key unless you confirm the list endpoint is public."]
  - id: huggingface-hub-models-api
    title: "Hugging Face Hub models API"
    url: "https://huggingface.co/docs/hub/api"
    feed_url: "https://huggingface.co/api/models?sort=createdAt&direction=-1&limit=50"
    feed_format: json-api
    terms: registry-api
    summary: "Hub API for listing model repositories with author, search, filter, sort and direction parameters and Link-header pagination. Sorting newest first surfaces new open-weight releases across the Hub; filter by author for one publisher."
    vendor: Hugging Face
    products: [Hugging Face Hub]
    verification: search-result
    cautions: ["'createdAt' as a sort key comes from community documentation, not the official parameter list; repositories created before creation dates were stored share the placeholder 2022-03-02T23:29:04Z."]
  - id: hf-org-qwen
    title: "Hugging Face: newest Qwen models"
    url: "https://huggingface.co/Qwen"
    feed_url: "https://huggingface.co/api/models?author=Qwen&sort=createdAt&direction=-1&limit=20"
    feed_format: json-api
    terms: registry-api
    summary: "Newest model repositories from Alibaba's Qwen team (Qwen3.x, Qwen3-Coder and their quantised variants), which often ship weeks before hosted API availability elsewhere."
    vendor: Alibaba Qwen
    products: [Qwen]
    verification: search-result
