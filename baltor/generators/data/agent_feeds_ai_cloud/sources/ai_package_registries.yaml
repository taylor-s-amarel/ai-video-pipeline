collection:
  id: updates-ai-package-registries
  title: "Package registry feeds for AI SDKs, agent frameworks and coding-agent CLIs"
  description: "What is actually installable, straight from PyPI and npm: per-project PyPI release RSS and the npm registry's /latest document for the AI and agent packages most projects pin. Registry feeds catch versions that never get a GitHub release (or whose repository moved), and they are what a lockfile bump compares against. Each endpoint was fetched and parsed on 2026-10-10; 'seen' is the newest version at that time. Pair with updates-agents-frameworks-sdks for the release notes behind each version."
  tags: [ai, agents, pypi, npm, dependencies, registry]
  defaults: {poll: registry, auth: none, verification: fetched, change_types: [release, breaking-change, security]}

