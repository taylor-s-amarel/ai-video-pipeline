collection:
  id: status-dev-cloud-platforms
  title: "Status pages: developer platforms, clouds, registries and SaaS APIs"
  description: "Official status pages for the platforms a build or deploy depends on: GitHub, GitLab, npm, PyPI, Docker, Cloudflare, Vercel, Netlify, Supabase, Fly.io, Render, PlanetScale, Neon, Heroku, DigitalOcean, Stripe, Twilio, SendGrid, Slack, Discord, Sentry, Datadog, New Relic, Linear, Atlassian, Auth0, Okta and more. An agent whose 'npm install', 'git push' or deploy fails should check these before debugging its own code. Status hosts could not be fetched from the research network on 2026-10-10; items marked spl take their page URL from Sentry's MIT-licensed status-page-list 0.6.1 (downloaded from npm that day), and feed_url is set only when a vendor document, API client or community list named that exact endpoint."
  tags: [status, incidents, cloud, devtools, saas]
  defaults: {terms: statuspage, poll: status, auth: none, change_types: [incident], kind: status-page}

items:
  # ---------------------------------------------------------------- source hosting, registries, CI
  - {id: github-status, title: "GitHub status", url: "https://www.githubstatus.com", feed_url: "https://www.githubstatus.com/api/v2/summary.json", feed_format: statuspage, verification: search-result, vendor: GitHub, products: [Git operations, API, Actions, Packages, Pages, Codespaces, Copilot], summary: "GitHub's Statuspage with per-component status for Git operations, API requests, Actions, Packages, Pages, Codespaces and Copilot.", notes: "summary.json is the root the Octokit Ruby client uses; third-party monitors also read https://www.githubstatus.com/history.rss and history.atom. Page URL also in Sentry's status-page-list."}
  - {id: gitlab-status, title: "GitLab.com status", url: "https://status.gitlab.com/", feed_url: "https://status.gitlab.com/pages/5b36dc6502d06804c08349f7/rss", feed_format: rss, spl: true, vendor: GitLab, products: [GitLab.com, CI/CD runners], summary: "GitLab.com's status page (hosted on status.io) for the website, API, Git operations and shared CI runners.", notes: "RSS URL from the talonx/service-provider-status-links list fetched 2026-10-10."}
  - {id: npm-status, title: "npm registry status", url: "https://status.npmjs.org/", spl: true, vendor: GitHub, products: [npm registry, package publishing, package installation], summary: "Status of the npm registry, including separate components for package installation and publishing; check it before debugging a failing 'npm install'."}
  - {id: pypi-status, title: "Python infrastructure status (PyPI)", url: "https://status.python.org/", spl: true, vendor: Python Software Foundation, products: [PyPI, python.org], summary: "Status of PyPI and other Python Software Foundation services; check it before debugging a failing 'pip install' or upload."}
  - {id: docker-status, title: "Docker status", url: "https://www.dockerstatus.com/", feed_url: "https://www.dockerstatus.com/pages/533c6539221ae15e3f000031/rss", feed_format: rss, verification: from-prior-research, vendor: Docker, products: [Docker Hub, Docker Build Cloud, Docker Desktop sign-in], summary: "Docker's status page for Docker Hub registry pulls and pushes, automated builds and accounts; Hub incidents break CI image pulls.", notes: "Page and RSS URL from the talonx/service-provider-status-links list fetched 2026-10-10."}
  - {id: circleci-status, title: "CircleCI status", url: "https://status.circleci.com/", feed_url: "https://status.circleci.com/history.rss", feed_format: rss, spl: true, vendor: CircleCI, products: [CircleCI], summary: "CircleCI's Statuspage for pipelines, runners and the API.", notes: "history.rss/history.atom URLs from the talonx/service-provider-status-links list fetched 2026-10-10."}
  - {id: atlassian-status, title: "Atlassian status", url: "https://status.atlassian.com/", feed_url: "https://status.atlassian.com/history.rss", feed_format: rss, spl: true, vendor: Atlassian, products: [Jira, Confluence, Bitbucket], summary: "Atlassian's status index for Jira, Confluence, Bitbucket and other cloud products; Bitbucket also has its own page at bitbucket.status.atlassian.com with an /api documentation page.", notes: "Feed URL from the talonx list; Atlassian product pages document /api/v2/summary.json on their /api pages (for example https://bitbucket.status.atlassian.com/api)."}
  - {id: sentry-status, title: "Sentry status", url: "https://status.sentry.io/", spl: true, vendor: Sentry, products: [Sentry], summary: "Sentry's status page for event ingestion, the web app and integrations; ingestion delays hide production errors from agents that read Sentry."}
  - {id: linear-status, title: "Linear status", url: "https://linearstatus.com/", spl: true, vendor: Linear, products: [Linear, Linear API], summary: "Linear's status page for the app, API and integrations used by issue-tracking agents."}
  # ---------------------------------------------------------------- hosting and edge
  - {id: cloudflare-status, title: "Cloudflare status", url: "https://www.cloudflarestatus.com/", feed_url: "https://www.cloudflarestatus.com/api/v3/incidents.atom", feed_format: atom, verification: search-result, vendor: Cloudflare, products: [CDN, Workers, R2, D1, Zero Trust, Dashboard], summary: "Cloudflare's status page. Cloudflare's developer docs list separate incident and maintenance feeds in RSS and Atom under /api/v3/ (incidents.rss, incidents.atom, maintenance.rss, maintenance.atom), and the rebuilt page keeps the earlier Status API endpoints working.", notes: "Maintenance feed: https://www.cloudflarestatus.com/api/v3/maintenance.atom. Many incidents are per data-centre; filter to the regions you serve."}
  - {id: vercel-status, title: "Vercel status", url: "https://www.vercel-status.com/", verification: search-result, vendor: Vercel, products: [Deployments, Functions, Edge Network, v0, AI Gateway], summary: "Vercel's status page for builds, deployments, functions, the edge network per region, v0 and AI Gateway.", notes: "No feed URL was confirmed on 2026-10-10; read the Subscribe menu on the page. URL also in Sentry's status-page-list."}
  - {id: netlify-status, title: "Netlify status", url: "https://www.netlifystatus.com/", feed_url: "https://www.netlifystatus.com/history.rss", feed_format: rss, verification: search-result, vendor: Netlify, products: [Builds, Edge network, Functions, Netlify DNS], summary: "Netlify's status page; a Netlify Support post gives this RSS feed as the near-real-time way to follow it (it also works as a Slack subscription)."}
  - {id: flyio-status, title: "Fly.io status", url: "https://status.flyio.net/", verification: search-result, vendor: Fly.io, products: [Machines, Deployments, Volumes, regions], summary: "Fly.io's status page with per-region and per-product components (deployments, Machines API, volumes, metrics, logs)."}
  - {id: render-status, title: "Render status", url: "https://status.render.com/", verification: search-result, vendor: Render, products: [Web services, Builds, Postgres, Static sites], summary: "Render's status page; incident history can be filtered by region."}
  - {id: heroku-status, title: "Heroku status", url: "https://status.heroku.com/", spl: true, vendor: Salesforce Heroku, products: [Heroku], summary: "Heroku's status page for apps, data services and tooling.", notes: "The talonx list notes no RSS feed for this page."}
  - {id: digitalocean-status, title: "DigitalOcean status", url: "https://status.digitalocean.com/", feed_url: "https://status.digitalocean.com/history.rss", feed_format: rss, spl: true, vendor: DigitalOcean, products: [Droplets, App Platform, Managed Databases, Spaces], summary: "DigitalOcean's Statuspage for compute, App Platform, databases and storage by region.", notes: "Feed URL from the talonx list fetched 2026-10-10."}
  - {id: linode-status, title: "Linode (Akamai Cloud) status", url: "https://status.linode.com/", feed_url: "https://status.linode.com/history.rss", feed_format: rss, verification: from-prior-research, vendor: Akamai, products: [Linode, Akamai Cloud Computing], summary: "Status page for Linode / Akamai Cloud compute, storage and networking.", notes: "Page and feed URL from the talonx list fetched 2026-10-10."}
  - {id: fastly-status, title: "Fastly status", url: "https://www.fastlystatus.com/", spl: true, vendor: Fastly, products: [Fastly CDN, Compute], summary: "Fastly's status page by service and point of presence; many package registries and sites sit behind Fastly."}
  - {id: akamai-status, title: "Akamai status", url: "https://www.akamaistatus.com/", spl: true, vendor: Akamai, products: [Akamai CDN, security services], summary: "Akamai's status page for CDN and security services."}
  - {id: deno-status, title: "Deno status", url: "https://denostatus.com/", spl: true, vendor: Deno, products: [Deno Deploy, JSR], summary: "Status of Deno Deploy and Deno's hosted services."}
  - {id: tailscale-status, title: "Tailscale status", url: "https://status.tailscale.com/", spl: true, vendor: Tailscale, products: [Tailscale control plane, DERP relays], summary: "Tailscale's status page; control-plane incidents block new connections to remote dev machines and runners."}
  # ---------------------------------------------------------------- databases and backends
  - {id: supabase-status, title: "Supabase status", url: "https://status.supabase.com", verification: search-result, vendor: Supabase, products: [Database, Auth, Storage, Realtime, Edge Functions, Supavisor], summary: "Supabase's status page with per-region components (Supavisor pooler clusters, Management API, Storage, Auth).", notes: "Confirmed through third-party mirrors (OpenStatus, StatusGator, Pulsetic) that read it; no feed URL was confirmed."}
  - {id: neon-status, title: "Neon status", url: "https://neon.tech/docs/introduction/status", verification: search-result, vendor: Neon, products: [Neon Postgres, Console, API], summary: "Neon's documentation page describing its dedicated status page, which reports console and API requests, database operations and connectivity per region; follow the link there.", feed_format: none}
  - {id: planetscale-status, title: "PlanetScale status", url: "https://www.planetscalestatus.com/", spl: true, vendor: PlanetScale, products: [PlanetScale Postgres, Vitess, API], summary: "PlanetScale's status page for databases, branching and the API."}
  - {id: mongodb-status, title: "MongoDB Cloud status", url: "https://status.mongodb.com/", spl: true, vendor: MongoDB, products: [MongoDB Atlas], summary: "Status of MongoDB Atlas and MongoDB cloud services."}
  - {id: clickhouse-status, title: "ClickHouse Cloud status", url: "https://status.clickhouse.com/", spl: true, vendor: ClickHouse, products: [ClickHouse Cloud], summary: "Status of ClickHouse Cloud services."}
  - {id: snowflake-status, title: "Snowflake status", url: "https://status.snowflake.com/", spl: true, vendor: Snowflake, products: [Snowflake, Cortex AI], summary: "Snowflake's status page by cloud and region, including Cortex AI functions."}
  # ---------------------------------------------------------------- payments, messaging, identity
  - {id: stripe-status, title: "Stripe status", url: "https://status.stripe.com/", feed_url: "https://www.stripestatus.com/history.rss", feed_format: rss, spl: true, vendor: Stripe, products: [Stripe API, Checkout, Dashboard], summary: "Stripe's status page for the API, Checkout, webhooks and the Dashboard.", cautions: ["The RSS URL comes from a community list and is on a different domain from the status page; confirm it returns RSS before relying on it."]}
  - {id: twilio-status, title: "Twilio status", url: "https://status.twilio.com/", verification: search-result, vendor: Twilio, products: [Messaging, Voice, Verify, carrier networks], summary: "Twilio's status page with per-product and per-carrier components. Twilio announced email, RSS, SMS and webhook subscriptions and a Status API for this page.", notes: "Feed URL not confirmed; use the page's Subscribe options."}
  - {id: sendgrid-status, title: "Twilio SendGrid status", url: "https://status.sendgrid.com/", spl: true, vendor: Twilio, products: [SendGrid email API], summary: "Status of SendGrid mail sending, event webhooks and the API."}
  - {id: auth0-status, title: "Auth0 status", url: "https://status.auth0.com/", spl: true, vendor: Okta, products: [Auth0], summary: "Auth0's status page by region and tenant environment."}
  - {id: okta-status, title: "Okta status", url: "https://status.okta.com/", feed_url: "https://feeds.feedburner.com/OktaTrustRSS", feed_format: rss, spl: true, vendor: Okta, products: [Okta Workforce Identity], summary: "Okta's trust and status page.", notes: "The FeedBurner RSS URL is from the talonx list fetched 2026-10-10; FeedBurner feeds can go stale, so check the newest entry date."}
  # ---------------------------------------------------------------- collaboration and observability
  - {id: slack-status, title: "Slack status", url: "https://slack-status.com/", spl: true, vendor: Salesforce Slack, products: [Slack, Slack API, Events API], summary: "Slack's status page, including the API and Events API that agent integrations use.", notes: "A community list gives feeds at https://status.slack.com/feed/rss and /feed/atom (a different host from Sentry's slack-status.com); confirm which host your poller should use."}
  - {id: discord-status, title: "Discord status", url: "https://discordstatus.com/", spl: true, vendor: Discord, products: [Discord API, Gateway], summary: "Discord's status page, including API and gateway latency for bots."}
  - {id: zoom-status, title: "Zoom status", url: "https://status.zoom.us/", feed_url: "https://status.zoom.us/history.rss", feed_format: rss, spl: true, vendor: Zoom, products: [Zoom Meetings, Zoom API], summary: "Zoom's status page for meetings, webhooks and the API.", notes: "Feed URL from the talonx list fetched 2026-10-10."}
  - {id: datadog-us1-status, title: "Datadog status (US1)", url: "https://status.datadoghq.com/", feed_url: "https://status.datadoghq.com/history.rss", feed_format: rss, spl: true, vendor: Datadog, products: [Datadog US1], summary: "Datadog's US1 site status (ingestion, monitors, APM, logs).", notes: "Feed URL from the talonx list. Other Datadog sites have their own pages."}
  - {id: datadog-eu-status, title: "Datadog status (EU)", url: "https://status.datadoghq.eu/", spl: true, vendor: Datadog, products: [Datadog EU1], summary: "Datadog's EU site status."}
  - {id: newrelic-status, title: "New Relic status", url: "https://status.newrelic.com/", feed_url: "https://status.newrelic.com/api/v2/summary.json", feed_format: statuspage, verification: search-result, vendor: New Relic, products: [New Relic], summary: "New Relic's Statuspage; its /api documentation page (status.newrelic.com/api) documents summary.json with component statuses operational, degraded_performance, partial_outage and major_outage."}
  - {id: pagerduty-status, title: "PagerDuty status", url: "https://status.pagerduty.com/", spl: true, vendor: PagerDuty, products: [PagerDuty], summary: "PagerDuty's status page; if paging itself is degraded, incident agents need a fallback channel."}
  - {id: incidentio-status, title: "incident.io status", url: "https://status.incident.io/", spl: true, vendor: incident.io, products: [incident.io], summary: "Status of incident.io, which also hosts other vendors' status pages (OpenAI's among them, per 2025 reports)."}
  - {id: launchdarkly-status, title: "LaunchDarkly status", url: "https://status.launchdarkly.com/", spl: true, vendor: LaunchDarkly, products: [LaunchDarkly], summary: "LaunchDarkly's status page for flag delivery and the API; flag outages change application behaviour without a deploy."}
  - {id: expo-status, title: "Expo status", url: "https://status.expo.dev/", feed_url: "https://status.expo.dev/api/v2/summary.json", feed_format: statuspage, verification: search-result, vendor: Expo, products: [EAS Build, EAS Update, EAS Submit], summary: "Expo's Statuspage for EAS Build, Update and Submit; its /api page documents the standard Statuspage endpoints."}
  - {id: microsoft-cloud-status, title: "Microsoft cloud status (Microsoft 365)", url: "https://status.cloud.microsoft/", spl: true, vendor: Microsoft, products: [Microsoft 365, Entra ID], summary: "Microsoft's public status page for Microsoft 365 and identity services; Entra ID incidents break sign-in for many developer tools."}
  - {id: google-workspace-status, title: "Google Workspace status dashboard", url: "https://www.google.com/appsstatus/dashboard/", spl: true, vendor: Google, products: [Gmail, Google Drive, Google Workspace APIs], summary: "Google Workspace status; relevant for agents that ingest newsletters by email or read Drive."}
  - {id: shopify-status, title: "Shopify status", url: "https://www.shopifystatus.com/", spl: true, vendor: Shopify, products: [Shopify, Shopify APIs], summary: "Shopify's status page for storefronts, admin, checkout and APIs."}
  - {id: algolia-status, title: "Algolia status", url: "https://status.algolia.com/", spl: true, vendor: Algolia, products: [Algolia Search], summary: "Algolia's status page by cluster and region."}
