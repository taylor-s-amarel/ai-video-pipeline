  - {gh: ml-explore/mlx, title: "MLX releases", vendor: Apple, products: [MLX], seen: "v0.32.3 on 2026-09-29", summary: "Release notes for Apple's MLX array framework for Apple silicon; kernel, quantisation and Metal changes that affect local model speed on Macs."}
  - {gh: ml-explore/mlx-lm, title: "MLX LM releases", vendor: Apple, products: [mlx-lm], seen: "v0.32.0 on 2026-09-30", summary: "Release notes for mlx-lm, which runs and fine-tunes language models on Apple silicon; new architectures (for example Mistral 4 and MiniMax fixes) appear here."}
