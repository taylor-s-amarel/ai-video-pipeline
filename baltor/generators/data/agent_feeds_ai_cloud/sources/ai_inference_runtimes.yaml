collection:
  id: updates-ai-inference-runtimes
  title: "Release feeds: open-model runtimes, serving and training libraries"
  description: "GitHub release Atom feeds for the engines that run and tune open-weight models: SGLang, MLX, ONNX Runtime, TensorRT-LLM, TGI, llamafile, LocalAI, Dynamo, llm-d, Triton, OpenVINO, Ray and the Hugging Face training stack. New model architectures, quantisation formats, CUDA/ROCm requirements and breaking flag changes land here first. Every feed was fetched on 2026-10-10. Ollama, llama.cpp, vLLM and Transformers are in community-releases-agents-ai and are not repeated."
  tags: [ai, inference, local-llm, serving, training, github]
  defaults: {terms: github, poll: release, feed_format: github-releases, auth: none, verification: fetched,
             change_types: [release, model-release, breaking-change, security]}

items:
