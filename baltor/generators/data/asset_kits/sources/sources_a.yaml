- id: gltf_cleanup_for_godot_and_video
  name: Clean up downloaded 3D models for Godot, Blender and video
  description: >-
    Use after downloading any GLB/FBX/OBJ: inspect it, decode Draco or meshopt if needed, fix scale and
    units, reduce triangles and textures, validate, then import. Uses the gltf_glb_inspector module and
    open tools (glTF-Transform, gltfpack, glTF-Validator, obj2gltf, Blender).
  summary: Inspect, decode, rescale, optimise and validate downloaded 3D models before they enter a Godot scene or render.
  tags: [gltf, optimisation, validation, godot, blender, pipeline]
  homepage: https://github.com/donmccurdy/glTF-Transform
  licence_summary: "Tools: glTF-Transform MIT, meshoptimizer/gltfpack MIT, glTF-Validator Apache-2.0, obj2gltf Apache-2.0. Tool licences do not change the model's own licence."
  licences:
    - {id: MIT, url: "https://github.com/donmccurdy/glTF-Transform", applies_to: "glTF-Transform"}
    - {id: MIT, url: "https://github.com/zeux/meshoptimizer", applies_to: "meshoptimizer and gltfpack"}
    - {id: Apache-2.0, url: "https://github.com/KhronosGroup/glTF-Validator", applies_to: "glTF-Validator"}
    - {id: Apache-2.0, url: "https://github.com/CesiumGS/obj2gltf", applies_to: "obj2gltf"}
  attribution: {required: never, credit_template: ""}
  redistribution: allowed
  commercial_use: allowed
  ai_training: unspecified
  automated_download: allowed
  formats: [glb, gltf, obj, fbx]
  search:
    - {label: "glTF-Transform", url: "https://github.com/donmccurdy/glTF-Transform"}
    - {label: "glTF-Validator", url: "https://github.com/KhronosGroup/glTF-Validator"}
    - {label: "meshoptimizer / gltfpack", url: "https://github.com/zeux/meshoptimizer"}
    - {label: "Godot: available 3D formats", url: "https://docs.godotengine.org/en/stable/tutorials/assets_pipeline/importing_3d_scenes/available_formats.html"}
  cautions:
    - "Optimising never changes the licence: carry the source, licence and credit into the new file's manifest entry."
  search_howto: |
    1. `python gltf_glb_inspector.py model.glb` - note extensionsRequired, triangles, bounds and copyright.
    2. If Draco/meshopt is required and your importer lacks it, decode it (Blender import + GLB re-export works).
    3. Scale: set the root scale so the largest dimension matches real size (inspector bounds).
    4. Reduce: `gltf-transform resize in.glb out.glb --width 1024 --height 1024`; `gltf-transform optimize` for size.
    5. Validate with glTF-Validator, then import.
  godot: |
    - glTF 2.0 is Godot's recommended 3D format; `.blend` import needs Blender installed and FBX goes through ufbx.
  blender: |
    - `bpy.ops.import_scene.gltf(filepath=...)` then File > Export > glTF 2.0 to write a cleaned GLB.
  pitfalls:
    - "OBJ carries no animation or PBR metadata; convert to glTF with obj2gltf or Blender."
  example_asset:
    id: cleaned-model
    title: Cleaned model (derived)
    creator: Original creator (keep)
    source_url: https://github.com/donmccurdy/glTF-Transform
    licence: "Same as the original model"
    licence_url: https://github.com/donmccurdy/glTF-Transform
    attribution: "Keep the original credit line"
    attribution_required: false
    redistribution: allowed
    format: glb
    intended_use: [optimised copy for Godot]
    will_modify: true
    fetch: {method: manual-page, status: manual}
