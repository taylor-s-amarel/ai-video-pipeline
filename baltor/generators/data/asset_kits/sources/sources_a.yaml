  description: >-
    Use for space and science shorts that need real spacecraft models (Apollo Lunar Module, Hubble,
    Curiosity, astronaut, Gateway). NASA's repository states the assets are free and without copyright,
    subject to NASA's media usage guidelines. Covers download from GitHub, Draco/WebP pitfalls and scale.
  summary: Download NASA 3D Resources GLB/BLEND models from GitHub, handle Draco and WebP, normalise scale, and follow NASA usage rules.
  tags: [nasa, space, 3d, gltf, public-domain]
  homepage: https://github.com/nasa/NASA-3D-Resources
  licence_summary: "The repository README says the assets are free and without copyright and points to NASA's usage guidelines. Do not use NASA insignia or imply NASA endorsement; some models come from outside contributors."
