# Source skills, part A: model, texture and game-asset libraries.
# Every URL below was verified on 2026-10-10 (fetched on GitHub or confirmed in search results).
- id: kenney_assets_cc0
  name: Kenney game assets (CC0)
  description: >-
    Use when a project needs free, consistent 2D sprites, tiles, UI, 3D low-poly kits, fonts or sound
    effects with no attribution duty: Kenney's packs are CC0. Covers finding the right pack, the
    optional credit line, Godot 4 and Blender import, and pitfalls (logo use, paid All-in-1 bundle).
  summary: Find, credit and import Kenney's CC0 2D, 3D, UI, font and audio packs into Godot 4, Blender and video renders.
  tags: [kenney, cc0, 2d, 3d, ui, audio, godot]
  homepage: https://kenney.nl/support
  licence_summary: "All game assets on Kenney's asset pages are CC0 (public domain dedication). Credit is optional. Do not use the Kenney logo, which is reserved for official projects."
  licences:
    - {id: CC0-1.0, url: "https://kenney.nl/support", applies_to: "all asset packs on kenney.nl"}
    - {id: MIT, url: "https://github.com/KenneyNL/Starter-Kit-3D-Platformer", applies_to: "code of the Godot starter kits"}
  attribution: {required: optional, credit_template: "Assets by Kenney (kenney.nl), CC0"}
  redistribution: allowed
  commercial_use: allowed
  ai_training: unspecified
  automated_download: unspecified
  formats: [png, svg, glb, fbx, obj, ogg, wav, ttf]
  search:
    - {label: "3D kits", url: "https://kenney.nl/assets/category:3D"}
    - {label: "Audio packs", url: "https://kenney.nl/assets/category:Audio"}
    - {label: "Tiny 16x16 series", url: "https://kenney.nl/assets/series:Tiny"}
    - {label: "Godot starter kits", url: "https://kenney.nl/starter-kits"}
    - {label: "Kenney on the Godot Asset Store", url: "https://store.godotengine.org/publisher/kenney/"}
    - {label: "KenneyNL on GitHub", url: "https://github.com/KenneyNL"}
  cautions:
    - "Do not use the Kenney logo or imply an official Kenney project."
    - "The All-in-1 bundle is a paid convenience; every pack is free from its own page."
    - "Input-prompt packs show console controllers: CC0 covers the art, not the platform trademarks."
  search_howto: |
    Open a category or series page, pick packs that share a grid (all "Tiny" packs are 16x16; Pixel Platformer is 18x18)
    and download each pack's zip from its page. Packs that share a series also share a palette, so they mix cleanly.
    For Godot templates, the starter kits (3D platformer, city builder, racing, FPS) are MIT code with CC0 assets.
  godot: |
    - 2D pixel packs: copy PNGs under `res://art/kenney/<pack>/`, then run the `godot_texture_import_presets`
      module with `--preset pixel-art-2d` before opening the editor (Nearest filter, lossless, no mipmaps).
    - Tile sheets: create a TileSet from the spritesheet PNG with the pack's tile size and spacing (read it from the
      pack's sheet or the `sprite_sheet_slicer` module's `grid` output).
    - 3D kits: prefer the GLB files; drag into the scene or instance them; use the `texture-3d` preset for any
      separate textures. Most Kenney 3D kits use a shared colour-palette texture, so keep it lossless.
  blender: |
    - `bpy.ops.import_scene.gltf(filepath="kit/Models/GLB format/tree.glb")` for GLB, `bpy.ops.import_scene.fbx` for FBX.
    - Pixel-palette textures: set the Image Texture node interpolation to Closest so colours do not bleed.
  pitfalls:
    - "Do not rescale pixel art by non-integer factors; use `pixel_art_video_fit` for 1080x1920 frames."
    - "Pack versions change asset counts over time; record the version in the media pack manifest notes."
  example_asset:
    id: kenney-tiny-town
    title: Tiny Town
    creator: Kenney
    source_url: https://kenney.nl/assets/tiny-town
    licence: CC0-1.0
    licence_url: https://kenney.nl/support
    attribution: "Tiny Town by Kenney (kenney.nl), CC0"
    attribution_required: false
    redistribution: allowed
    format: zip
    intended_use: [top-down town background, maze walls]
    fetch: {method: manual-page, status: to-fetch}
    import_hints: {godot: {importer: texture, preset: pixel-art-2d}}

- id: quaternius_low_poly_assets
  name: Quaternius low-poly packs (CC0)
  description: >-
    Use when a scene needs free low-poly 3D models or humanoid animations (nature, farm, medieval,
    sci-fi, animals, characters, Universal Animation Library) under CC0. Explains free versus paid Source
    tiers, credit, glTF import into Godot 4 and Blender, and retargeting the animation library.
  summary: Choose, credit and import Quaternius CC0 low-poly packs and the Universal Animation Library into Godot 4 and Blender.
  tags: [quaternius, cc0, 3d, low-poly, animation, godot, blender]
  homepage: https://quaternius.com/
  licence_summary: "Quaternius releases its free packs under CC0: commercial use allowed, no attribution required. Some MegaKits also sell a 'Source' tier with engine projects."
  licences:
    - {id: CC0-1.0, url: "https://quaternius.com/", applies_to: "free pack downloads"}
  attribution: {required: optional, credit_template: "Models by Quaternius (quaternius.com), CC0"}
  redistribution: allowed
  commercial_use: allowed
  ai_training: unspecified
  automated_download: unspecified
  formats: [glb, gltf, fbx, obj, blend]
  search:
    - {label: "All packs", url: "https://quaternius.com/"}
    - {label: "Universal Animation Library", url: "https://quaternius.com/packs/universalanimationlibrary.html"}
    - {label: "Universal Base Characters", url: "https://quaternius.com/packs/universalbasecharacters.html"}
    - {label: "Farm Buildings", url: "https://quaternius.com/packs/farmbuildings.html"}
    - {label: "Ultimate Space Kit", url: "https://quaternius.com/packs/ultimatespacekit.html"}
  cautions:
    - "MegaKit 'Source' tiers (Unity/Unreal/Godot implementations) are paid; the free download is the model set."
    - "CC0 has no warranty: check scale, pivots and animation names after import."
  search_howto: |
    Browse the home page by theme; each pack page lists model count, release date and formats. Prefer packs that
    list glTF. For characters, pair Universal Base Characters with the Universal Animation Library (120+ animations
    on one humanoid rig) instead of Mixamo when you need files you can redistribute.
  godot: |
    - Import the `.glb`/`.gltf`; in the Import dock set Root Type as needed and enable animation import.
    - For the Universal Animation Library, set up a BoneMap with `SkeletonProfileHumanoid` in Advanced Import
      Settings so the clips retarget onto other humanoids (see the Godot "Retargeting 3D Skeletons" guide).
  blender: |
    - `bpy.ops.import_scene.gltf(filepath=...)`; `.blend` packs can be appended with File > Append.
    - Check Object > Apply > Scale before export if you rescale; keep Y-up/+Z-forward glTF conventions on re-export.
  pitfalls:
    - "Older packs ship FBX/OBJ/Blend only; convert to GLB in Blender rather than using OBJ (no animation)."
  example_asset:
    id: quaternius-farm-animals
    title: Farm Animal Pack
    creator: Quaternius
    source_url: https://quaternius.com/packs/farmanimal.html
    licence: CC0-1.0
    licence_url: https://quaternius.com/packs/farmanimal.html
    attribution: "Farm Animal Pack by Quaternius, CC0"
    attribution_required: false
    redistribution: allowed
    format: zip
    intended_use: [animated farm animals for a diorama]
    fetch: {method: manual-page, status: to-fetch}
    import_hints: {godot: {importer: scene}, blender: {operator: bpy.ops.import_scene.fbx}}

- id: kaykit_asset_packs
