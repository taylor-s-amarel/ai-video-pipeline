- id: blenderkit_and_fab_licences
  name: Royalty-free marketplaces (BlenderKit, Fab) - what you may not do
  description: >-
    Use when an asset comes from BlenderKit (Royalty Free or CC0) or Epic's Fab (Fab Standard License,
    formerly Megascans). These are not CC licences: use inside your work is broad, but redistributing
    the asset files is not allowed. Explains how to keep them out of repositories and Baltor packages.
  summary: "Handle BlenderKit Royalty Free and Fab Standard License assets: use them in renders, never redistribute the files."
  tags: [blenderkit, fab, megascans, royalty-free, licensing]
  homepage: https://www.blenderkit.com/docs/licenses/
  licence_summary: "BlenderKit Royalty Free: commercial use without credit, but no resale or redistribution of the asset itself (including inside asset packs or game levels sold on marketplaces); BlenderKit also hosts CC0 assets. Fab Standard License: use in any engine or tool under Epic's terms; files are licensed to the claiming account."
  licences:
    - {id: BlenderKit-Royalty-Free, url: "https://www.blenderkit.com/docs/licenses/", applies_to: "BlenderKit RF assets"}
    - {id: Fab-Standard-License, url: "https://www.cgchannel.com/2024/10/epic-games-has-made-megascans-free-to-all-but-only-until-the-end-of-2024/", applies_to: "Fab/Megascans (read the current licence on fab.com)"}
  attribution: {required: never, credit_template: "Asset: {title} ({marketplace}), used under {licence}"}
  redistribution: project-only
  commercial_use: allowed
  ai_training: unspecified
  automated_download: forbidden
  formats: [blend, fbx, glb, jpg, exr]
  search:
    - {label: "BlenderKit licences", url: "https://www.blenderkit.com/docs/licenses/"}
    - {label: "Fab launch (Sketchfab blog)", url: "https://sketchfab.com/blogs/community/epics-unified-marketplace-fab-launches-today"}
  cautions:
    - "Never commit Royalty Free or Fab files to a public repository or a Baltor package; ship a manifest entry with redistribution: project-only."
    - "Fab terms changed in 2024-2025; re-read the current Fab Standard License before each project."
  search_howto: |
    Prefer CC0 sources first. When a marketplace asset is the only option, record it with redistribution
    `project-only`, keep the files in an ignored local folder, and render them into the final video only.
  godot: |
    - Keep marketplace assets in a `.gitignore`d folder (for example `res://_licensed/`) and ship the project
      without them; the media pack manifest tells the next person what to download.
  blender: |
    - Link or append from a local library outside the repository; pack textures only in local renders.
  pitfalls:
    - "A downloaded .blend that embeds RF textures is still the RF asset; do not share it."
  example_asset:
    id: blenderkit-rf-chair
    title: Example BlenderKit Royalty Free chair (fill in)
    creator: BlenderKit author (fill in)
    source_url: https://www.blenderkit.com/docs/licenses/
    licence: "BlenderKit Royalty Free"
    licence_url: https://www.blenderkit.com/docs/licenses/
    attribution: ""
    attribution_required: false
    redistribution: project-only
    format: blend
    intended_use: [rendered prop only]
    fetch: {method: manual-page, status: manual}

