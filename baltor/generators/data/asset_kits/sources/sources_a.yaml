  licence_summary: "Each downloadable model has a CC licence chosen by its author; CC BY requires credit, NC forbids commercial use, ND forbids modification. Store models use Standard or Editorial licences, and purchased models may never be offered for download to others."
  licences:
    - {id: per-asset, url: "https://help.sketchfab.com/en/articles/16152221-choosing-your-model-s-license", applies_to: "downloadable models"}
