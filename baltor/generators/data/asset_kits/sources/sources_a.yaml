  description: >-
    Use for history and science shorts that need museum objects. Smithsonian Open Access publishes
    CC0 metadata (11M+ records) and CC0 media for objects marked Open Access; this skill shows how to
    query the metadata dump, check each record's rights, and avoid people/trademark problems.
  summary: Find CC0 Smithsonian Open Access objects via the metadata dump, confirm each record's rights, and credit the museum.
  tags: [smithsonian, museum, cc0, history, metadata]
