    source_url: https://kaylousberg.itch.io/kaykit-dungeon-remastered
    licence: CC0-1.0
    licence_url: https://creativecommons.org/publicdomain/zero/1.0/deed.en
    attribution: "KayKit Dungeon Pack Remastered by Kay Lousberg, CC0"
    attribution_required: false
    redistribution: allowed
    format: zip
    intended_use: [3D maze and dungeon set]
    restrictions: ["Do not resell unmodified copies (author request)."]
    fetch: {method: manual-page, status: to-fetch}

- id: poly_haven_assets
  name: Poly Haven HDRIs, textures and models (CC0, with API)
  description: >-
    Use when a render or Godot scene needs photoreal HDRI lighting/skies, PBR textures or models. Poly
    Haven assets are CC0 and its public JSON API lists every asset with download URLs and hashes.
    Covers API use, credit expectations, Godot sky/material setup and Blender world lighting.
  summary: Fetch Poly Haven CC0 HDRIs, PBR textures and models via its API, verify hashes, and set them up in Godot 4 and Blender.
  tags: [polyhaven, cc0, hdri, pbr, api, godot, blender]
  homepage: https://polyhaven.com/
  licence_summary: "All Poly Haven assets are CC0. You may not claim to be the original author or re-license them as your own. The API is free for everyone including commercial use; Poly Haven asks API users to make clear to their users that the assets come from Poly Haven."
  licences:
    - {id: CC0-1.0, url: "https://docs.polyhaven.com/en/faq", applies_to: "all HDRIs, textures and models"}
  attribution: {required: optional, credit_template: "HDRI/texture: {title} from Poly Haven (polyhaven.com), CC0"}
  redistribution: allowed
  commercial_use: allowed
  ai_training: allowed
  automated_download: api-only
  formats: [hdr, exr, jpg, png, glb, gltf, blend, fbx]
  search:
    - {label: "HDRIs", url: "https://polyhaven.com/hdris"}
    - {label: "Textures", url: "https://polyhaven.com/textures"}
    - {label: "Models", url: "https://polyhaven.com/models"}
    - {label: "Sunrise/sunset HDRIs", url: "https://polyhaven.com/hdris/sunrise-sunset"}
  api: {url: "https://polyhaven.com/our-api", auth: none, notes: "Lists assets with categories, tags, authors, download URLs, hashes and sizes; e.g. api.polyhaven.com/assets?type=hdris."}
  cautions:
    - "CC0 does not clear trademarks or recognisable private places in scans."
    - "Download only what the project uses; bulk mirroring wastes donated bandwidth."
  search_howto: |
    Filter HDRIs by category (Pure Skies, Fields & Countryside, Studio ...). A 2K or 4K HDRI is enough for lighting
    and a blurred moving background; 8K+ is only needed when the sky is seen sharp. Use the API for scripted
    pipelines (the `polydown` CLI or the `dcc-asset-polyhaven` agent skill wrap it) and verify each download against
    the hash the API returns with the `media_pack_fetcher` module.
  godot: |
    - HDRI sky: WorldEnvironment > Environment > Background: Sky > Sky Material: PanoramaSkyMaterial, panorama = the
      imported `.hdr`/`.exr`. Ambient light and reflections then come from the sky.
    - Textures: albedo/roughness/AO with the `texture-3d` preset, the normal map with `normal-map-3d`.
  blender: |
    - World shader: Environment Texture node -> Background; set the strength, rotate with a Mapping node.
    - Models: `bpy.ops.import_scene.gltf(filepath=...)` or append from the `.blend`.
  pitfalls:
    - "Godot expects OpenGL-style normal maps (Y+); pick the GL variant when a site offers GL and DX."
    - "Very large EXRs slow imports; downscale for video backgrounds."
  example_asset:
    id: polyhaven-grasslands-sunset
    title: Grasslands Sunset HDRI
    creator: Poly Haven
    source_url: https://polyhaven.com/a/grasslands_sunset
    licence: CC0-1.0
    licence_url: https://docs.polyhaven.com/en/faq
    attribution: "Grasslands Sunset HDRI from Poly Haven, CC0"
    attribution_required: false
    redistribution: allowed
    format: hdr
    intended_use: [sky and lighting for a farm diorama]
    fetch: {method: api, status: to-fetch}
    import_hints: {godot: {importer: texture, notes: "PanoramaSkyMaterial panorama"}, video: {role: hdri-lighting}}

- id: ambientcg_materials
  name: ambientCG PBR materials and HDRIs (CC0, API v2/v3)
  description: >-
    Use when a Blender or Godot scene needs CC0 PBR materials (ground, wood, brick, metal ...) or HDRIs
    from ambientCG, by hand or through its JSON API. Covers the licence, the frozen v2 versus current v3
    API, map naming, and Godot/Blender material setup.
  summary: Search ambientCG CC0 materials by API or site, download the right map set and build Godot 4 and Blender materials.
  tags: [ambientcg, cc0, pbr, materials, api]
  homepage: https://ambientcg.com/
  licence_summary: "All ambientCG assets are under CC0 1.0 Universal; credit is not required but appreciated."
  licences:
    - {id: CC0-1.0, url: "https://docs.ambientcg.com/license/", applies_to: "all assets"}
  attribution: {required: optional, credit_template: "Materials from ambientCG.com, CC0"}
  redistribution: allowed
  commercial_use: allowed
  ai_training: unspecified
  automated_download: api-only
  formats: [jpg, png, exr, zip]
  search:
    - {label: "Asset search", url: "https://ambientcg.com/list"}
    - {label: "API overview", url: "https://docs.ambientcg.com/api/"}
    - {label: "API v2 /full_json", url: "https://docs.ambientcg.com/api/v2/full_json/"}
  api: {url: "https://docs.ambientcg.com/api/", auth: none, notes: "v2 is frozen; new projects should use v3. The v2 zipContent field now always returns []."}
  cautions:
    - "Watch the technical updates page before relying on API response shapes."
  search_howto: |
    Filter the list page, then copy the same filters into an API query. Download the zip at the resolution you need
    (2K is plenty for most video shots); each zip holds colour, normal (GL and DX variants), roughness,
    displacement and sometimes AO/metalness maps.
  godot: |
    - StandardMaterial3D: albedo = Color map, roughness = Roughness, normal = NormalGL (enable Normal Map),
      heightmap = Displacement if needed. Import maps with `texture-3d` and the normal with `normal-map-3d`.
  blender: |
    - Principled BSDF: Color -> Base Color; Roughness (Non-Color) -> Roughness; NormalGL (Non-Color) -> Normal Map node.
  pitfalls:
    - "Use the NormalGL map for both Godot and Blender; the DX map has the green channel flipped."
  example_asset:
    id: ambientcg-wood-026
    title: Wood 026
    creator: ambientCG
    source_url: https://ambientcg.com/view?id=Wood026
    licence: CC0-1.0
    licence_url: https://docs.ambientcg.com/license/
    attribution: "Wood 026 from ambientCG.com, CC0"
    attribution_required: false
    redistribution: allowed
    format: zip
    intended_use: [table and floor material]
    fetch: {method: api, status: to-fetch}
    import_hints: {godot: {importer: texture, preset: texture-3d}}

- id: poly_pizza_models
  name: Poly Pizza low-poly models (per-model CC0 or CC-BY)
  description: >-
    Use when you need one specific low-poly object fast (a pizza, a car, a cloud) from Poly Pizza's
    library, which mixes CC0 uploads with CC-BY models such as the archived Poly by Google set.
    Explains reading each model's licence, building the credit line, and importing the GLB.
  summary: Find single low-poly models on Poly Pizza, record the per-model CC0/CC-BY licence and credit line, and import the GLB.
  tags: [poly-pizza, low-poly, cc-by, cc0, 3d]
  homepage: https://poly.pizza/
  licence_summary: "Licence is per model: many are CC0 (Kenney, Quaternius uploads), many archived Poly by Google models are CC-BY and need credit."
  licences:
    - {id: CC0-1.0, url: "https://creativecommons.org/publicdomain/zero/1.0/deed.en", applies_to: "models marked CC0"}
    - {id: CC-BY, url: "https://creativecommons.org/licenses/by/4.0/deed.en", applies_to: "models marked Creative Commons Attribution (check the version on the page)"}
  attribution: {required: per-asset, credit_template: "{title} by {creator} [CC-BY] via Poly Pizza (poly.pizza)"}
  redistribution: per-asset
  commercial_use: allowed
  ai_training: unspecified
  automated_download: unspecified
  formats: [glb, gltf, obj]
  search:
    - {label: "Search", url: "https://poly.pizza/search/Low%20Poly%20Art"}
    - {label: "Example CC0 model (Kenney pizza)", url: "https://poly.pizza/m/fJsz9IVM8f"}
    - {label: "Example CC-BY model (Poly by Google forest)", url: "https://poly.pizza/m/2_fv3tn3NG_"}
  api: {url: "https://poly.pizza/docs/press", auth: key, notes: "The press page describes an API (free for hobby use, pay-as-you-go commercially); check current docs."}
  cautions:
    - "Paid packs from other studios appear in search results; skip anything not free."
    - "Record the exact CC-BY version shown on each model page."
  search_howto: |
    Search by object name, open the model page, read the licence badge and creator, then download GLTF/GLB.
    Put the credit line in the media pack manifest before you use the model.
  godot: |
    - Import the GLB; Poly by Google models often have very different scales, so normalise with the
      `gltf_glb_inspector` bounds before placing them.
  blender: |
    - `bpy.ops.import_scene.gltf(filepath=...)`; apply scale after normalising.
  pitfalls:
    - "Do not assume a whole search page shares one licence."
  example_asset:
    id: poly-pizza-forest
    title: Forest
    creator: Poly by Google
    source_url: https://poly.pizza/m/2_fv3tn3NG_
    licence: "CC-BY (version as shown on the model page)"
    licence_url: https://poly.pizza/m/2_fv3tn3NG_
    attribution: "Forest by Poly by Google [CC-BY] via Poly Pizza"
    attribution_required: true
    redistribution: allowed-with-licence
    format: glb
    intended_use: [background tree cluster]
    fetch: {method: manual-page, status: to-fetch}

- id: opengameart_assets
  name: OpenGameArt (per-asset licences)
  description: >-
    Use when searching OpenGameArt for sprites, tiles, music or sound effects. Every submission has its
    own licence (CC0, CC-BY, CC-BY-SA, OGA-BY, GPL); this skill explains reading it, building credits in
    the artist's requested format, share-alike and DRM clauses, and LPC-style collections.
  summary: "Use OpenGameArt safely: per-asset licences, artist credit format, share-alike and DRM clauses, and LPC collections."
  tags: [opengameart, licensing, cc-by-sa, sprites, sfx]
  homepage: https://opengameart.org/content/faq
  licence_summary: "Each OpenGameArt submission has its own licence (CC0, CC-BY, CC-BY-SA, OGA-BY, GPL ...). You may use art commercially if you follow its licence. Credit in the artist's 'Copyright/Attribution Notice' format when one is given."
  licences:
    - {id: per-asset, url: "https://opengameart.org/content/faq", applies_to: "every submission"}
  attribution: {required: per-asset, credit_template: "\"{title}\" by {creator} (opengameart.org), {licence}"}
  redistribution: per-asset
  commercial_use: per-asset
  ai_training: per-asset
  automated_download: unspecified
  formats: [png, ogg, wav, mp3, zip]
  search:
    - {label: "FAQ and licences", url: "https://opengameart.org/content/faq"}
    - {label: "Liberated Pixel Cup collection", url: "https://opengameart.org/content/liberated-pixel-cup-0"}
    - {label: "512 retro sound effects (CC0)", url: "https://opengameart.org/content/512-sound-effects-8-bit-style"}
  cautions:
    - "CC-BY 3.0 and CC-BY-SA forbid adding technical restrictions (DRM); OGA-BY exists to allow DRM platforms."
    - "Collections mix licences; credit every contributing author."
    - "Mirrors can disagree with the original (Pixel Adventure is CC0 on itch.io, CC-BY 4.0 on OGA)."
  search_howto: |
    Use the site search with a licence filter, open each result and copy the licence and the attribution notice
    into the media pack manifest. Prefer CC0 for packages and repositories; CC-BY is fine for videos with credits.
  godot: |
    - Pixel art: `godot_texture_import_presets` with `pixel-art-2d`; slice sheets with `sprite_sheet_slicer`.
    - Audio: OGG for music loops (enable Loop in the import dock), WAV for short effects.
  blender: |
    - 2D sprites as planes: File > Import > Images as Planes; set interpolation to Closest for pixel art.
  pitfalls:
    - "Share-alike art that you modify must be released under the same licence; keep it out of packages that use another licence."
  example_asset:
    id: oga-512-sfx
    title: 512 Sound Effects (8-bit style)
    creator: SubspaceAudio
    source_url: https://opengameart.org/content/512-sound-effects-8-bit-style
    licence: CC0-1.0
    licence_url: https://opengameart.org/content/512-sound-effects-8-bit-style
    attribution: "512 Sound Effects (8-bit style) by SubspaceAudio, CC0"
    attribution_required: false
    redistribution: allowed
    format: zip
    intended_use: [retro UI and pickup sounds]
    fetch: {method: manual-page, status: to-fetch}
    import_hints: {video: {role: sfx}}

