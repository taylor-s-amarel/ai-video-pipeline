  description: >-
    Use when a project wants stylised low-poly KayKit models (dungeon, medieval hexagon, platformer,
    city builder, adventurer and skeleton characters). Covers the CC0 free tiers, paid Extra/Source
    tiers, the author's no-resale request, GitHub mirrors for scripted download, and import steps.
  summary: Use KayKit CC0 low-poly packs and rigged characters, respecting free versus paid tiers, with Godot 4 and Blender import steps.
  tags: [kaykit, cc0, 3d, low-poly, characters, godot]
  homepage: https://kaylousberg.itch.io/
  licence_summary: "Free KayKit tiers are CC0 (free for personal and commercial use, no attribution). The author asks that unmodified copies are not resold or claimed as your own. Extra and Source tiers are paid."
  licences:
    - {id: CC0-1.0, url: "https://creativecommons.org/publicdomain/zero/1.0/deed.en", applies_to: "free-tier downloads, as stated on each itch.io page"}
  attribution: {required: optional, credit_template: "KayKit assets by Kay Lousberg (kaylousberg.itch.io), CC0"}
  redistribution: allowed
  commercial_use: allowed
  ai_training: unspecified
  automated_download: unspecified
  formats: [glb, gltf, fbx, obj, blend]
  search:
    - {label: "All KayKit packs on itch.io", url: "https://kaylousberg.itch.io/"}
    - {label: "Dungeon Pack Remastered", url: "https://kaylousberg.itch.io/kaykit-dungeon-remastered"}
    - {label: "Medieval Hexagon Pack", url: "https://kaylousberg.itch.io/kaykit-medieval-hexagon"}
    - {label: "Character Pack: Adventurers", url: "https://kaylousberg.itch.io/kaykit-adventurers"}
    - {label: "GitHub mirrors", url: "https://github.com/KayKit-Game-Assets"}
  cautions:
    - "Do not resell unmodified copies or present them as your own work (author's request alongside CC0)."
    - "Record which tier you downloaded; Extra and Source tier files are paid."
  search_howto: |
    Each itch.io page shows the free tier contents and the paid tiers. For scripted downloads, several packs are
    mirrored in the KayKit-Game-Assets GitHub organisation; check each repository's LICENSE before relying on it.
  godot: |
    - Import GLB; KayKit characters come rigged and animated, so enable animation import and check clip names.
