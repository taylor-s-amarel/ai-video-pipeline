# Source skills, part B: characters, animation, motion, 2D, fonts, icons, audio and Godot sources.
# Every URL below was verified on 2026-10-10 (fetched on GitHub or confirmed in search results).
- id: mixamo_characters_and_animations
  name: Mixamo characters and animations (use in work, never redistribute raw files)
  description: >-
    Use when a humanoid needs quick rigging or mocap-style animations from Adobe Mixamo. Mixamo content
    is royalty free inside your projects, but raw character/animation files may not be redistributed or
    used to train ML models. Covers keeping files out of repos and packages, Godot retargeting and Blender.
  summary: Use Mixamo rigs and animations inside renders and games while keeping raw files out of repos, packages and training data.
  tags: [mixamo, animation, rigging, licensing, godot, blender]
  homepage: https://helpx.adobe.com/creative-cloud/faq/mixamo-faq.html
  licence_summary: "Adobe's FAQ: Mixamo characters and animations are royalty free for personal, commercial and non-profit projects. The fuller licensing FAQ (reposted on Adobe's forum) says the raw files may not be distributed, including in asset packs or engine templates, and may not be used to train machine-learning models."
  licences:
    - {id: Adobe-Mixamo-terms, url: "https://helpx.adobe.com/creative-cloud/faq/mixamo-faq.html", applies_to: "all Mixamo characters and animations"}
  attribution: {required: never, credit_template: "Animation: Adobe Mixamo"}
  redistribution: forbidden
  commercial_use: allowed
  ai_training: forbidden
  automated_download: forbidden
  formats: [fbx, dae]
  search:
    - {label: "Mixamo", url: "https://www.mixamo.com/"}
    - {label: "Animate characters (Adobe Help)", url: "https://helpx.adobe.com/creative-cloud/help/animate-characters-mixamo.html"}
    - {label: "Licensing FAQ repost", url: "https://community.adobe.com/questions-696/mixamo-faq-licensing-royalties-ownership-eula-and-tos-589400"}
  cautions:
    - "Never commit Mixamo FBX/DAE files to a public repository, a template or a Baltor package; record them with redistribution: forbidden."
    - "Do not use Mixamo files as machine-learning training data."
    - "Bipedal humanoids only; the site keeps only the last uploaded character."
  search_howto: |
    Sign in with an Adobe ID, upload or pick a character, search animations, set In Place for loops, and download FBX
    (With Skin for the first clip, Without Skin for the rest). Store the files in a git-ignored folder and list each
    clip in the media pack manifest with fetch.method manual-page. For redistributable projects use the CC0
    Quaternius Universal Animation Library instead.
  godot: |
    - Import the FBX (ufbx in Godot 4.3+). In Advanced Import Settings add a BoneMap with SkeletonProfileHumanoid so
      Mixamo bone names map and clips retarget; enable Fix Silhouette for A-pose rigs.
    - Save clips into an AnimationLibrary resource that stays in the ignored folder.
  blender: |
    - `bpy.ops.import_scene.fbx(filepath="Running.fbx")`; check the armature's scale after import (FBX files often
      arrive scaled for centimetre units) and apply scale before mixing with other rigs.
  pitfalls:
    - "A Godot or Blender project that embeds the raw Mixamo clips is a redistribution if you publish the project."
  example_asset:
    id: mixamo-run-cycle
    title: Running (Mixamo)
    creator: Adobe Mixamo
    source_url: https://www.mixamo.com/
    licence: "Adobe Mixamo terms"
    licence_url: https://helpx.adobe.com/creative-cloud/faq/mixamo-faq.html
    attribution: ""
    attribution_required: false
    redistribution: forbidden
    ai_training: forbidden
    format: fbx
    intended_use: [character run cycle in a rendered short]
    restrictions: ["Keep the FBX out of repositories and packages.", "Not for ML training."]
    fetch: {method: manual-page, status: manual}
    import_hints: {godot: {importer: scene, notes: "BoneMap + SkeletonProfileHumanoid"}, blender: {operator: bpy.ops.import_scene.fbx}}

- id: universal_lpc_spritesheets
  name: Universal LPC sprite sheets (CC0 / CC-BY / CC-BY-SA / OGA-BY / GPL per layer)
  description: >-
    Use when a top-down RPG or explainer needs layered 2D characters with walk, slash, cast and shoot
    animations from the Universal LPC Spritesheet Character Generator. Every layer has its own licence;
    this skill shows how to export the credits, meet share-alike/GPL duties and import into Godot.
  summary: Build LPC characters, export the per-layer credits file, meet CC-BY-SA/GPL duties, and import the sheet into Godot 4.
  tags: [lpc, sprites, 2d, characters, cc-by-sa, gpl]
  homepage: https://github.com/LiberatedPixelCup/Universal-LPC-Spritesheet-Character-Generator
  licence_summary: "Each image is available under one or more of CC0, CC-BY, CC-BY-SA, OGA-BY or GPL. Credit all authors except for CC0 art; CC-BY-SA derivatives must be CC-BY-SA 4.0+, GPL derivatives GPL 3.0+; CC-BY/CC-BY-SA may not be DRM-protected, OGA-BY may."
  licences:
    - {id: per-asset, url: "https://github.com/LiberatedPixelCup/Universal-LPC-Spritesheet-Character-Generator", applies_to: "every layer, listed in CREDITS.csv"}
  attribution: {required: required, credit_template: "Sprites contributed as part of the Liberated Pixel Cup project from OpenGameArt.org; authors: {authors from the exported credits}"}
  redistribution: allowed-with-licence
  commercial_use: allowed
  ai_training: per-asset
  automated_download: allowed
  formats: [png, csv, txt]
  search:
    - {label: "Generator repository (README, CREDITS.csv)", url: "https://github.com/LiberatedPixelCup/Universal-LPC-Spritesheet-Character-Generator"}
    - {label: "LPC collection on OpenGameArt", url: "https://opengameart.org/content/liberated-pixel-cup-0"}
    - {label: "LPC style guide", url: "https://lpc.opengameart.org/static/LPC-Style-Guide/build/styleguide.html"}
  cautions:
    - "Ship the exported credits (or CREDITS.csv) where users can find them, e.g. a credits screen or the video description link."
    - "Share-alike layers make derived sprites share-alike too; keep them out of packages with other licences."
  search_howto: |
    Build the character in the generator (hosted from the repository's GitHub Pages), export the sprite sheet and the
    licence/credits file for exactly the layers you used, and paste the authors into the manifest's attribution.
  godot: |
    - Import with `pixel-art-2d`; LPC frames are 64x64 on a grid: `sprite_sheet_slicer grid sheet.png --size 64x64`
      then build one SpriteFrames animation per row (walk up/left/down/right ...).
  blender: |
    - Use Images as Planes with Closest interpolation for 2.5D scenes.
  pitfalls:
    - "Older forks state different licences (GPL 3.0 and CC-BY-SA 3.0 only); use the upstream credits for the copy you used."
  example_asset:
    id: lpc-hero
    title: LPC hero sprite sheet
    creator: Liberated Pixel Cup contributors (see credits)
    source_url: https://github.com/LiberatedPixelCup/Universal-LPC-Spritesheet-Character-Generator
    licence: "CC-BY-SA-4.0 / GPL-3.0 (per exported credits)"
    licence_url: https://github.com/LiberatedPixelCup/Universal-LPC-Spritesheet-Character-Generator
    attribution: "Sprites contributed as part of the Liberated Pixel Cup project from OpenGameArt.org; authors listed in CREDITS-lpc.txt"
    attribution_required: true
    redistribution: allowed-with-licence
    format: png
    intended_use: [top-down narrator character]
    fetch: {method: manual-page, status: to-fetch}
    import_hints: {godot: {importer: texture, preset: pixel-art-2d}}

- id: makehuman_characters
  name: MakeHuman characters (CC0 exports)
  description: >-
    Use when a realistic or semi-realistic human base mesh is needed. MakeHuman's code is AGPL but its
    bundled assets and exports from official builds (1.2.0+) are CC0; third-party community assets keep
    their own licences. Covers export settings, Blender and Godot import, and licence evidence.
  summary: Generate CC0 human base meshes with MakeHuman, track any third-party clothes/hair licences, and import into Blender and Godot 4.
  tags: [makehuman, characters, cc0, humans, blender]
  homepage: https://static.makehumancommunity.org/about/license.html
  licence_summary: "MakeHuman source is AGPL; the bundled assets (base mesh, targets, textures, clothes, poses, expressions) are CC0, and since 1.2.0 exports from official, unmodified builds are CC0. Third-party assets keep their own licences."
  licences:
    - {id: CC0-1.0, url: "https://static.makehumancommunity.org/about/license.html", applies_to: "bundled assets and exports"}
    - {id: AGPL-3.0, url: "https://github.com/makehumancommunity/makehuman/blob/master/LICENSE.md", applies_to: "MakeHuman code"}
  attribution: {required: optional, credit_template: "Character base mesh made with MakeHuman (CC0)"}
  redistribution: allowed
  commercial_use: allowed
  ai_training: unspecified
  automated_download: unspecified
  formats: [fbx, obj, dae, mhx2]
  search:
    - {label: "Licence", url: "https://static.makehumancommunity.org/about/license.html"}
    - {label: "Asset packs", url: "https://static.makehumancommunity.org/assets/assetpacks.html"}
    - {label: "FAQ: are MakeHuman files free?", url: "https://static.makehumancommunity.org/makehuman/faq/are_makehuman_files_free.html"}
  cautions:
    - "Community clothes/hair packs can be CC-BY; record each one."
    - "Exports made with versions before 1.2.0 were under AGPL terms."
  search_howto: |
    Use an official 1.2.x build, apply only bundled or CC0 assets, export FBX or Collada with a game-ready skeleton,
    and keep a note of every third-party asset in the manifest.
  godot: |
    - Import the FBX; map the skeleton with BoneMap + SkeletonProfileHumanoid to reuse humanoid animations.
  blender: |
    - `bpy.ops.import_scene.fbx(filepath=...)`; apply scale and rotation before rigging tweaks.
  pitfalls:
    - "Photoreal humans in faceless videos can read as real people; avoid implying they are real individuals."
  example_asset:
    id: makehuman-narrator
    title: Narrator base mesh
    creator: Made with MakeHuman
    source_url: https://static.makehumancommunity.org/about/license.html
    licence: CC0-1.0
    licence_url: https://static.makehumancommunity.org/about/license.html
    attribution: "Character made with MakeHuman (CC0)"
    attribution_required: false
    redistribution: allowed
    format: fbx
    intended_use: [3D narrator stand-in]
    fetch: {method: manual-page, status: manual}

- id: mocap_dataset_licences
  name: Motion-capture datasets and their licences (CC0 alternatives first)
  description: >-
    Use before pulling motion capture into a short or a game. Many free mocap sets are research or
    non-commercial (Bandai Namco: CC BY-NC; a CMU FBX conversion: CC BY-NC), Mixamo forbids
    redistribution, and Quaternius offers CC0 humanoid clips. Explains choosing and recording them.
  summary: "Choose motion data whose licence fits the use: CC0 Quaternius clips first, research mocap only for non-commercial work."
  tags: [mocap, bvh, animation, non-commercial, licensing]
  homepage: https://github.com/BandaiNamcoResearchInc/Bandai-Namco-Research-Motiondataset
  licence_summary: "Bandai Namco Research Motion Dataset: CC BY-NC 4.0 per its README (press reports say BY-NC-ND). The 4TU FBX conversion of CMU mocap is labelled CC BY-NC 4.0. Quaternius Universal Animation Library is CC0."
  licences:
    - {id: CC-BY-NC-4.0, url: "https://github.com/BandaiNamcoResearchInc/Bandai-Namco-Research-Motiondataset", applies_to: "Bandai Namco BVH datasets"}
    - {id: CC-BY-NC-4.0, url: "https://data.4tu.nl/datasets/0448aab2-3332-449f-a8e2-d208cb58c7df", applies_to: "4TU FBX conversion of CMU mocap"}
    - {id: CC0-1.0, url: "https://quaternius.com/packs/universalanimationlibrary.html", applies_to: "Quaternius Universal Animation Library"}
  attribution: {required: per-asset, credit_template: "Motion data: {dataset} ({licence})"}
  redistribution: per-asset
  commercial_use: per-asset
  ai_training: per-asset
  automated_download: allowed
  formats: [bvh, fbx, glb]
  search:
    - {label: "Bandai Namco motion dataset", url: "https://github.com/BandaiNamcoResearchInc/Bandai-Namco-Research-Motiondataset"}
    - {label: "CMU mocap FBX conversion (4TU)", url: "https://data.4tu.nl/datasets/0448aab2-3332-449f-a8e2-d208cb58c7df"}
    - {label: "Quaternius Universal Animation Library (CC0)", url: "https://quaternius.com/packs/universalanimationlibrary.html"}
  cautions:
    - "Non-commercial datasets cannot appear in monetised shorts."
    - "Read each dataset's LICENSE file; converters can add their own terms."
  search_howto: |
    Decide the use first (monetised video, open-source game, research). For monetised or redistributed work use CC0
    clips; record research datasets with commercial_use non-commercial-only so the licence checker blocks misuse.
  godot: |
    - Import BVH via Blender (Godot does not import BVH directly), export GLB, then retarget with SkeletonProfileHumanoid.
  blender: |
    - File > Import > Motion Capture (.bvh); retarget onto your rig, then export GLB.
  pitfalls:
    - "A non-commercial clip baked into a commercial video is still a licence breach."
  example_asset:
    id: bandai-dataset-1
    title: Bandai Namco Research Motion Dataset 1
    creator: Bandai Namco Research Inc.
    source_url: https://github.com/BandaiNamcoResearchInc/Bandai-Namco-Research-Motiondataset
    licence: CC-BY-NC-4.0
    licence_url: https://github.com/BandaiNamcoResearchInc/Bandai-Namco-Research-Motiondataset
    attribution: "Motion: Bandai Namco Research Motion Dataset (CC BY-NC 4.0)"
    attribution_required: true
    redistribution: allowed-with-licence
    commercial_use: non-commercial-only
    format: bvh
    intended_use: [non-commercial motion study]
    fetch: {method: git, status: to-fetch}

- id: game_icons_net
  name: game-icons.net SVG icons (CC BY 3.0)
  description: >-
    Use when a thumbnail, caption, 'this vs that' board or game UI needs crisp single-colour SVG icons.
    game-icons.net icons are CC BY 3.0 per author; this skill gives the exact credit line, scripted
    download from GitHub, recolouring, and Godot/Blender import.
  summary: Fetch game-icons.net SVGs from GitHub, recolour them, and credit each icon's author under CC BY 3.0.
  tags: [icons, svg, cc-by, game-icons, thumbnails]
  homepage: https://game-icons.net/about.html
  licence_summary: "Icons are provided under Creative Commons BY 3.0; credit the original author, e.g. 'Icons made by {author}. Available on https://game-icons.net'."
  licences:
    - {id: CC-BY-3.0, url: "https://game-icons.net/about.html", applies_to: "all icons"}
  attribution: {required: required, credit_template: "Icons made by {author}. Available on https://game-icons.net (CC BY 3.0)"}
  redistribution: allowed-with-licence
  commercial_use: allowed
  ai_training: unspecified
  automated_download: allowed
  formats: [svg, png]
  search:
    - {label: "About and licence", url: "https://game-icons.net/about.html"}
    - {label: "Source SVGs by author", url: "https://github.com/game-icons/icons"}
    - {label: "Iconify browser for the set", url: "https://icon-sets.iconify.design/game-icons/"}
  cautions:
    - "Credit per author (the GitHub folder name), not just the site."
    - "CC BY 3.0 forbids adding DRM that restricts the licence; fine for videos, check for locked platforms."
  search_howto: |
    Search on Iconify or the site, note the author, then download `https://raw.githubusercontent.com/game-icons/icons/master/<author>/<icon>.svg`
    with the `media_pack_fetcher` module. Recolour by editing the SVG fill; keep the credit line.
  godot: |
    - SVGs import as textures (rasterised at import; set svg/scale for crisp large icons) with the `ui-lossless` preset.
  blender: |
    - File > Import > Scalable Vector Graphics, or render the PNG and use Images as Planes.
  pitfalls:
    - "A 'free icons' compilation that re-hosts game-icons without credit does not remove your duty to credit."
  example_asset:
    id: crossed-swords
    title: Crossed swords icon
    creator: Lorc
    source_url: https://game-icons.net/about.html
    download_url: https://raw.githubusercontent.com/game-icons/icons/master/lorc/crossed-swords.svg
    licence: CC-BY-3.0
    licence_url: https://creativecommons.org/licenses/by/3.0/deed.en
    attribution: "Icon by Lorc. Available on https://game-icons.net (CC BY 3.0)"
    attribution_required: true
    redistribution: allowed-with-licence
    format: svg
    file_name: crossed-swords.svg
    intended_use: [versus divider icon]
    fetch: {method: direct, status: to-fetch}
    import_hints: {godot: {importer: texture, preset: ui-lossless}, video: {role: icon}}

- id: open_icon_sets_for_ui
  name: Open UI icon sets (Lucide, Tabler, Phosphor, Material Symbols, Font Awesome Free)
  description: >-
    Use when captions, lower thirds, explainer diagrams or Godot UI need clean interface icons. Lucide
    (ISC), Tabler (MIT), Phosphor (MIT) and Material Symbols (Apache-2.0) need no on-screen credit;
    Font Awesome Free icons are CC BY 4.0. Covers choosing a set, fetching SVGs and keeping notices.
  summary: Pick an open UI icon set by licence, fetch SVGs, and keep the right notices (none on screen for ISC/MIT/Apache, credit for Font Awesome).
  tags: [icons, svg, ui, mit, isc, apache]
  homepage: https://github.com/iconify/icon-sets
  licence_summary: "Lucide ISC; Tabler Icons MIT; Phosphor MIT; Material Symbols/Icons Apache-2.0 (attribution appreciated, not required); Font Awesome Free icons CC BY 4.0, fonts OFL 1.1, code MIT. Iconify lists each set's licence."
  licences:
    - {id: ISC, url: "https://github.com/lucide-icons/lucide", applies_to: "Lucide"}
    - {id: MIT, url: "https://github.com/tabler/tabler-icons", applies_to: "Tabler Icons"}
    - {id: MIT, url: "https://github.com/phosphor-icons/core", applies_to: "Phosphor"}
    - {id: Apache-2.0, url: "https://github.com/google/material-design-icons", applies_to: "Material Symbols and Icons"}
    - {id: CC-BY-4.0, url: "https://fontawesome.com/license/free", applies_to: "Font Awesome Free icons"}
  attribution: {required: per-asset, credit_template: "Icons: {set} ({licence})"}
  redistribution: allowed-with-licence
  commercial_use: allowed
  ai_training: unspecified
  automated_download: allowed
  formats: [svg, png, woff2]
  search:
    - {label: "Iconify icon sets and licences", url: "https://github.com/iconify/icon-sets"}
    - {label: "Lucide", url: "https://github.com/lucide-icons/lucide"}
    - {label: "Tabler Icons", url: "https://github.com/tabler/tabler-icons"}
    - {label: "Font Awesome Free licence", url: "https://fontawesome.com/license/free"}
  cautions:
    - "Keep the licence notice file when you redistribute icon files (MIT/ISC/Apache)."
    - "Font Awesome Pro icons are not free; an SVG copied from the website may carry a Pro header."
  search_howto: |
    Choose one set per video for a consistent stroke width. Fetch SVGs from the set's GitHub repository (raw URLs) and
    record the set and licence in the manifest; no on-screen credit is needed for ISC/MIT/Apache sets.
  godot: |
    - Import SVG with `ui-lossless` and a higher svg/scale for 4K-safe icons, or use Material Symbols as a font.
  blender: |
    - Import SVG as curves for extruded 3D icons (File > Import > Scalable Vector Graphics).
  pitfalls:
    - "Mixing outline and filled sets in one frame looks noisy; stay in one family."
  example_asset:
    id: tabler-check
    title: Tabler check icon
    creator: Tabler Icons
    source_url: https://github.com/tabler/tabler-icons
    licence: MIT
    licence_url: https://github.com/tabler/tabler-icons
    attribution: "Icons: Tabler Icons (MIT)"
    attribution_required: false
    redistribution: allowed-with-licence
    format: svg
    intended_use: [winner tick on a comparison board]
    fetch: {method: manual-page, status: to-fetch}

- id: open_emoji_sets
  name: Open emoji artwork (Twemoji, Noto, OpenMoji, Fluent)
  description: >-
    Use when a caption or reaction overlay needs emoji drawn consistently on every platform. Twemoji
    graphics are CC-BY 4.0, Noto Emoji images Apache-2.0 (fonts OFL), OpenMoji CC BY-SA 4.0 and
    Microsoft Fluent Emoji MIT. Explains credits, share-alike and trademark limits.
  summary: Choose an emoji artwork set by licence (Twemoji CC-BY, Noto Apache/OFL, OpenMoji BY-SA, Fluent MIT) and credit it correctly.
  tags: [emoji, captions, cc-by, apache, overlays]
  homepage: https://github.com/jdecked/twemoji
  licence_summary: "Twemoji (jdecked fork): graphics CC-BY 4.0, code MIT. Noto Emoji: fonts OFL 1.1, images and tools Apache 2.0, flags public domain. OpenMoji: graphics CC BY-SA 4.0. Fluent UI Emoji: repository MIT."
  licences:
    - {id: CC-BY-4.0, url: "https://github.com/jdecked/twemoji", applies_to: "Twemoji graphics"}
    - {id: Apache-2.0, url: "https://github.com/googlefonts/noto-emoji", applies_to: "Noto Emoji images"}
    - {id: CC-BY-SA-4.0, url: "https://github.com/hfg-gmuend/openmoji", applies_to: "OpenMoji graphics"}
    - {id: MIT, url: "https://github.com/microsoft/fluentui-emoji", applies_to: "Fluent UI Emoji"}
  attribution: {required: per-asset, credit_template: "Emoji: {set} ({licence})"}
  redistribution: allowed-with-licence
  commercial_use: allowed
  ai_training: unspecified
  automated_download: allowed
  formats: [svg, png]
  search:
    - {label: "Twemoji", url: "https://github.com/jdecked/twemoji"}
    - {label: "Noto Emoji", url: "https://github.com/googlefonts/noto-emoji"}
    - {label: "OpenMoji", url: "https://github.com/hfg-gmuend/openmoji"}
    - {label: "Fluent UI Emoji", url: "https://github.com/microsoft/fluentui-emoji"}
  cautions:
    - "Emoji depicting brands or flags carry trademark/flag-use limits beyond the artwork licence."
    - "OpenMoji is share-alike: modified emoji must stay CC BY-SA 4.0."
  search_howto: |
    Pick one set per channel for a consistent look; Twemoji credit can go in the description; Noto images need only the
    Apache notice if you redistribute files.
  godot: |
    - Import SVG/PNG with `ui-lossless`; for text with emoji, use a colour emoji font as a fallback in the Theme.
  blender: |
    - Use PNG renders as Images as Planes for floating reaction stickers.
  pitfalls:
    - "Platform emoji (Apple, Samsung) are not openly licensed; never screenshot them for overlays."
