  licence_summary: "Each asset declares its own licence (MIT is common). The Asset Store is the successor to the Asset Library; assets were not migrated automatically."
  licences:
    - {id: per-asset, url: "https://docs.godotengine.org/en/stable/community/asset_store/what_is_asset_store.html", applies_to: "each listing"}
  attribution: {required: per-asset, credit_template: "{addon} by {author} ({licence})"}
  redistribution: per-asset
  commercial_use: per-asset
  ai_training: per-asset
  automated_download: allowed
  formats: [zip]
  search:
    - {label: "Godot Asset Store", url: "https://store.godotengine.org/"}
    - {label: "About the Asset Store (docs)", url: "https://docs.godotengine.org/en/stable/community/asset_store/what_is_asset_store.html"}
    - {label: "Legacy Asset Library", url: "https://godotengine.org/asset-library/asset"}
