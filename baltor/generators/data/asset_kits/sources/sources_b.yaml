  description: >-
    Use when a Godot 4 project needs an addon or a template project. The Asset Store (store.godotengine.org)
    replaces the legacy Asset Library, which is being deprecated; each listing carries its own licence.
    Covers searching, licence checks, the legacy REST API and installing safely.
