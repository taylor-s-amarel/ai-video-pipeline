    attribution: "Emoji graphics: Twemoji, CC-BY 4.0"
    attribution_required: true
    redistribution: allowed-with-licence
    format: svg
    intended_use: [reaction sticker overlay]
    fetch: {method: manual-page, status: to-fetch}

- id: google_fonts_for_video
  name: Google Fonts and Kenney fonts for captions and titles (OFL, Apache, CC0)
  description: >-
    Use when picking caption, hook-title or pixel fonts for shorts and Godot UI. Most Google Fonts are
    SIL OFL 1.1 (a few Apache-2.0), Kenney Fonts are CC0. Covers verifying a family's licence in the
    google/fonts repo, what OFL allows in videos, and Godot/Blender font import.
  summary: Choose OFL/Apache/CC0 caption and title fonts, verify each family's licence folder, and load them in Godot 4, Blender and FFmpeg.
  tags: [fonts, ofl, captions, titles, pixel-fonts]
  homepage: https://github.com/google/fonts
  licence_summary: "google/fonts groups files by licence folder (ofl/, apache/, ufl/); most families are SIL OFL 1.1. OFL fonts may be embedded and redistributed with software but not sold alone; documents (and renders) made with them are not bound by the licence. Kenney Fonts are CC0."
  licences:
    - {id: OFL-1.1, url: "https://openfontlicense.org/open-font-license-official-text/", applies_to: "families in ofl/"}
    - {id: Apache-2.0, url: "https://github.com/google/fonts/tree/main/apache", applies_to: "families in apache/ (e.g. Luckiest Guy)"}
    - {id: CC0-1.0, url: "https://kenney.nl/assets/kenney-fonts", applies_to: "Kenney Fonts"}
  attribution: {required: never, credit_template: "Font: {family} ({licence})"}
  redistribution: allowed-with-licence
  commercial_use: allowed
  ai_training: unspecified
  automated_download: allowed
  formats: [ttf, otf, woff2]
  search:
    - {label: "google/fonts repository", url: "https://github.com/google/fonts"}
    - {label: "Google Fonts FAQ", url: "https://developers.google.com/fonts/faq?tid=311165647"}
    - {label: "Bebas Neue", url: "https://fonts.google.com/specimen/Bebas%2BNeue"}
    - {label: "Montserrat licence tab", url: "https://fonts.google.com/specimen/Montserrat/license"}
    - {label: "Press Start 2P", url: "https://fonts.google.com/specimen/Press+Start+2P"}
    - {label: "Kenney Fonts", url: "https://kenney.nl/assets/kenney-fonts"}
  cautions:
    - "Never sell or bundle a font file alone; keep OFL.txt next to any redistributed font."
    - "Check the folder: a family under apache/ is Apache-2.0, not OFL."
  search_howto: |
    Pick on fonts.google.com, then confirm the licence by finding the family folder in google/fonts (ofl/<family> with
    OFL.txt, or apache/<family>). Bold condensed faces (Bebas Neue, Anton) suit hook titles; Montserrat, Poppins and
    Inter suit one-line captions; Press Start 2P, Pixelify Sans, Silkscreen and VT323 suit pixel scenes.
  godot: |
    - Drop the TTF/OTF into the project; it imports as FontFile. For pixel fonts disable antialiasing and use
      integer sizes (Press Start 2P works best at multiples of 8 px).
  blender: |
    - `bpy.data.fonts.load("/path/BebasNeue-Regular.ttf")`, then assign to a text object's data.font.
  pitfalls:
    - "Video tools that burn subtitles need the font installed or passed explicitly (FFmpeg subtitles filter fontsdir)."
  example_asset:
    id: bebas-neue
    title: Bebas Neue Regular
    creator: Ryoichi Tsunekawa
    source_url: https://fonts.google.com/specimen/Bebas%2BNeue
    licence: OFL-1.1
    licence_url: https://github.com/google/fonts/tree/main/ofl/bebasneue
    attribution: "Font: Bebas Neue by Ryoichi Tsunekawa (SIL OFL 1.1)"
    attribution_required: false
    redistribution: allowed-with-licence
    format: ttf
    intended_use: [bold hook title]
    fetch: {method: manual-page, status: to-fetch}
    import_hints: {godot: {importer: font}, video: {role: font}}

- id: lospec_palettes
  name: Lospec pixel-art palettes
  description: >-
    Use when a pixel-art scene, thumbnail or mixed asset kit needs one coherent palette. Lospec hosts
    2,500+ palettes downloadable as HEX, GPL, PAL, ASE, TXT and PNG; pages credit an author but state no
    licence. Covers choosing a palette, crediting its author and enforcing it with the quantiser module.
  summary: Pick a Lospec palette, credit its author, and enforce it on mixed packs with the palette quantiser module.
  tags: [palettes, pixel-art, lospec, style]
  homepage: https://lospec.com/palette-list
  licence_summary: "Palette pages name an author and offer downloads but state no licence. Credit the palette author by convention; the palette is a list of colours, the artwork you make with it is yours."
  licences:
    - {id: "No licence stated", url: "https://lospec.com/palette-list", applies_to: "palette pages"}
  attribution: {required: optional, credit_template: "Palette: {palette} by {author} (lospec.com)"}
  redistribution: per-asset
  commercial_use: allowed
  ai_training: unspecified
  automated_download: unspecified
  formats: [hex, gpl, pal, png, txt]
  search:
    - {label: "Palette list", url: "https://lospec.com/palette-list"}
    - {label: "Endesga 32", url: "https://lospec.com/palette-list/endesga-32"}
    - {label: "Resurrect 64", url: "https://lospec.com/palette-list/resurrect-64"}
    - {label: "Sweetie 16", url: "https://lospec.com/palette-list/sweetie-16"}
    - {label: "Lospec GB (4 colours)", url: "https://lospec.com/palette-list/lospec-gb"}
  cautions:
    - "No licence is stated: do not redistribute palette files as your own product; credit the author."
  search_howto: |
    Filter by colour count (4 for a handheld look, 16 or 32 for most kits). Download the .hex file and run
    `lospec_palette_quantiser quantise art.png --palette endesga-32.hex --out art_e32.png`, then `check` every
    exported frame so off-palette pixels from mixed packs are caught.
  godot: |
    - Keep palette-quantised textures lossless (`pixel-art-2d`); VRAM compression shifts colours off-palette.
  blender: |
    - Use the palette PNG as a 1-pixel-high gradient texture for flat-shaded low-poly materials.
  pitfalls:
    - "Dithering looks noisy when scaled for video; prefer no dither or Bayer 4x4 at low strength."
  example_asset:
    id: endesga-32
    title: Endesga 32 palette
    creator: ENDESGA
    source_url: https://lospec.com/palette-list/endesga-32
    licence: "No licence stated (credit author)"
    licence_url: https://lospec.com/palette-list/endesga-32
    attribution: "Palette: Endesga 32 by ENDESGA (lospec.com)"
    attribution_required: false
    redistribution: project-only
    format: hex
    intended_use: [palette for the whole pixel kit]
    fetch: {method: manual-page, status: to-fetch}

- id: lottiefiles_animations
  name: LottieFiles free animations (Lottie Simple License)
  description: >-
    Use when a short needs vector motion overlays (confetti, arrows, icons, loaders) from LottieFiles.
    Free animations use the Lottie Simple License: commercial use allowed, modifications stay under the
    same licence, no compiling a competing library. Covers checks with the Lottie inspector and rendering.
  summary: Use LottieFiles free animations under the Lottie Simple License, inspect them, and render them as video overlays.
  tags: [lottie, motion, overlays, licensing]
  homepage: https://lottiefiles.com/page/license
  licence_summary: "Lottie Simple License: download, modify, publish and distribute public files including commercially; derivatives stay under the same licence; no collecting files to build a similar or competing service; attribution encouraged, not required. The help centre adds: do not resell or redistribute originals as standalone files."
  licences:
    - {id: Lottie-Simple-License, url: "https://lottiefiles.com/page/license", applies_to: "free public animations"}
  attribution: {required: optional, credit_template: "Animation: \"{title}\" by {creator} on LottieFiles (Lottie Simple License)"}
  redistribution: project-only
  commercial_use: allowed
  ai_training: unspecified
  automated_download: forbidden
  formats: [json-lottie, dotlottie]
  search:
    - {label: "Lottie Simple License", url: "https://lottiefiles.com/page/license"}
    - {label: "Commercial use (help)", url: "https://help.lottiefiles.com/hc/en-us/articles/900002438343-Can-I-use-a-free-animation-on-Lottiefiles-for-commercial-business-use"}
    - {label: "lottie-web player", url: "https://github.com/airbnb/lottie-web"}
    - {label: "dotlottie-web player", url: "https://github.com/LottieFiles/dotlottie-web"}
  cautions:
    - "Do not bulk-collect LottieFiles animations into a library, package or service."
    - "Creators can add restrictions on individual animations; read each page."
  search_howto: |
    Download the Lottie JSON or .lottie by hand, run `lottie_json_inspector anim.json --target 1080x1920`, and fix
    anything it flags (external images, fonts, expressions) before rendering.
  godot: |
    - Godot's built-in vector support uses ThorVG for SVG; for Lottie, render frames to PNG (lottie-web in a headless
      browser) and play them as a SpriteFrames animation, or use a maintained addon after checking its licence.
  blender: |
    - Render the Lottie to a PNG sequence and load it as an image sequence on a plane.
  pitfalls:
    - "Expressions and text layers often render differently across players; prefer shape-only animations."
  example_asset:
