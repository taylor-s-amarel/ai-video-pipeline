  summary: Media pack manifest for silly animal-crowd stories - CC0 animated animal packs, small characters, nature kit, a sunny HDRI and generated or CC0 sound effects.
  description: >-
    Use when a ridiculous story needs many animals on screen (a crowd of pets, a farm stampede). Lists CC0
    Quaternius animated animal packs, Kenney mini and blocky characters, nature props, a CC0 sunny HDRI, ZzFX
    for generated sounds and Kenney Interface Sounds.
  tags: [animals, crowd, story, 3d, shorts]
