- id: space_nasa_kit
  title: Space and NASA kit (real spacecraft + stylised extras)
  summary: Media pack manifest for space shorts - NASA 3D Resources GLBs with recorded SHA-256 (Apollo LM, astronaut, Hubble), Gateway and Curiosity, plus CC0 stylised space kits.
  description: >-
    Use when a space or Moon-landing short needs real spacecraft models plus stylised filler. Three NASA GLBs
    were downloaded and hashed on 2026-10-10 (all need Draco decoding); others are listed to fetch. Includes NASA
    usage rules (no insignia, no implied endorsement) and CC0 Kenney/Quaternius space kits.
  tags: [space, nasa, 3d, history, science]
  targets: [blender-4, godot-4, ffmpeg-video]
  style: |
    - Black space background with a slow-moving starfield layer; hero model lit by one hard key light.
    - Scale models before animation: the Astronaut GLB is about 74 units tall and Hubble (A) about 525 units.
  assemble: |
    1. `python media_pack_fetcher.py pack.json --out assets/space` fetches the NASA GLBs and verifies their hashes.
    2. Import in Blender (Draco and WebP supported), normalise scale, and re-export decoded GLBs for Godot if needed.
    3. Use Kenney/Quaternius space kits for stylised cutaways and diagrams.
  excluded:
    - "NASA logos/insignia and anything implying NASA endorsement."
  assets:
    nasa-apollo-lm: [Moon landing hero model]
    nasa-astronaut: [astronaut figure]
    nasa-hubble-a: [telescope explainer]
    nasa-gateway-core: [Artemis-era station]
    nasa-curiosity-rover: [Mars rover beat]
    kenney-space-kit: [stylised base and rockets]
    quaternius-ultimate-space-kit: [stylised astronauts, planets and enemies]
    font-inter: [clean data captions]

- id: nature_backgrounds_kit
  title: Nature backgrounds kit (moving HDRI skies and foliage)
  summary: Media pack manifest for moving nature backgrounds behind facts - five CC0 sunset/sky HDRIs, CC0 foliage packs, PBR ground materials and particle overlays.
  description: >-
    Use when a short needs calm, moving nature backgrounds (panning skies, swaying foliage, drifting particles)
    behind photos and captions. Lists CC0 Poly Haven HDRIs, Quaternius and Kenney nature models, ambientCG and
    cgbookcase materials, and Kenney particles.
  tags: [nature, backgrounds, hdri, foliage, shorts]
  targets: [blender-4, godot-4, ffmpeg-video]
  style: |
    - Rotate the HDRI slowly (one degree per second reads as motion without distraction); keep 5+ layers moving.
    - Blur the background plate slightly so the main photo and captions stay sharp.
  assemble: |
    1. Blender: World > Environment Texture with a Mapping node keyframed on Z rotation; render 1080x1920.
    2. Godot: PanoramaSkyMaterial on a WorldEnvironment; rotate the sky via Environment.sky_rotation.
  excluded: []
  assets:
    polyhaven-belfast-sunset-puresky: [sunset over water]
    polyhaven-grasslands-sunset: [golden field]
    polyhaven-rosendal-park-sunset-puresky: [clear warm sky]
    polyhaven-evening-road-01-puresky: [evening sky]
    polyhaven-industrial-sunset-puresky: [sky-only gradient]
    quaternius-ultimate-nature: [foreground foliage]
    kenney-nature-kit: [stylised foliage]
    ambientcg-materials: [ground and rock materials]
    cgbookcase-textures: [extra ground textures]
    kenney-particle-pack: [drifting particles layer]

- id: ui_caption_kit
  title: UI and caption kit (fonts, panels, icons, pops)
  summary: Media pack manifest for caption and title styling - OFL title/caption fonts, CC0 UI panels and particles, MIT/ISC icons, CC-BY emoji and CC0 pop sounds.
  description: >-
    Use when styling hook titles, one-line captions, FACT labels, lower thirds and reaction stickers for
    1080x1920 shorts or Godot UI. Lists OFL fonts (Bebas Neue, Anton, Montserrat, Inter), Kenney UI Pack,
    Lucide/Tabler icons, Twemoji (credit) and Kenney Interface Sounds.
  tags: [captions, ui, fonts, icons, shorts]
  targets: [ffmpeg-video, godot-4, web]
  style: |
    - Title: Bebas Neue or Anton, bold yellow #FFD21F, upper third over the photo, frosted backing.
    - Captions: Montserrat Bold, max 7 words, one line, keyword pop 1.0 -> 1.12 -> 1.0 over 180 ms with a click.
  assemble: |
    1. Install fonts locally (keep OFL.txt); point the subtitle renderer at the font directory.
    2. Use Kenney UI Pack shapes as frosted panel masks; never a hard rectangular cutout.
  excluded:
    - "Font Awesome Pro icons; platform emoji screenshots."
  assets:
    font-bebas-neue: [hook titles]
    font-anton: [alternative heavy title]
    font-montserrat: [captions]
    font-inter: [small labels and sources line]
    kenney-ui-pack: [panels and arrows]
    lucide-icons: [inline caption icons]
    tabler-icons: [check and cross marks]
    twemoji: [reaction stickers]
    kenney-particle-pack: [keyword sparkle]
    kenney-interface-sounds: [pop and click]

- id: pa_farm_diorama_kit
  title: Pennsylvania farm diorama kit (Godot 3D showcase)
  summary: Media pack manifest for a low-poly farm diorama in Godot 4 - CC0 farm buildings, animated animals, crops, vehicles, terrain addon, city-builder template and a golden-field HDRI.
  description: >-
    Use when building a farm or rural-business 3D visualisation in Godot 4 (for example a contest showcase of
    a small farm's product or service). Lists CC0 Quaternius farm buildings, animals and crops, Kenney nature
    and car kits, Kenney's MIT/CC0 city-builder template for placement, the MIT Terrain3D addon and a CC0 HDRI.
  tags: [farm, diorama, godot, 3d, showcase]
  targets: [godot-4, ffmpeg-video]
  style: |
    - Late-afternoon light (Grasslands Sunset HDRI), low-poly fields in rows, animated animals idling.
    - Label each building with the product or service it represents; keep labels in Inter, max 3 words.
  assemble: |
    1. Start from Kenney's Starter Kit City Builder (build/remove, MeshLibrary, save/load) and swap the
       MeshLibrary for farm buildings and crop tiles.
    2. Sculpt gentle terrain with Terrain3D or use flat tiles for a board-game look.
    3. Record a 60-90 s fly-through; check every model with `gltf_glb_inspector` before import.
  excluded:
    - "GDQuest characters (non-commercial) and Mixamo raw files in the shared project."
  assets:
    quaternius-farm-buildings: [barn, silo and fences]
    quaternius-farm-animals: [animated cows, pigs and chickens]
    quaternius-ultimate-crops: [crop rows]
    kenney-nature-kit: [trees and rocks]
    kenney-car-kit: [delivery vehicles]
    kenney-starter-kit-city-builder: [placement and save/load template]
    terrain3d: [editable terrain]
    polyhaven-grasslands-sunset: [golden-hour lighting]
    font-inter: [building labels]
    kenney-interface-sounds: [UI sounds]

- id: this_vs_that_comparison_kit
  title: This-vs-that comparison kit
  summary: Media pack manifest for 'this vs that' comparison shorts - CC0 food/props, versus icon (CC BY), tick/cross icons, heavy title fonts, reveal sounds and UI panels.
  description: >-
    Use when making split-screen 'this vs that' or ranking shorts. Lists CC0 Kenney props, a game-icons versus
    icon (CC BY 3.0 credit), MIT check/cross icons, OFL heavy title fonts, Kenney Casino Audio for reveals,
    Kenney UI panels and Twemoji reaction stickers (CC-BY credit).
  tags: [comparison, versus, split-screen, shorts, ranking]
  targets: [ffmpeg-video, godot-4]
  style: |
    - Vertical split (top vs bottom) for 9:16; each side has one hero object, one number and one icon.
    - Reveal winner with a scale pop and a casino chip sound; never more than two lines of text on screen.
  assemble: |
    1. Render props (Kenney Food Kit or any CC0 kit) on turntables; place them in the two halves.
    2. Put the crossed-swords icon on the divider; credit 'Icon by Lorc, game-icons.net, CC BY 3.0'.
  excluded:
    - "Brand logos and product photos you do not have rights to."
  assets:
    kenney-food-kit: [comparison props]
    game-icons-crossed-swords: [versus divider]
    tabler-icons: [tick and cross]
    font-anton: [side labels]
    font-bebas-neue: [hook title]
    kenney-casino-audio: [reveal sounds]
    kenney-ui-pack: [score panels]
    twemoji: [reaction stickers]

