# Starter-pack manifests. Each becomes a skill with SKILL.md and pack.json (agent_media_pack_manifest).
# 'assets' maps catalogue keys to their intended use in this pack. Packs never contain media files.
- id: stick_figure_explainer_kit
  title: Stick-figure explainer kit (faceless 2D)
  summary: Media pack manifest for faceless stick-figure explainer shorts - CC0 flat characters, narrator avatar, icons, caption fonts, UI panels and pop sounds.
  description: >-
    Use when building a faceless stick-figure or flat-character explainer short (1080x1920). Lists CC0/OFL/MIT
    sources for characters, a narrator avatar, concept icons, caption and title fonts, UI panels, particles and
    pop sounds, with licences and credit lines, as a manifest to fetch (no files included).
  tags: [stick-figure, explainer, faceless, 2d, shorts]
  targets: [ffmpeg-video, godot-4]
  style: |
    - Thick-outline flat characters on a moving gradient or patterned background (never a static slide).
    - One concept icon per beat, popping in with the caption keyword; keep icons from one family.
    - Title in Bebas Neue (bold yellow #FFD21F per house style), captions in Montserrat Bold, one line at a time.
  assemble: |
    1. Build characters from Kenney Modular Characters parts (or draw stick figures as Line2D in Godot so they are original).
    2. Narrator portrait: Notion Avatar (CC0 assets) in a corner card.
    3. Icons: Tabler/Lucide for UI concepts, game-icons for action concepts (credit the author).
    4. Pops: Kenney Interface Sounds under each keyword pop.
  excluded:
    - "xkcd font (ipython/xkcd-font): CC BY-NC 3.0, not for monetised videos."
    - "Platform emoji screenshots (Apple, Samsung): not openly licensed."
  assets:
    kenney-modular-characters: [flat explainer characters]
    notion-avatar: [narrator portrait card]
    tabler-icons: [concept icons for steps and facts]
    lucide-icons: [UI-style icons for apps and devices]
    game-icons-crossed-swords: [conflict or versus beat icon]
    font-bebas-neue: [hook title on the first frame]
    font-montserrat: [one-line synced captions]
    kenney-ui-pack: [frosted caption panel shapes and arrows]
    kenney-particle-pack: [sparkles behind keyword pops]
    kenney-interface-sounds: [caption pop and click sounds]

- id: low_poly_diorama_kit
  title: Low-poly diorama kit (3D, Godot/Blender)
  summary: Media pack manifest for a low-poly island or village diorama - CC0 nature, town and hex tiles, mini characters, sunset HDRI and particles for slow orbit shots.
  description: >-
    Use when a short needs a cute low-poly diorama (island, village, hex board) rendered in Godot 4 or Blender
    with a slow camera orbit. Lists CC0 kits from Kenney, Quaternius and KayKit plus a Poly Haven sunset HDRI,
    with licences and import hints, as a manifest to fetch.
  tags: [low-poly, diorama, 3d, godot, blender]
  targets: [godot-4, blender-4, ffmpeg-video]
  style: |
    - Small square or hex base, soft sunset HDRI lighting, slight tilt-shift depth of field, 8-12 s orbit per beat.
    - Keep one kit family per frame (Kenney with Kenney, KayKit with KayKit) so shading matches.
  assemble: |
    1. Lay the hex or square base with KayKit Medieval Hexagon tiles (GridMap in Godot).
    2. Dress with Kenney Nature Kit and Quaternius Stylized Nature; add Fantasy Town buildings.
    3. Light with the Rosendal Park sunset HDRI; add Kenney particle sprites as drifting dust.
    4. Run `gltf_glb_inspector` on each model to normalise scale before placing.
  excluded:
    - "Synty and other paid packs that appear in Poly Pizza search results."
  assets:
    kaykit-medieval-hexagon: [hex tile base and buildings]
    kenney-nature-kit: [trees, rocks and plants]
    quaternius-ultimate-stylized-nature: [extra stylised foliage]
    kenney-fantasy-town-kit: [village buildings]
    kenney-mini-characters: [tiny villagers]
    polyhaven-rosendal-park-sunset-puresky: [warm sky and lighting]
    kenney-particle-pack: [drifting dust and sparkles]
    font-bebas-neue: [hook title]

- id: top_down_maze_kit
  title: Top-down maze kit (2D pixel art)
  summary: Media pack manifest for top-down maze and dungeon shorts - CC0 1-bit and 16x16 tiles, animated heroes, AStarGrid2D demo, handheld palette, pixel font and retro SFX.
  description: >-
    Use when making a top-down maze or dungeon escape short ('one small adjustment', 'stuck in a maze') in
    Godot 4 at pixel-art scale. Lists CC0 tiles and characters, the MIT AStarGrid2D pathfinding demo, a 4-colour
    palette, a pixel font and CC0 retro sounds, with import presets.
  tags: [maze, top-down, pixel-art, godot, dungeon]
  targets: [godot-4, ffmpeg-video]
  frame: {width: 1080, height: 1920, fps: 30}
  style: |
    - 16x16 tiles scaled by a whole number with `pixel_art_video_fit` (x4 fits a 224-px-wide maze, 14 tiles, inside the 9:16 safe area).
    - Show the path being found: AStarGrid2D steps drawn as a glowing trail, one step per beat of narration.
  assemble: |
    1. Pick tiles from 0x72 DungeonTileset II or Kenney 1-Bit Pack (do not mix the two styles in one maze).
    2. Apply `godot_texture_import_presets --preset pixel-art-2d`; slice sheets with `sprite_sheet_slicer grid --size 16x16`.
    3. Copy the AStarGrid2D logic from the Godot demo; animate the hero along the path.
    4. Optional: quantise everything to the Lospec GB palette for a handheld look, then `check` each frame.
  excluded:
    - "Bundled music in some itch.io packs (licensed separately)."
  assets:
    dungeontileset-ii: [dungeon walls, floors and animated heroes]
    kenney-1-bit-pack: [alternative monochrome maze tiles and icons]
    kenney-micro-roguelike: [8x8 variant for very small mazes]
    kenney-tiny-series: [Tiny Dungeon tiles on the shared 16x16 grid]
    godot-demo-navigation-astar: [pathfinding logic for the maze solver]
    lospec-gb: [optional 4-colour handheld palette]
    font-press-start-2p: [pixel captions and step counter]
    oga-512-sfx: [footsteps, pickups, door sounds]
    kenney-interface-sounds: [caption pops]

- id: top_down_maze_kit_3d
  variant_of: top_down_maze_kit
  title: Top-down maze kit (3D low-poly variant)
  summary: Variant of the maze kit for an angled 3D camera - KayKit and Kenney modular dungeon pieces, skeleton characters and the same grid pathfinding.
  description: >-
    Use when the maze short should be a 3D low-poly scene seen from a high angle instead of pixel art. Swaps the
    tiles for KayKit Dungeon Remastered and Kenney Modular Dungeon Kit pieces and adds CC0 characters; pathfinding
    still runs on a grid.
  tags: [maze, 3d, low-poly, dungeon, godot]
  targets: [godot-4, ffmpeg-video]
  style: |
    - Orthographic or high-angle perspective camera; build walls in a GridMap so the AStarGrid2D grid matches cells.
  assemble: |
    1. Make a MeshLibrary from KayKit/Kenney dungeon pieces and paint the maze in a GridMap.
    2. Mirror the GridMap cells into AStarGrid2D (from the Godot demo) for the solver path.
  excluded:
    - "GDQuest premade characters (CC-BY-NC-SA 4.0) for monetised videos."
  assets:
    kaykit-dungeon-remastered: [modular dungeon walls, props and chests]
    kenney-modular-dungeon-kit: [alternative modular rooms]
    kaykit-skeletons-github: [skeleton characters chasing the hero]
    kenney-mini-characters: [the hero]
    godot-demo-navigation-astar: [grid pathfinding logic]
    polyhaven-industrial-sunset-puresky: [ambient lighting from above]
    kenney-rpg-audio: [footsteps and doors]

- id: platformer_2d_kit
  title: 2D platformer kit (pixel art)
  summary: Media pack manifest for 2D platformer shorts and Godot prototypes - CC0 pixel platformer tiles and characters, Godot demo, input glyphs, pixel font and retro SFX.
  description: >-
    Use when building a 2D side-scrolling platformer scene or short in Godot 4. Lists CC0 tiles and characters
    (Kenney, Pixel Frog, Ansimuz art), the MIT Godot 2D platformer demo, CC0 input-prompt glyphs, an OFL pixel
    font and CC0 retro sounds, with exclusions for licensed music.
  tags: [platformer, 2d, pixel-art, godot]
  targets: [godot-4, ffmpeg-video]
  style: |
    - 18x18 (Kenney) or 16x16 (Pixel Frog) tiles; do not mix grids in one level.
    - Use Kenney Pattern Pack Pixel layers for parallax so the background always moves.
  assemble: |
    1. Start from the Godot 2D platformer demo (MIT) and replace its art with Kenney Pixel Platformer tiles.
    2. Use `pixel-art-2d` imports, Nearest filter and integer stretch (as the demo's project settings do).
    3. Add input glyphs for tutorial captions; credit nothing extra (CC0), but keep the demo's music credit if you keep the music.
  excluded:
    - "Sunny Land's bundled music by Pascal Belisle unless credited."
    - "Pixel Adventure's OpenGameArt mirror (CC-BY 4.0) when the itch.io CC0 copy is available."
  assets:
    kenney-pixel-platformer: [tiles, hero and enemies]
    pixel-adventure-1: [alternative hero and traps]
    sunny-land-art: [parallax forest backgrounds]
    kenney-pattern-pack-pixel: [scrolling background layers]
    godot-demo-2d-platformer: [character controller reference]
    kenney-input-prompts-pixel: [tutorial button glyphs]
    font-pixelify-sans: [pixel captions]
    oga-512-sfx: [jump, coin and hit sounds]

- id: platformer_3d_kit
  variant_of: platformer_2d_kit
  title: 3D platformer kit (low-poly variant)
  summary: Variant of the platformer kit for a 3D low-poly level - Kenney and KayKit platformer pieces, Kenney's Godot 4.6 starter kit and the official 3D platformer demo.
  description: >-
    Use when the platformer should be a 3D low-poly level. Lists Kenney's Platformer Kit and KayKit Platformer
    Pack (CC0), Kenney's MIT/CC0 Godot 3D platformer starter kit and the official 3D platformer demo, plus a
    sunset HDRI and UI sounds.
  tags: [platformer, 3d, low-poly, godot]
  targets: [godot-4, ffmpeg-video]
  style: |
    - Chase camera with gentle lag; bright HDRI; one kit family per level.
  assemble: |
    1. Clone Kenney's Starter Kit 3D Platformer (Godot 4.6) and swap or extend its CC0 pieces.
    2. Compare with the official 3D platformer demo for CharacterBody3D details.
  excluded:
    - "GDQuest third-person controller art (CC-BY-NC-SA 4.0); its MIT code is fine."
  assets:
    kenney-starter-kit-3d-platformer: [ready Godot 4.6 template]
    kenney-platformer-kit: [level blocks and props]
    kaykit-platformer: [alternative stylised pieces]
    godot-demo-3d-platformer: [CharacterBody3D reference]
    polyhaven-sunset-fairway: [sky and lighting]
    kenney-interface-sounds: [UI and pickup sounds]

- id: isometric_town_kit
  title: Isometric town kit (2D tiles)
  summary: Media pack manifest for isometric town and city explainers - CC0 isometric city tiles and blocks, the Godot isometric depth-sorting demo, fonts and UI sounds.
  description: >-
    Use when a short or Godot scene shows a town, city plan or map in 2D isometric view. Lists CC0 Kenney
    isometric tiles and blocks, the MIT Godot isometric demo for depth sorting, caption fonts and CC0 sounds.
  tags: [isometric, town, city, 2d, godot]
  targets: [godot-4, ffmpeg-video]
  style: |
    - Build the town on an isometric TileMapLayer; pan slowly across it while labels pop above buildings.
  assemble: |
    1. Import tiles with `smooth-2d` (these are not pixel-art sized); create an isometric TileSet.
    2. Use the Godot isometric demo's Y-sort setup so characters pass behind buildings.
  excluded: []
  assets:
    kenney-isometric-tiles-city: [roads, buildings and parks]
    kenney-isometric-blocks: [terrain blocks]
    godot-demo-2d-isometric: [depth sorting reference]
    font-inter: [labels above buildings]
    kenney-interface-sounds: [label pops]

