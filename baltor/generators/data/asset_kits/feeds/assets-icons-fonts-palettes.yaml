    url: https://game-icons.net/about.html
    summary: "Large set of single-colour SVG game icons by many authors (Lorc, Delapouite ...). Credit line suggested by the site: 'Icons made by {author}. Available on https://game-icons.net'."
    licence: CC-BY-3.0
    licence_url: https://creativecommons.org/licenses/by/3.0/deed.en
    tags: [icons, svg, game]
    cautions: ["Attribution required per icon author, not just the site.", "A third-party post quotes a CC BY 4.0 footer; record the licence shown when you download."]
