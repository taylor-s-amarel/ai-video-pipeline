id: assets-icons-fonts-palettes
title: "Icons, emoji, fonts and pixel-art palettes for captions, UI and thumbnails"
description: >-
  Open icon sets, emoji artwork, display and pixel fonts, and Lospec palettes for caption styling,
  lower thirds, 'this vs that' comparison boards and pixel-art scenes. Licences differ sharply: ISC/MIT
  icon sets need nothing but the notice in code, CC-BY sets (game-icons.net, Twemoji, Font Awesome
  icons) need a visible credit, OpenMoji is share-alike, and OFL fonts may not be sold on their own.
tags: [icons, emoji, fonts, palettes, captions, ui]
defaults:
  kind: media-source
  verification: search-result
items:
  - id: game-icons-net
