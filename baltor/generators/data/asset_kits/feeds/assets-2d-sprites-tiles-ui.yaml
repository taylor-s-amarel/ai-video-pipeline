id: assets-2d-sprites-tiles-ui
title: "2D sprites, tilesets and UI kits (CC0 first, per-pack terms recorded)"
description: >-
  Pixel-art and vector 2D packs an agent can pull into a Godot 2D scene, a sprite-sheet animation or a
  faceless explainer: Kenney packs (CC0), itch.io CC0 creators, OpenGameArt and Liberated Pixel Cup
  collections. Each item records its licence and the cautions that matter (per-asset licences on
  OpenGameArt, bundled music under different terms, mirrors that disagree on the licence).
tags: [2d, sprites, tilesets, ui, pixel-art, game-assets]
defaults:
  kind: media-source
  verification: search-result
