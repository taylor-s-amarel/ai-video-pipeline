id: assets-3d-low-poly-models
title: "Low-poly 3D model kits (Kenney, Quaternius, KayKit, Poly Pizza, glTF samples)"
description: >-
  Game-ready low-poly 3D kits for dioramas, explainers and Godot/Blender scenes. Almost all are CC0;
  Poly Pizza mixes CC0 and CC-BY per model and Khronos sample models carry per-model licences.
  Prefer glTF/GLB downloads: Godot 4 and Blender import them natively.
tags: [3d, low-poly, models, gltf, game-assets]
defaults:
  kind: media-source
  verification: search-result
  licence: CC0-1.0
