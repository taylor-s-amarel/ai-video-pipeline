  Where new free kits, licence changes and Godot/Blender asset news show up: engine announcements,
  gamedev news sites, the Godot Digest newsletter, Blender community news, Lospec articles and curated
  GitHub lists. Creators are listed through their public professional channels only.
tags: [news, community, creators, godot, blender]
