id: assets-motion-lottie-rive
title: "Motion graphics: Lottie, Rive, Spine and DragonBones (assets and runtimes)"
description: >-
  Vector animation sources and the runtimes that play them. Lottie files from LottieFiles use the Lottie
  Simple License; Rive community files are CC BY; the Spine runtimes are source-available but need a
  Spine Editor licence; DragonBones, lottie-web, dotlottie-web, ThorVG and the Rive runtimes are MIT.
tags: [motion, lottie, rive, spine, vector-animation]
defaults:
  kind: library
  verification: fetched
items:
  - id: lottie-simple-license
    title: "Lottie Simple License (LottieFiles)"
    url: https://lottiefiles.com/page/license
    summary: "Licence for free public animations on LottieFiles: copy, modify, publish and distribute, including commercially; modifications stay under the same licence; no compiling files to build a competing service; attribution encouraged, not required."
    licence: "Lottie Simple License"
    licence_url: https://lottiefiles.com/page/license
    kind: guidance
    verification: search-result
    tags: [lottie, licensing]
    cautions: ["Do not bulk-collect LottieFiles animations into a library or service.", "The help centre also says not to resell or redistribute the original files as standalone animations."]
  - id: lottiefiles-commercial-help
    title: "LottieFiles help: can free animations be used commercially?"
