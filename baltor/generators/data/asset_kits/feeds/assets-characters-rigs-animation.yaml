id: assets-characters-rigs-animation
title: "Characters, rigs and animation sources (licence-checked)"
description: >-
  Rigged characters, humanoid animation libraries and motion-capture sets for stick-figure, low-poly and
  2D sprite shorts. Licences range from CC0 (Kenney, Quaternius, KayKit, MakeHuman exports) to
  use-but-do-not-redistribute (Mixamo) and non-commercial research data (Bandai Namco). The cautions
  field says what you may not do with each.
tags: [characters, rigs, animation, mocap, retargeting]
defaults:
  kind: media-source
  verification: search-result
items:
  - id: mixamo
    title: "Mixamo (Adobe): auto-rigger and animation library"
    url: https://www.mixamo.com/
    summary: "Free auto-rigger and large humanoid animation library (FBX/DAE download). Characters and animations are royalty free for personal, commercial and non-profit projects."
    licence: "Adobe Mixamo terms (royalty-free use in projects; no redistribution of raw files)"
    licence_url: https://helpx.adobe.com/creative-cloud/faq/mixamo-faq.html
    tags: [mixamo, humanoid, fbx, auto-rig]
    cautions:
      - "Never redistribute raw Mixamo character or animation files (FBX/DAE), alone or inside asset packs, templates or engine projects meant as products."
      - "Mixamo content may not be used to train machine-learning models (per the FAQ as reposted on Adobe's community forum)."
      - "Bipedal humanoids only. Keep Mixamo files out of public repositories and Baltor packages; ship a manifest that tells the user to download them."
