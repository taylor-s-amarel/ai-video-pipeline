title: Pixel-art integer scaler for video frames (9:16 default)
summary: Scales pixel art by the largest whole-number factor that fits a 1080x1920 safe area with nearest neighbour, on a solid or tiled background, one scale per animation.
subkind: aspect-format
domain: asset-pipeline
tags: [pixel-art, scaling, shorts, 9x16, video]
step_kinds: [render]
effects:
  filesystem: write
  executes: python
depends_on:
  - {identity: pillow, external: true}
examples:
  - "python pixel_art_video_fit.py frames/*.png --out-dir fitted/ --bg '#1a1c2c'"
