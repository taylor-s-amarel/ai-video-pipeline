# Negative controls: tasks where catalogue access should not change the outcome.
# A treatment-arm advantage here suggests a placebo or prompt effect; a treatment-arm cost
# increase here measures search overhead.
defaults:
  family: controls
  negative_control: true
  budget: xs
  trials: 5
  input_source: {source: synthetic, licence: MIT, notes: Generated by setup/make_fixtures.py from the fixture seed.}
  metrics:
    - name: correct_fraction
      description: Share of answers, lines or rows that exactly match the expected output
      direction: maximize
      weight: 1.0
      scale: [0, 1]
      threshold: 1.0
  hypothesis:
    expected_effect: none
    rationale: >-
      A capable model solves this without outside help, and no catalogue component targets it. Any
      treatment advantage beyond noise points to a placebo or prompt effect; extra treatment-arm tokens
      or tool calls measure the overhead of searching when nothing useful exists.
  expected_components: []
  expected_capabilities: []
  tags: [negative-control, placebo]

tasks:
  - slug: control-fizzbuzz-variant
    domain: coding
    title: FizzBuzz variant with three divisors
    category: control-coding
    summary: Negative control. Write the FizzBuzz-style sequence for 1..N with three divisor words from input.json.
    tests: Exact rule following on a trivial program; no domain knowledge involved.
    params: {kind: fizzbuzz, n_min: 100, n_max: 200, rules: [[3, Fizz], [5, Buzz], [7, Bazz]]}
    prompt: >-
      Produce output.txt from input.json: for each integer i from 1 to n, write one line. The line is the
      concatenation, in rule order, of the word for every rule whose divisor divides i, or the number itself
      when no rule matches.
    requirements:
      - output.txt has exactly n lines, one per integer from 1 to n.
      - Each line is the concatenation (in the order the rules are listed) of the words whose divisor divides i, or i itself when none does.
    deliverables: [{path: output.txt, description: "n lines, no header"}]
    inputs: [{path: input.json}]
    private_files: [expected.txt]

  - slug: control-arithmetic-word-problems
    domain: other
    title: Ten arithmetic word problems
    category: control-reasoning
    summary: Negative control. Answer ten seeded integer word problems exactly.
    tests: Plain arithmetic reasoning.
    params: {kind: arithmetic}
    prompt: Solve every problem in problems.json and write the integer answers to answers.json, keyed by problem id.
    requirements:
      - answers.json is a JSON object mapping each problem id (a string) to its integer answer.
      - Every answer is exactly right.
    deliverables: [{path: answers.json, description: "{\"1\": 123, ...}"}]
    inputs: [{path: problems.json}]
    private_files: [expected.json]

  - slug: control-readme-typo-fix
    domain: other
    title: Fix the typos in a README
    category: control-writing
    summary: Negative control. Correct the planted spelling mistakes in README.md without changing anything else.
    tests: Careful, minimal editing.
    params: {kind: typo_fix, typos: 6}
    metrics:
      - {name: typos_fixed_fraction, description: Share of planted typos corrected, direction: maximize, weight: 0.5, scale: [0, 1], threshold: 1.0}
      - {name: lines_matching_fraction, description: Share of lines identical to the corrected original (catches unrequested edits), direction: maximize, weight: 0.5, scale: [0.8, 1], threshold: 1.0}
    prompt: README.md contains a few spelling mistakes. Fix them in place. Do not change wording, punctuation, spelling variants or layout anywhere else.
    requirements:
      - Every misspelled word in README.md is corrected.
      - No other line, word, punctuation mark or spelling variant changes (British spellings stay British).
    deliverables: [{path: README.md, description: corrected in place}]
    inputs: [{path: README.md}]
    private_files: [expected.md, typos.json]

  - slug: control-csv-two-key-sort
    domain: data-cleaning
    title: Sort a CSV by two keys
    category: control-data
    summary: Negative control. Sort people.csv by last name, then age descending, then first name.
    tests: Exact multi-key sorting with case-insensitive comparison.
    params: {kind: csv_sort, rows: 60}
    prompt: Write sorted.csv containing the rows of people.csv sorted by last_name (case-insensitive, A to Z), then age (numeric, oldest first), then first_name (case-insensitive, A to Z).
    requirements:
      - sorted.csv has the same header and the same rows as people.csv, values unchanged.
      - Rows are ordered by last_name case-insensitively ascending, then age numerically descending, then first_name case-insensitively ascending.
    deliverables: [{path: sorted.csv, description: same columns as people.csv}]
    inputs: [{path: people.csv}]
    private_files: [expected.csv]

  - slug: control-unit-conversion-table
    domain: other
    title: Fill in a unit conversion table
    category: control-reasoning
    summary: Negative control. Fill the result column of conversions.csv to two decimals using exact conversion factors.
    tests: Unit conversion with exact factors.
    params: {kind: unit_conversion, rows: 14, tolerance: 0.011}
    prompt: >-
      Fill the empty result column of conversions.csv in place, rounding to 2 decimals. Use 1 mi = 1.609344 km,
      1 lb = 0.45359237 kg, 1 US gal = 3.785411784 L, 1 ft = 0.3048 m, and F = C x 9/5 + 32.
    requirements:
      - Every row's result equals the converted value rounded to 2 decimals (tolerance 0.011).
      - The other columns and the row order are unchanged.
    deliverables: [{path: conversions.csv, description: result column filled in place}]
    inputs: [{path: conversions.csv}]
    private_files: [expected.json]

  - slug: control-rename-function-refactor
    domain: coding
    title: Rename a function across a small package
    category: control-coding
    summary: Negative control. Rename calc_total to compute_order_total everywhere in a five-file package and keep tests passing.
    tests: Mechanical refactoring across files.
    params: {kind: rename, old_name: calc_total, new_name: compute_order_total}
    runs_agent_code: true
    prompt: Rename the function calc_total to compute_order_total everywhere in this workspace (definition, imports, calls, exports and tests). Behaviour must not change.
    requirements:
      - The name calc_total no longer appears in any .py file.
      - shop.compute_order_total, Cart.total and invoice_line return the same values as before for any items and tax rate.
      - python3 -m pytest -q tests passes.
    deliverables: [{path: shop/, description: refactored package}, {path: tests/, description: updated tests}]
    inputs: [{path: shop/}, {path: tests/test_shop.py}]
    private_files: [expected.json]

  - slug: control-yaml-to-json
    domain: coding
    title: Convert a YAML config to JSON
    category: control-data
    summary: Negative control. Convert config.yaml to config.json with identical data, including quoted numbers and nulls.
    tests: Faithful data conversion (strings that look like numbers stay strings).
    params: {kind: yaml_to_json}
    prompt: Write config.json containing exactly the same data as config.yaml (same keys, types and values).
    requirements:
      - config.json parses as JSON and equals the data in config.yaml under standard YAML 1.2 core rules (quoted values stay strings, null stays null, multi-line block text keeps its newlines).
    deliverables: [{path: config.json, description: the converted data}]
    inputs: [{path: config.yaml}]
    private_files: [expected.json]

  - slug: control-leap-year-function
    domain: coding
    title: Write a leap-year function
    category: control-coding
    summary: Negative control. Implement is_leap_year(year) in leap.py for the Gregorian rules.
    tests: A classic small function with well-known edge cases.
    params: {kind: leap_year, random_years: 25}
    runs_agent_code: true
    prompt: Create leap.py with a function is_leap_year(year) that returns True for Gregorian leap years and False otherwise.
    requirements:
      - leap.py defines is_leap_year(year) taking an int and returning a bool.
      - The result is correct for every year from 1 to 3000 under Gregorian rules (divisible by 4, except centuries not divisible by 400).
    deliverables: [{path: leap.py, description: the function}]
    inputs: [{path: README.md}]
    private_files: [expected.json]

  - slug: control-word-frequency-count
    domain: data-cleaning
    title: Top ten word frequencies
    category: control-data
    summary: Negative control. Count words in text.txt, excluding stopwords, and write the top ten with counts.
    tests: Deterministic counting with a stated tokenisation and tie-break rule.
    params: {kind: word_freq, sentences: 120}
    prompt: >-
      Write freq.json: a JSON list of [word, count] pairs for the ten most frequent words in text.txt. Lower-case
      the text, treat each maximal run of letters a-z as a word, drop the words in stopwords.txt, and sort by count
      (highest first), breaking ties alphabetically.
    requirements:
      - freq.json is a list of exactly ten [word, count] pairs.
      - Words are maximal runs of a-z after lower-casing; stopwords are excluded; order is count descending, then word ascending.
    deliverables: [{path: freq.json, description: "[[word, count], ...]"}]
    inputs: [{path: text.txt}, {path: stopwords.txt}]
    private_files: [expected.json]
